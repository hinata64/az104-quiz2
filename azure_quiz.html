ェア（この場合はNGINX）を自動的にインストール・構成するには、VM拡張機能（Desired State Configuration（DSC）拡張機能やカスタムスクリプト拡張機能など）を使用するのが最適です。これにより、OSの構成状態を宣言的に定義し、デプロイ時に一貫したセットアップを適用できます。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":88},{"question":"（注：この問題は同じシナリオを提示する一連の質問の一部です。）\n「AKS1」という名前のAzure Kubernetes Service（AKS）クラスターをデプロイします。\nYAMLファイルをAKS1にデプロイする必要があります。\n解決策：Azure Cloud Shellから、「az aks」コマンドを実行する。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"「az aks」コマンドは、AKSクラスター自体（ノード数の増減やバージョンのアップグレードなど）を管理するためのAzure CLIコマンドです。YAMLファイルを使用してAKSクラスター内部へアプリケーション（ポッドやデプロイメントなど）をデプロイする場合は、「kubectl apply -f <filename>.yaml」コマンドを使用する必要があります。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":89},{"question":"リソースグループを作成し、そのリソースグループにAzureストレージアカウントをデプロイするAzure Resource Manager (ARM) テンプレートを開発します。\n\nこのテンプレートをデプロイするには、どのコマンドレットを実行する必要がありますか？","options":[{"label":"A","text":"New-AzResource"},{"label":"B","text":"New-AzResourceGroupDeployment"},{"label":"C","text":"New-AzTenantDeployment"},{"label":"D","text":"New-AzDeployment"}],"correct":"D","explanation":"既存のリソースグループの中にリソースのみを展開する場合は New-AzResourceGroupDeployment を使用します。しかし、テンプレート内で「新しいリソースグループの作成」を含んでいる場合、そのデプロイの対象スコープはリソースグループ単位ではなく、一つ上の「サブスクリプションレベル」になります。サブスクリプションスコープでARMテンプレートをデプロイするためのコマンドは New-AzDeployment です。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":90},{"question":"VM1、VM2、およびVM3という3つの仮想マシンを含むAzureサブスクリプションがあります。すべての仮想マシンは、AVSet1という名前の可用性セット内にあります。\nVM1を新しい仮想マシンサイズにスケールアップする必要がありますが、目的のサイズが利用できません。\n最初に何をすべきですか？","options":[{"label":"A","text":"近接配置グループを作成する。"},{"label":"B","text":"VM1の割り当てを解除する。"},{"label":"C","text":"AvSet1をマネージド可用性セットに変換する。"},{"label":"D","text":"VM3とVM3をシャットダウンする。（※原文のまま。本来はVM2とVM3の誤記と考えられます）"}],"correct":"D","explanation":"可用性セット内の仮想マシンのサイズを変更しようとして目的のサイズが選択肢にない場合、その可用性セットが配置されている現在の物理ハードウェアクラスターが、そのVMサイズをサポートしていないことを意味します。この問題を解決するには、可用性セット内の「すべて」の仮想マシン（VM1だけでなくVM2とVM3も）の割り当てを解除（停止/シャットダウン）する必要があります。全VMが停止した状態でVM1のサイズを変更し、再度起動することで、新しいサイズをサポートする適切なハードウェアクラスターに可用性セット全体が再割り当てされます。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":91},{"question":"（注：この問題は、同じシナリオを提示する一連の質問の一部です。）\nimage1という名前のイメージを含む、Registry1という名前のAzureコンテナーレジストリ（ACR）があります。\nimage1を使用してコンテナーインスタンス（ACI）をデプロイしようとすると、エラーメッセージが表示されます。\nimage1を使用してコンテナーインスタンスをデプロイできるようにする必要があります。\n解決策：Registry1の「管理者ユーザー（Admin user）」を「有効」に設定する。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Azure Container Instances (ACI) などをデプロイする際、Azure Container Registry (ACR) にあるプライベートイメージ（image1）をプル（取得）するには、レジストリに対する認証が必要です。ACRの「管理者ユーザー」を有効にすると、レジストリ名と管理者パスワードを使用してACIが認証を行い、イメージをプルできるようになるため、この解決策は目標を満たしています。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":92},{"question":"Azureサブスクリプションがあります。\n次の表に示すAzureコンテナーインスタンスをデプロイする予定です。\n\n（※表の詳細は省略されていますが、OSタイプが異なるインスタンスが混在しています）\nどのインスタンスを同じコンテナーグループにデプロイできますか？","options":[{"label":"A","text":"Instance1 のみ"},{"label":"B","text":"Instance2 のみ"},{"label":"C","text":"Instance1 と Instance2 のみ"},{"label":"D","text":"Instance3 と Instance4 のみ"}],"correct":"C","explanation":"Azure Container Instances (ACI) において、複数のコンテナーを「同じコンテナーグループ（マルチコンテナー グループ）」にデプロイする場合、グループ内のコンテナーはすべて「同じOSタイプ（Linux同士、またはWindows同士）」である必要があります。LinuxコンテナーとWindowsコンテナーを同一のコンテナーグループ内に混在させることはできません。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":93},{"question":"Azureサブスクリプションがあります。\n次の表に示すリソース（VM1、VNET1、NIC1、IP1、NSG1など）をデプロイする予定です。\n\nこれらのリソースを展開するために使用される単一のAzure Resource Manager (ARM) テンプレートを作成する必要があります。\nVM1の dependsOn セクションにはどのリソースを追加する必要がありますか？","options":[{"label":"A","text":"VNET1"},{"label":"B","text":"NIC1"},{"label":"C","text":"IP1"},{"label":"D","text":"NSG1"}],"correct":"B","explanation":"ARMテンプレートでリソース間の作成順序（依存関係）を制御する際に dependsOn を使用します。Azure仮想マシン（VM1）をデプロイするためには、そのVMに接続するためのネットワークインターフェイス（NIC1）が先にプロビジョニングされている必要があります。そのため、VM1の dependsOn 要素には直接の依存先であるNIC1を指定します。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":94},{"question":"Azureサブスクリプションがあります。\n「Template.json」という名前のAzure Resource Manager (ARM) テンプレートを作成します。（※画像内にサブスクリプションデプロイメントのスキーマなどが記述されています）\n\nTemplate.jsonをデプロイする必要があります。\nAzure Cloud ShellからどのPowerShellコマンドレットを実行すべきですか？","options":[{"label":"A","text":"New-AzSubscriptionDeployment"},{"label":"B","text":"New-AzManagementGroupDeployment"},{"label":"C","text":"New-AzResourceGroupDeployment"},{"label":"D","text":"New-AzTenantDeployment"}],"correct":"A","explanation":"一般的なテンプレート（既存のリソースグループ内にリソースを作るもの）であれば New-AzResourceGroupDeployment を使用します。しかし、テンプレート自体の中で「新しいリソースグループを作成する」ような定義が含まれている場合、そのデプロイスコープはサブスクリプションレベルとなるため、New-AzSubscriptionDeployment（または New-AzDeployment）コマンドレットを使用する必要があります。試験の画像内に subscriptionDeploymentTemplate.json というスキーマ定義があれば、Aが正解となります。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する\n\n【問題文＃101】\nRG1 という名前のリソースグループを含む Azure サブスクリプションがあります。\nstorage1 という名前のストレージアカウントを作成する予定です。\nFile1 という名前の Bicep ファイルがあります。\nRG1 への storage1 のデプロイを自動化するために使用できるように、File1 を変更する必要があります。\nどのプロパティを変更する必要がありますか？\n\nA. kind\nB. scope\nC. sku\nD. location","id":95},{"question":"Group1 という名前のコンテナーグループを含む Azure サブスクリプションがあります。Group1 には、以下の表に示す 2 つの Azure コンテナーインスタンスが含まれています。\n\ncontainer2 が container1 に悪影響を与えずに CPU リソースを使用できるようにする必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"container1 のリソース制限を 3 CPU に増やす。"},{"label":"B","text":"container2 のリソース制限を 6 CPU に増やす。"},{"label":"C","text":"両方のコンテナーのリソース制限を削除する。"},{"label":"D","text":"container2 のリソース制限を 2 CPU に減らす。"}],"correct":"C","explanation":"Azure Container Instances (ACI) において、リソース制限 (Limit) を指定しない場合、そのコンテナーの最大リソース使用量は、自身のリソース要求 (Request) の値と等しくなる仕様になっています[][]。つまり、リソース制限を削除することで、各コンテナーは自身が要求した分（固定の割り当て分）のリソース量しか使用できなくなり、上限を超えて他のコンテナーの CPU リソースを奪い合うことがなくなります[]。これにより、container2 が container1 に悪影響を与えるのを防ぐことができます。\n【関連する出題項目】③Azure のコンピューティング リソースをデプロイおよび管理する\n\n【問題文＃111】\nAzure サブスクリプションがあります。\nコンテナーをデプロイする予定です。\nコンテナーを自動的にスケーリングできる Azure サービスを推奨する必要があります。","id":96},{"question":"Windows Server 2019 を実行する VM1 という名前の Azure VM を作成します。\nVM1 は展示（図）に示されているように構成されています。（※通常、ステータスが「停止済み (割り当て解除)」であることが示されています）\n\nVM1 の Desired State Configuration (DSC) を有効にする必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"VM1 に接続する。"},{"label":"B","text":"VM1 を開始する (Start VM1)。"},{"label":"C","text":"VM1 のスナップショットをキャプチャする。"},{"label":"D","text":"VM1 の DNS 名を構成する。"}],"correct":"B","explanation":"Azure 仮想マシンの状態が「停止済み (割り当て解除)」(Stopped (Deallocated)) になっている場合、VM 拡張機能である Desired State Configuration (DSC) をインストールおよび有効化することはできません。拡張機能を VM オペレーティング システムにプッシュするためには、VM が「実行中 (Running)」である必要があるため、最初に VM を開始する必要があります。\n【関連する出題項目】③Azure のコンピューティング リソースをデプロイおよび管理する","id":97},{"question":"「Subscription1」という名前のAzureサブスクリプションがあります。Subscription1には「VM1」という名前の仮想マシンが含まれています。\nWindows 10を実行する「Computer1」という名前のコンピューターがあります。Computer1はインターネットに接続されています。\n展示に示されているように、VM1に「vm1173」という名前のネットワークインターフェイスを追加します。\n\nComputer1から、リモートデスクトップ（RDP）を使用してVM1に接続しようと試みますが、接続に失敗します。\nVM1へのリモートデスクトップ接続を確立する必要があります。\nまず何をすべきですか？","options":[{"label":"A","text":"RDPルールの優先度を変更する"},{"label":"B","text":"ネットワークインターフェイスをアタッチする"},{"label":"C","text":"DenyAllInBoundルールを削除する"},{"label":"D","text":"VM1を起動する"}],"correct":"D","explanation":"Azure仮想マシンに対して、既存のネットワークインターフェイスを追加・変更できるのは、仮想マシンが「停止済み（割り当て解除済み）」の状態である場合のみです。問題文で「ネットワークインターフェイスを追加した」と記載されていることから、現在のVM1は停止状態であると判断できます。RDP接続を確立するためには、まずVM1を起動する必要があります。\n\n【関連する出題項目】\n③Azure のコンピューティング リソースをデプロイおよび管理する","id":98},{"question":"Azureサブスクリプションがあります。\n複数のポッドを含むAzure Kubernetes Service (AKS) クラスターをデプロイしています。ポッドは「kubenet」ネットワークを使用します。\nポッド間のネットワークトラフィックを制限する必要があります。\nAKSクラスターで何を構成すべきですか？","options":[{"label":"A","text":"Azure ネットワークポリシー (the Azure network policy)"},{"label":"B","text":"Calico ネットワークポリシー (the Calico network policy)"},{"label":"C","text":"ポッドセキュリティポリシー (pod security policies)"},{"label":"D","text":"アプリケーションセキュリティグループ (an application security group)"}],"correct":"B","explanation":"AKSでポッド間の通信制御（ネットワークポリシー）を適用したい場合、ネットワークプラグインに「kubenet（基本）」を使用している構成では、オープンソースベースの「Calicoネットワークポリシー」を選択する必要があります。「Azureネットワークポリシー」は、Azure CNI（高度なネットワーク）を使用している場合にのみサポートされます。\n\n【関連する出題項目】\n③Azure のコンピューティング リソースをデプロイおよび管理する（または ④仮想ネットワークを実装および管理する）","id":99},{"question":"次の表に示すリソースを含む Azure サブスクリプションがあります（※表：VM1 が TestSubnet1 を含む VNET1 に接続されている）。\n\nAzure Site Recovery を構成して、米国東部と米国西部のリージョン間で VM1 をレプリケートします。\nVM1 のテストフェールオーバーを実行し、ターゲット仮想ネットワークとして VNET2 を指定します。\nVM1 のテストバージョンが作成されたとき、仮想マシンはどのサブネットに接続されますか？","options":[{"label":"A","text":"TestSubnet1"},{"label":"B","text":"DemoSubnet1"},{"label":"C","text":"RecoverySubnetA"},{"label":"D","text":"RecoverySubnetB"}],"correct":"A","explanation":"Azure Site Recovery においてテストフェールオーバーを実行する際、ターゲットの仮想ネットワーク（VNET2）内に、ソース VM が接続されていたサブネット名と同じ名前のサブネットが存在する場合、自動的にそのサブネットに接続されます。\n【関連する出題項目】③Azure のコンピューティング リソースをデプロイおよび管理する","id":100},{"question":"Sub1 と Sub2 という名前の 2 つの Azure サブスクリプションがあります。\nSub1 には、VM1 という名前の仮想マシンと storage1 という名前のストレージアカウントが含まれています。\nVM1 は、次の表に示すリソースに関連付けられています（※表には Disk1、NetInt1、VNet1 が記載されています）。\n\nVM1 を Sub2 に移動する必要があります。\nどのリソースを Sub2 に移動するべきですか？","options":[{"label":"A","text":"VM1、Disk1、および NetInt1 のみ"},{"label":"B","text":"VM1、Disk1、および VNet1 のみ"},{"label":"C","text":"VM1、Disk1、および storage1 のみ"},{"label":"D","text":"VM1、Disk1、NetInt1、および VNet1"}],"correct":"D","explanation":"Azure の制限事項として、仮想マシン (VM) を別のサブスクリプションに移動する場合、VM に関連付けられているすべての依存ネットワークリソース（ネットワークインターフェイス：NetInt1）、およびそのインターフェイスが接続されている仮想ネットワーク (VNet1) を、すべて一緒に同じターゲットサブスクリプションに移動する必要があります。当然、マネージドディスク (Disk1) も含まれます。\n【関連する出題項目】③Azure のコンピューティング リソースをデプロイおよび管理する","id":101},{"question":"Windows Server 2019 を実行する VM1 という名前の Azure 仮想マシンを作成します。\nVM1 は展示に示されているように構成されています（※展示：VM1 が「停止 (割り当て解除)」状態であることが示されている）。\n\nVM1 に対して Desired State Configuration (DSC) を有効にする必要があります。\nまず何をすべきですか？","options":[{"label":"A","text":"VM1 に接続する。"},{"label":"B","text":"VM1 を起動する。"},{"label":"C","text":"VM1 のスナップショットを取得する。"},{"label":"D","text":"VM1 の DNS 名を構成する。"}],"correct":"B","explanation":"VM 拡張機能（DSC 拡張機能など）をインストールおよび構成して有効化するためには、仮想マシンに Azure VM エージェントが実行されており、VM 自体が実行中（起動状態）である必要があります。展示から VM1 が停止状態であると判断できるため、まずは VM を起動する必要があります。\n【関連する出題項目】③Azure のコンピューティング リソースをデプロイおよび管理する","id":102},{"question":"100台の仮想マシンを含むAzureサブスクリプションがあります。\nあなたは定期的に仮想マシンを作成および削除します。\n削除可能なアタッチされていない（接続されていない）ディスクを特定する必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"Azure Cost Managementから、コスト分析を表示する"},{"label":"B","text":"Azure Advisorから、Advisorの構成を変更する"},{"label":"C","text":"Microsoft Azure Storage Explorerから、アカウント管理のプロパティを表示する"},{"label":"D","text":"Azure Cost Managementから、Advisorの推奨事項を表示する"}],"correct":"D","explanation":"VMを削除しても、そのVMに接続されていたマネージドディスクが自動的に削除されずに「アタッチされていない状態（Unattached）」で残り、課金が続いてしまうことがあります。Azure Advisor（Cost Managementの「Advisorの推奨事項」からもアクセス可能）の「コスト最適化」を利用すると、アタッチされていない無駄なディスクを自動的に検出し、削除するよう推奨してくれます。\n【関連する出題項目】\n③Azure のコンピューティング リソースをデプロイおよび管理する","id":103},{"question":"contoso.azurewebsites.netという名前のAzure Webアプリで、www.contoso.com をホストするように構成する必要があります。\n最初に何をすべきですか？\nA. www.contoso.com および asuid.contoso.com という名前のAレコードを作成する。","options":[{"label":"A","text":"www.contoso.com および asuid.contoso.com という名前のAレコードを作成する。"},{"label":"B","text":"ドメイン検証IDを含む asuid という名前のTXTレコードを作成する。"},{"label":"C","text":"ドメイン検証IDを含む asuid という名前のCNAMEレコードを作成する。"},{"label":"D","text":"contoso.azurewebsites.net を値に持つ www.contoso.com という名前のTXTレコードを作成する。"}],"correct":"B","explanation":"App Service Webアプリにカスタムドメインを割り当てるには、事前にDNS側でドメインの所有権を証明（検証）する必要があります。所有権の検証には、Azureポータルで提供される「カスタム ドメイン検証 ID」を、DNSプロバイダー側で特定のTXTレコード（通常は asuid や asuid.www）として追加することが最初のステップとなります。\n【関連する出題項目】\n③Azure のコンピューティング リソースをデプロイおよび管理する\n\n【問題文＃4】Topic 15 - Question #2\n\n問題文：\nVM1とVM2を、ロードバランサー (LB1) のバックエンドプールに追加する必要があります。最初に何をすべきですか？\n\nA. VM2を VNET1/Subnet1 に接続する。\nB. VM1とVM2を同じ「可用性ゾーン (Availability Zone)」に再デプロイする。\nC. VM1とVM2を同じ「可用性セット (Availability Set)」に再デプロイする。\nD. 新しいNSGを作成し、そのNSGを VNET1/Subnet1 に関連付ける。\n\n回答：\nC\n\n解説：\n技術要件により作成する「LB1」は、Basic SKU のAzure Load Balancerです。","id":104},{"question":"（※前提条件は問題文＃24と同じです）\n\n解決策：VirtualNetworkB で「ゲートウェイ転送を許可する (Allow gateway transit)」設定を選択する。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"VirtualNetworkB 自身には VPN ゲートウェイが存在しないため、VirtualNetworkB 側で「ゲートウェイ転送を許可する」を設定することはできません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":105},{"question":"（※前提条件は問題文＃24と同じです）\n\n解決策：Windows 10 ワークステーションに VPN クライアント構成パッケージをダウンロードして再インストールする。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Azure 仮想ネットワークに新しくピアリングを追加（または変更）した場合、ポイント対サイト (P2S) で接続しているクライアントPCは、新しいネットワーク (VirtualNetworkB) のルーティング情報を自動的には取得しません。これを解決するためには、Azure portal から最新の VPN クライアントパッケージをダウンロードし、再インストールしてクライアントのルーティングテーブルを更新する必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":106},{"question":"あなたの会社には、Microsoft Azure でホストされている仮想マシン (VM) があります。これらの VM は、VNet1 という名前の単一の Azure 仮想ネットワーク内に配置されています。\n会社にはリモートで作業するユーザーがいます。リモートワーカーは VNet1 上の VM へのアクセスを必要としています。\nあなたはリモートワーカーにアクセスを提供する必要があります。\n何をするべきですか？","options":[{"label":"A","text":"サイト間 (S2S) VPN を構成する。"},{"label":"B","text":"VNet 間 (VNet-to-VNet) VPN を構成する。"},{"label":"C","text":"ポイント対サイト (P2S) VPN を構成する。"},{"label":"D","text":"Windows Server 2012 サーバー VM で DirectAccess を構成する。"},{"label":"E","text":"マルチサイト VPN を構成する。"}],"correct":"C","explanation":"自宅や外出先などから個々のクライアントコンピューター（リモートワーカー）が Azure 仮想ネットワークに対して安全な接続を確立する場合、「ポイント対サイト (P2S) VPN」を使用するのが適切なソリューションです。サイト間 (S2S) VPN は拠点（オンプレミスのオフィスネットワーク全体）からの接続に使用されます。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":107},{"question":"（※前提条件は問題文＃28と同じです）\n\n解決策：「セッションの永続性 (Session persistence)」を「クライアント IP」に設定する。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"SQL Server Always On リスナーの負荷分散規則においては、クライアントの接続を特定のクラスターノードに常に固定（アフィニティ）させる必要はありません。したがって、「セッションの永続性」は「なし (None)」のままにしておくのが正しい構成です。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":108},{"question":"（※前提条件は問題文＃28と同じです）\n\n解決策：「フローティング IP (Floating IP)」を有効にする。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"SQL Server Always On 可用性グループのリスナー用途で Azure ロードバランサーを構成する場合、負荷分散規則で必ず「フローティング IP（Direct Server Return：DSR）」を有効にする必要があります。これを有効にすることで、バックエンドにある SQL Server VM がロードバランサーの IP アドレス宛のトラフィックを直接処理できるようになります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":109},{"question":"あなたの会社には SRV01 と SRV02 という名前の2つのオンプレミスサーバーがあります。開発者は SRV01 上で実行されるアプリケーションを作成しました。このアプリケーションは、IP アドレスによって SRV02 上のサービスを呼び出します。\nあなたは、このアプリケーションを Azure 仮想マシン (VM) に移行することを計画しています。Azure 仮想ネットワーク内の単一のサブネット上に2つのVMを構成しました。\nこれら2つのVMに静的な内部IPアドレスを構成する必要があります。\n何をするべきですか？","options":[{"label":"A","text":"New-AzureRMVMConfig PowerShell コマンドレットを実行する。"},{"label":"B","text":"Set-AzureSubnet PowerShell コマンドレットを実行する。"},{"label":"C","text":"Azure 管理ポータルで VM のプロパティを変更する。"},{"label":"D","text":"Windows の「ネットワークと共有センター」で IP プロパティを変更する。"},{"label":"E","text":"Set-AzureStaticVNetIP PowerShell コマンドレットを実行する。"}],"correct":"C","explanation":"Azure 仮想マシンに静的（固定）プライベートIPアドレスを割り当てる場合、ゲストOS内（Windowsのネットワーク設定など）で変更してはなりません。Azure portal を介して、VM にアタッチされている「ネットワークインターフェイス (NIC)」のIP構成プロパティを「動的 (Dynamic)」から「静的 (Static)」に変更するのが正しい手順です。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":110},{"question":"あなたの会社には Azure Active Directory (Azure AD) のサブスクリプションがあります。\n会社の仮想ネットワークサブネットに5つの仮想マシン (VM) をデプロイする必要があります。\nこれらの VM はそれぞれ、パブリック IP アドレスとプライベート IP アドレスの両方を持ちます。これらすべての仮想マシンのインバウンド（受信）およびアウトバウンド（送信）セキュリティルールは同一である必要があります。\nこの構成に必要なネットワークインターフェイスの「最小数」は次のうちどれですか？","options":[{"label":"A","text":"5"},{"label":"B","text":"10"},{"label":"C","text":"20"},{"label":"D","text":"40"}],"correct":"A","explanation":"仮想マシンが Azure ネットワークと通信するためには、各 VM に最低1つのネットワークインターフェイス (NIC) が必要です。デプロイする VM の数が5つであるため、必要な NIC の最小数は5つになります（1つの NIC にパブリックIPとプライベートIPを割り当てることが可能です）。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":111},{"question":"*(※注：この問題は、同じシナリオを提示する一連の問題の一部です)*\nAdmin1 という名前の Azure Active Directory (Azure AD) ユーザーに、Azure サブスクリプションの Traffic Analytics (トラフィック分析) を有効にするために必要なロールが確実に割り当てられるようにする必要があります。\n解決策： サブスクリプション レベルで Admin1 に ネットワーク コントリビューター (Network Contributor) ロールを割り当てます。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Traffic Analytics (トラフィック分析) を有効にするには、ユーザーが対象のサブスクリプション スコープにおいて「所有者 (Owner)」「共同作成者 (Contributor)」「閲覧者 (Reader)」または「ネットワーク コントリビューター」のいずれかの Azure ロールを持っている必要があります（この他に Log Analytics ワークスペース側の権限も必要ですが、サブスクリプションレベルの要件としてはこれを満たしています）。したがって、ネットワーク コントリビューター ロールの割り当ては要件を満たします[][]。\n【関連する出題項目】 ④仮想ネットワークを実装および管理する / ⑤Azure リソースの監視と管理","id":112},{"question":"adatum.com という名前の Azure DNS ゾーンがあります。\nresearch.adatum.com という名前のサブドメインを、Azure 内の別の DNS サーバーに委任する必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"adatum.com ゾーンに research という名前の NS レコードを作成する。"},{"label":"B","text":"adatum.com ゾーンに research という名前の PTR レコードを作成する。"},{"label":"C","text":"adatum.com の SOA レコードを変更する。"},{"label":"D","text":"adatum.com ゾーンに *.research という名前の A レコードを作成する。"}],"correct":"A","explanation":"サブドメイン (この場合は research.adatum.com) の名前解決の権限を別の DNS サーバーに委任 (デリゲーション) するには、親ゾーンである adatum.com の設定において、サブドメイン名 (research) に対応する ネーム サーバー (NS) レコード を作成し、委任先の DNS サーバーのアドレス（FQDN）を指定する必要があります。\n【関連する出題項目】 ④仮想ネットワークを実装および管理する","id":113},{"question":"contoso.com という登録済みの DNS ドメインがあります。\ncontoso.com という名前のパブリック Azure DNS ゾーンを作成します。\ncontoso.com ゾーンで作成されたレコードが、インターネットから名前解決できることを確認する必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"contoso.com 内に NS レコードを作成する。"},{"label":"B","text":"DNS ドメイン レジストラで SOA レコードを変更する。"},{"label":"C","text":"contoso.com 内に SOA レコードを作成する。"},{"label":"D","text":"DNS ドメイン レジストラで NS レコードを変更する。"}],"correct":"D","explanation":"Azure DNS にパブリック ゾーンを作成しただけでは、インターネット上の DNS クエリは Azure DNS に転送されません。対象ドメインへのリクエストを Azure DNS にルーティング（委任）するには、ドメインを購入・管理している大元のレジストラ側で、ネーム サーバー (NS) レコードの値を Azure DNS が提供する 4 つのネームサーバーのアドレスに変更する必要があります。\n【関連する出題項目】 ④仮想ネットワークを実装および管理する\n\n★【問題文＃45】\n\nHOTSPOT -\nVNet1 という名前の仮想ネットワークを含む、Subscription1 という名前の Azure サブスクリプションがあります。\n次の表のユーザーを追加します。\n*(※ユーザーと割り当てられたロールの表が欠落しています)*\n\n各構成を実行できるのはどのユーザーですか？解答エリアで適切なオプションを選択してください。","id":114},{"question":"オンプレミスネットワークにはVPNゲートウェイが含まれています。\n次の表に示すリソースを含むAzureサブスクリプションがあります。\nVM1からstorage1へのすべてのトラフィックがMicrosoftのバックボーンネットワークを経由して移動するようにする必要があります。\nあなたは何を構成すべきですか？\n\n- Azure Application Gateway","options":[{"label":"B","text":"プライベートエンドポイント (private endpoints)"},{"label":"C","text":"ネットワークセキュリティグループ (NSG)"},{"label":"D","text":"Azure Virtual WAN"}],"correct":"B","explanation":"仮想マシン (VM1) から Azure Storage (storage1) へのトラフィックをパブリックインターネットに出すことなく、Microsoft バックボーンネットワーク内で完結させるためには、Azure Private Link（プライベートエンドポイント）またはサービスエンドポイントを構成する必要があります。選択肢の中でこの要件を満たすのはプライベートエンドポイントです。\n【関連する出題項目】④","id":115},{"question":"オンプレミスネットワークには VPN ゲートウェイが含まれています。\n次の表に示すリソースを含む Azure サブスクリプションがあります。\n\nVM1 から storage1 へのすべてのトラフィックが Microsoft バックボーン ネットワークを経由して移動するようにする必要があります。\nあなたは何を構成すべきですか？","options":[{"label":"A","text":"Azure AD Application Proxy"},{"label":"B","text":"プライベートエンドポイント (private endpoints)"},{"label":"C","text":"ネットワークセキュリティグループ (NSG)"},{"label":"D","text":"Azure Peering Service"}],"correct":"B","explanation":"仮想マシンからストレージアカウントへのトラフィックをパブリックインターネットに出すことなく、Microsoft バックボーン ネットワーク内で安全にルーティングするためには、「プライベート エンドポイント (Azure Private Link)」または「サービス エンドポイント」を構成します。選択肢の中ではプライベートエンドポイントが正解です。\n【関連する出題項目】④","id":116},{"question":"次の表に示すリソースを含む Azure サブスクリプションがあります。\n\nstorage1 と VM1 の間のデータ転送がインターネットを経由しないようにする必要があります。\nstorage1 に対して何を構成すべきですか？","options":[{"label":"A","text":"データ保護 (data protection)"},{"label":"B","text":"プライベートエンドポイント (a private endpoint)"},{"label":"C","text":"ファイアウォールと仮想ネットワーク設定の「パブリックネットワークアクセス (Public network access)」"},{"label":"D","text":"Shared Access Signature (SAS)"}],"correct":"B","explanation":"仮想マシン (VM1) からストレージアカウント (storage1) へのトラフィックを、パブリックインターネットに出さずに Microsoft のバックボーンネットワーク内のみで完結させるためには、「プライベートエンドポイント (Azure Private Link)」または「サービスエンドポイント」を構成する必要があります。選択肢の中ではプライベートエンドポイントが正解です。\n【関連する出題項目】④","id":117},{"question":"（※リソース一覧の表：VM1 が VNET1 に接続されている）\nVM1 は VNET1 に接続しています。\nVM1 を VNET2 に接続する必要があります。\nソリューション：VM1 を RG2 (別のリソースグループ) に移動し、その後 VM1 に新しいネットワークインターフェース (NIC) を追加します。\nこれは目標を達成していますか？\n\n- はい","options":[{"label":"B","text":"いいえ"}],"correct":"B","explanation":"Azure の仕様上、一度作成された仮想マシン (VM) を直接別の仮想ネットワーク (VNet) に移動することはできません。また、VM に追加する新しいネットワークインターフェース (NIC) も、既存のVMが所属しているのと同じ VNet に存在する必要があります。\nVM を別の VNet (VNET2) に接続するための正しい手順は、現在の VM を削除し（OSディスクやデータディスクは保持します）、その既存のディスクを再利用して VNET2 に接続する新しいVMを作成することです。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":118},{"question":"問題文：\nあなたは、以下のプロバイダーが登録されている Subscription1 という名前の Azure サブスクリプションを持っています：\nAuthorization、Automation、Resources、Compute、KeyVault、Network、Storage、Billing、Web\nSubscription1 には、以下の構成を持つ VM1 という名前の Azure 仮想マシンが含まれています：\n・プライベート IP アドレス: 10.0.0.4 (動的)\n・ネットワーク セキュリティ グループ (NSG): NSG1\n・パブリック IP アドレス: なし\n・可用性セット: AVSet\n・サブネット: 10.0.0.0/24\n・マネージド ディスク: いいえ\n・場所: 米国東部 (East US)\nあなたは、VM1 へのすべての成功した接続試行と失敗した接続試行を記録する必要があります。\nどの 3 つのアクションを実行すべきですか？各正解はソリューションの一部を示します。\n注: それぞれの正しい選択は 1 ポイントの価値があります。","options":[{"label":"A","text":"米国東部 Azure リージョンで Azure Network Watcher を有効にする。"},{"label":"B","text":"Azure Network Watcher の接続モニターを追加する。"},{"label":"C","text":"MicrosoftLogAnalytics プロバイダーを登録する。"},{"label":"D","text":"Azure ストレージ アカウントを作成する。"},{"label":"E","text":"Microsoft.Insights リソース プロバイダーを登録する。\nF. Azure Network Watcher フロー ログを有効にする。"}],"correct":"A","explanation":"Azure VM（NSG）への通信トラフィックの許可・拒否（成功・失敗した接続試行）を記録するには、Network Watcherの「NSG フローログ（Flow Logs）」機能を利用します[][]。\nこれを構成するための主要な 3 つのアクションは以下の通りです。\n\n- 対象のリージョン（East US）で Network Watcher を有効にする（A）[][]。\n\n- フローログのデータを保存するためのストレージアカウントを作成する（D）[][]。\n\n- 該当のNSG（NSG1）に対して Azure Network Watcher フローログを有効にする（F）[][]。\n※なお、NSGフローログを有効にするには内部的に Microsoft.Insights リソースプロバイダーの登録（E）も要件となりますが、設定の根幹を成す「ネットワークウォッチャー」「ストレージ」「フローログ有効化」の組み合わせ（A, D, F）が試験の模範解答として最も一般的に扱われます[][]。\n【関連する出題項目】\n④ 仮想ネットワークを実装および管理する\n⑤ Azure リソースの監視と管理","id":119},{"question":"問題文：\nあなたは、以下の表に示すリソースを含む Azure サブスクリプションを持っています。\n\n（※VM1 は VNET1 に接続されています。）\nVM1 を VNET2 に接続する必要があります。\n解決策：新しいネットワーク インターフェイスを作成し、そのネットワーク インターフェイスを VM1 に追加します。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"仮想マシンに新しいネットワークインターフェイス（NIC）を追加する場合、その NIC はVMが現在接続されているのと同じ仮想ネットワーク（VNET1）の範囲内である必要があります。異なる仮想ネットワーク（VNET2）のNICを既存のVMに後からアタッチすることはできません。VMを一度削除し、VNET2のNICを指定してVMを再作成する必要があります。\n【関連する出題項目】\n④ 仮想ネットワークを実装および管理する","id":120},{"question":"（注：この問題は同じシナリオを提示する一連の質問の一部です。）\n（シナリオは#74と同様であり、VM1は「米国西部」にあります）\nVM1用に「NIC2」という名前の新しいネットワークインターフェイスを作成する必要があります。\n解決策：「RG2」および「米国中部 (Central US)」にNIC2を作成する。\nこれは目標を満たしていますか？\n\n- はい","options":[{"label":"B","text":"いいえ"}],"correct":"B","explanation":"ネットワークインターフェイス (NIC) は、接続する仮想マシンと同じリージョン（米国西部）に作成する必要があります。米国中部に作成されたNICは、米国西部のVMにアタッチすることができないため、この解決策は要件を満たしていません。\n\n【関連する出題項目】\n④ 仮想ネットワークを実装および管理する","id":121},{"question":"VNET1 という名前の仮想ネットワークを含む Azure サブスクリプションがあります。VNET1 には以下の表に示すサブネットが含まれています。（※表省略）\n\n各仮想マシンは静的 IP アドレスを使用します。\n以下の要件を満たすために、ネットワーク セキュリティ グループ (NSG) を作成する必要があります。\n・インターネットから VM3、VM4、VM5、および VM6 への Web リクエストを許可する。\n・VM1 と VM2 間のすべての接続を許可する。\n・VM1 へのリモート デスクトップ (RDP) 接続を許可する。\n・VNET1 へのその他のすべてのネットワーク トラフィックを防止する。\n作成すべき NSG の最小数はいくつですか？","options":[{"label":"A","text":"1"},{"label":"B","text":"3"},{"label":"C","text":"4"},{"label":"D","text":"12"}],"correct":"A","explanation":"NSG は複数のサブネットやネットワークインターフェイス (NIC) に関連付けることができます。それぞれの要件（特定の VM や IP アドレスに対する Web アクセスや RDP の許可など）は、1 つの NSG 内で宛先 IP や Application Security Group (ASG) を指定した複数のセキュリティ規則として個別に定義することが可能です。したがって、要件を満たすために作成すべき最小の NSG 数は「1」となります。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃23 (Topic 5)】\nあなたの会社には Subscription1 という名前の Azure サブスクリプションがあります。\nまた、Windows Server 2016 を実行する Server1 および Server2 という 2 台のオンプレミス サーバーがあります。Server1 は、adatum.com という名前のプライマリ DNS ゾーンを持つ DNS サーバーとして構成されています。adatum.com には 1,000 件の DNS レコードが含まれています。\nあなたは Server2 から Server1 および Subscription1 を管理しています。Server2 には以下のツールがインストールされています。","id":122},{"question":"以下の表に示すリソースを含む Azure サブスクリプションがあります。\nVM1 と VM2 は同じテンプレートからデプロイされ、基幹業務アプリケーションをホストしています。\n展示（図）に示されているネットワーク セキュリティ グループ (NSG) を構成します。\nVM1 および VM2 のユーザーが TCP ポート 80 を介してインターネット上の Web サイトにアクセスできないようにする必要があります。\nあなたは何をすべきですか？\n\n- ネットワーク インターフェイスから NSG の関連付けを解除する。","options":[{"label":"B","text":"Port_80 インバウンド セキュリティ規則を変更する。"},{"label":"C","text":"NSG を Subnet1 に関連付ける。 (Associate the NSG to Subnet1.)"},{"label":"D","text":"DenyWebSites アウトバウンド セキュリティ規則を変更する。"}],"correct":"C","explanation":"図（展示）にてインターネット向けのポート 80 をブロックするアウトバウンド規則 (DenyWebSites) がすでに構成されているにも関わらず通信が防げていない場合、その NSG が適切なリソースに適用されていないことが原因です。VM1 と VM2 の両方の通信を一括して制御するためには、個別のネットワーク インターフェイス (NIC) ではなく、両方の VM が配置されているサブネット (Subnet1) に対して NSG を関連付けるのが正しい手順です。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃29 (Topic 5)】\nSubscription1 と Subscription2 という 2 つのサブスクリプションがあります。各サブスクリプションは、異なる Azure AD (Microsoft Entra) テナントに関連付けられています。\nSubscription1 には VNet1 という名前の仮想ネットワークが含まれています。VNet1 には VM1 という名前の Azure 仮想マシンが含まれ、IP アドレス空間は 10.0.0.0/16 です。\nSubscription2 には VNet2 という名前の仮想ネットワークが含まれています。","id":123},{"question":"次の表に示すAzure仮想マシンがあります。VM1にはDNSサービスがインストールされています。\n展示に示されているように、各仮想ネットワーク（VNET1, VNET2, VNET3）のDNSサーバー設定を構成します。\nすべての仮想マシンがVM1上のDNSサービスを使用してDNS名を解決できるようにする必要があります。\n何をすべきですか？\n\n- VM1に条件付きフォワーダーを構成する","options":[{"label":"B","text":"VNET1にサービスエンドポイントを追加する"},{"label":"C","text":"VNET2とVNET3にサービスエンドポイントを追加する"},{"label":"D","text":"VNET1、VNET2、およびVNET3の間にピアリングを構成する"}],"correct":"D","explanation":"VNET2やVNET3上にある仮想マシンが、VNET1上にあるカスタムDNSサーバー（VM1）と通信して名前解決を行うためには、ネットワーク間でDNSのトラフィック（TCP/UDPポート53）が到達可能でなければなりません。これを実現するためには、各VNet間でVNetピアリングを構成してネットワークレベルの通信を確立する必要があります。サービスエンドポイントはPaaSリソースへのアクセスを制御するためのものであり、この要件には該当しません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する\n\n【問題文＃39】\n「Subnet1」という名前のサブネットを含むAzure仮想ネットワーク「VNet1」があります。Subnet1には3つのAzure仮想マシンが含まれています。各仮想マシンにはパブリックIPアドレスがあります。\nこれらの仮想マシンは、インターネット上のユーザーがポート443経由でアクセスできる複数のアプリケーションをホストしています。\nオンプレミスネットワークには、VNet1へのサイト間（Site-to-Site）VPN接続があります。\n仮想マシンに、インターネットおよびオンプレミスネットワークからリモートデスクトッププロトコル（RDP）を使用してアクセスできることが判明しました。","id":124},{"question":"次の表に示すリソースを含むAzureサブスクリプションがあります。\n\n（VM1にアタッチされたNIC1があり、Subnet1に関連付けられています）\nSubnet1はVNet1に関連付けられています。NIC1はVM1をSubnet1にアタッチしています。\nASG1（アプリケーションセキュリティグループ）をVM1に適用する必要があります。\n何をすべきですか？","options":[{"label":"A","text":"NIC1をASG1に関連付ける"},{"label":"B","text":"ASG1のプロパティを変更する"},{"label":"C","text":"NSG1のプロパティを変更する"}],"correct":"A","explanation":"アプリケーションセキュリティグループ（ASG）は、仮想マシンのネットワークインターフェイス（NIC）単位で適用されます。VM1にASG1を適用するには、VM1のネットワークインターフェイスであるNIC1の設定から、アプリケーションセキュリティグループとしてASG1を紐付ける（関連付ける）必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する\n\n【問題文＃41】\n「Subscription1」という名前のAzureサブスクリプションに、「VNet1」という名前のAzure仮想ネットワークが含まれています。VNet1は、Azure ExpressRouteを使用してオンプレミスネットワークに接続しています。\nExpressRouteの障害に備えて、自動フェールオーバーのための環境を準備する予定です。\nサイト間（Site-to-Site）VPNを使用してVNet1をオンプレミスネットワークに接続する必要があります。このソリューションではコストを最小限に抑える必要があります。\n実行すべき3つのアクションはどれですか？（それぞれの正解がソリューションの一部を表します。","id":125},{"question":"次の表に示すリソースを含むAzureサブスクリプションがあります。\n\n（表の構成：RG1はEast US、RG2はNorth Europe。VNet1はEast US、VNet2はNorth Europeに存在します。）\n「NIC1」という名前のネットワークインターフェイスを作成する必要があります。\nNIC1を作成できる場所（リージョン）はどこですか？","options":[{"label":"A","text":"East US および North Europe のみ"},{"label":"B","text":"East US のみ"},{"label":"C","text":"East US、West Europe、および North Europe"},{"label":"D","text":"East US および West Europe のみ"}],"correct":"A","explanation":"Azureネットワークインターフェイス（NIC）を作成する場合、アタッチ先となる「仮想ネットワーク（VNet）」と完全に同じリージョンに作成する必要があります。このサブスクリプションにはEast US（VNet1）とNorth Europe（VNet2）にしか仮想ネットワークが存在しないため、NICを作成できるリージョンもこの2つのみとなります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":126},{"question":"Windows Server 2019を実行するAzure仮想マシン（VM1など）があります。\nパブリックAzure DNSゾーン「adatum.com」と、プライベートAzure DNSゾーン「contoso.com」を作成します。\ncontoso.com用に、展示に示されているように「link1」という仮想ネットワークリンクを作成します。\nVM1は contoso.com の名前を解決できますが、adatum.com の名前を解決できないことが判明しました。VM1はインターネット上の他のホストの名前解決は可能です。\nVM1が adatum.com のホスト名を解決できるようにする必要があります。\n何をすべきですか？\n\n- VM1のDNSサフィックスを adatum.com に更新する","options":[{"label":"B","text":"ドメインレジストラで adatum.com のネームサーバーを構成する"},{"label":"C","text":"contoso.com ゾーンにSRVレコードを作成する"},{"label":"D","text":"link1のアクセス制御（IAM）設定を変更する"}],"correct":"B","explanation":"Azure DNSでパブリックDNSゾーン（adatum.com）を作成しただけでは、インターネット上でそのドメインの名前解決を行うことはできません。Azureが割り当てたネームサーバーのレコードを、ドメインを購入した「ドメインレジストラ」側で登録（委任）して初めて、外部（この場合はインターネット経由）からの名前解決が可能になります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":127},{"question":"「VNET1」に配置された複数の仮想マシンがあります。\n\n以下の構成を持つロードバランサーをデプロイします。\n・名前：LB1\n・種類：内部（Internal）\n・SKU：Standard\nVM1とVM2をLB1のバックエンドプールに追加できるようにする必要があります。\n解決策：Basic SKUのパブリックIPアドレスを作成し、そのアドレスをVM1のネットワークインターフェイスに関連付け、その後VM1を起動します。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"「Standard SKU」のロードバランサーのバックエンドプールに仮想マシンを追加する場合、その仮想マシンのネットワークインターフェイスに関連付けられているIP構成（パブリックIPなど）は「Standard SKU」であるか、あるいはパブリックIPがアタッチされていない必要があります。\n「Basic SKU」のパブリックIPを仮想マシンに関連付けてしまうと、SKUの不一致（Standard LB と Basic IP）が発生し、バックエンドプールに追加できなくなります。したがってこの解決策は要件を満たしません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":128},{"question":"「VNET1」に配置された複数の仮想マシン（VM1、VM2）を含むAzureサブスクリプションがあります。\n\n以下の構成を持つロードバランサーをデプロイします。\n・名前：LB1\n・種類：内部（Internal）\n・SKU：Standard\nVM1とVM2をLB1のバックエンドプールに追加できるようにする必要があります。\n解決策：Standard SKUのパブリックIPアドレスを作成し、そのアドレスをVM1のネットワークインターフェイスに関連付け、その後VM2を停止します。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"「Standard SKU」のロードバランサーのバックエンドプールに仮想マシンを追加するには、その仮想マシンのIP構成（パブリックIPなど）が「Standard SKU」である必要があります。VM1にStandard SKUのパブリックIPを割り当てたとしても、VM2を停止するだけではVM2をバックエンドプールに追加する要件を満たせません（VM2のIP構成がBasicのままであれば追加は失敗します）。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":129},{"question":"「VM1」という名前のAzure仮想マシンがあります。\n\nVM1のネットワークインターフェイスは、展示に示されているように構成されています。\nVM1にWebサーバーをデプロイし、HTTPSプロトコルを使用してアクセスできる安全なWebサイトを作成します。VM1はWebサーバーとしてのみ使用されます。\nユーザーがインターネットからWebサイトに接続できるようにする必要があります。\n何をすべきですか？","options":[{"label":"A","text":"Rule4のプロトコルを変更する"},{"label":"B","text":"Rule1を削除する"},{"label":"C","text":"Rule5について、アクションをAllow（許可）に変更し、優先度を401に変更する"},{"label":"D","text":"TCPプロトコル443を許可する新しいインバウンドルールを作成し、優先度を501に構成する"}],"correct":"C","explanation":"（※典型的な本試験の展示シナリオに基づきます）展示内のNSGルールにおいて、HTTPS（ポート443）通信が優先度500などのルールによって拒否（Deny）されている状況です。ユーザーからのHTTPS通信を許可するためには、既存の拒否ルールよりも高い優先度（数字が小さい値）を持つ許可ルールを設定する必要があります。Rule5を「許可（Allow）」に変更し、優先度を「401」などに引き上げることで、拒否ルールよりも先に評価され、通信が許可されます。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":130},{"question":"App1というアプリが、VM1およびVM2という2つのAzure仮想マシンにインストールされています。App1への接続はAzure Load Balancerを使用して管理されています。\nVM2の有効なネットワークセキュリティ構成が展示に示されています。\n\n131.107.100.50からTCPポート443経由でのApp1への接続が失敗することが判明しました。ロードバランサーのルールは正しく構成されていることを確認済みです。\n131.107.100.50からTCPポート443経由でApp1への接続が正常に確立されるようにする必要があります。\n解決策：131.107.100.50の送信元からのすべてのトラフィックを拒否（Deny）し、優先度を64999とするインバウンドセキュリティルールを作成します。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"目標は「131.107.100.50からの接続を正常に確立できるようにする（許可する）」ことです。当該IPアドレスからのトラフィックを「拒否（Deny）」するルールを作成しても、接続できるようにはならないため誤りです。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":131},{"question":"（※問題文＃57と同じシナリオです）\n解決策：「BlockAllOther443」インバウンドセキュリティルールを削除します。\nこれは目標を満たしていますか？\n\n- はい","options":[{"label":"B","text":"いいえ"}],"correct":"B","explanation":"展示のシナリオにおいて、ブロックルールの影響で特定のIPからのアクセスが拒否されている状態ですが、ただブロックルールを削除するだけでは、デフォルトルール（DenyAllInbound等）によって結果的にブロックされ続ける可能性があります。また、セキュリティ要件として他のIPからのアクセスは防ぐ必要がある場合があるため、適切な解決策ではありません。許可ルールの優先度を変更するのが正しい対処です。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":132},{"question":"Azureサブスクリプションがあります。\nApp1という名前のアプリをサポートするために、Azure Kubernetes Service (AKS) クラスターをデプロイする予定です。オンプレミスのクライアントはポッドのIPアドレスを使用してApp1に接続します。\nAKSクラスターにおいて、App1をサポートするネットワークタイプを選択する必要があります。何を選択すべきですか？","options":[{"label":"A","text":"kubenet"},{"label":"B","text":"Azure Container Networking Interface (CNI)"},{"label":"C","text":"Hybrid Connection endpoints"},{"label":"D","text":"Azure Private Link"}],"correct":"B","explanation":"Azure CNI（高度なネットワーク）を選択すると、AKSクラスター内の各ポッドには仮想ネットワーク（VNet）から直接プライベートIPアドレスが割り当てられます。これにより、ポッドが直接ネットワークに参加できるため、オンプレミスのクライアントがExpressRouteやVPN経由でポッドのIPアドレスに直接接続することが可能になります。一方、kubenet（基本ネットワーク）ではポッドIPが外部ネットワークへ直接ルーティングされないため、今回の要件を満たしません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":133},{"question":"仮想マシンが含まれるAzureサブスクリプションがあります。\n以下の構成を持つロードバランサーをデプロイします。\n・名前: LB1\n・種類: Internal（内部）\n・SKU: Standard\n・仮想ネットワーク: VNET1\nVM1とVM2をLB1のバックエンドプールに追加できるようにする必要があります。\n解決策：VM2のネットワークインターフェースからパブリックIPアドレスの関連付けを解除します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Standard SKUのロードバランサーのバックエンドプールには、Basic SKUのパブリックIPアドレスが割り当てられている仮想マシンを追加することができません。VM2のネットワークインターフェースから（Basic SKUの）パブリックIPアドレスの関連付けを解除することで、この制約がなくなり、VM1およびVM2の両方をLB1のバックエンドプールに追加できるようになります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":134},{"question":"10個の仮想ネットワークを含むAzureサブスクリプションがあります。これらの仮想ネットワークは別々のリソースグループにホストされています。\n別の管理者がサブスクリプション内に複数のネットワークセキュリティグループ（NSG）を作成する予定です。\nNSGが作成された際に、仮想ネットワーク間のTCPポート8080が自動的にブロックされるようにする必要があります。\n解決策：カスタムポリシー定義を構成し、そのポリシーをサブスクリプションに割り当てます。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"Azure PolicyのAppendやDeployIfNotExistsを使用して、NSG作成時に動的に特定のセキュリティルール（ポート8080のブロックなど）をルールリストに挿入することはサポートされておらず、適切な方法ではありません。ネットワーク全体のトラフィックを強制的に制御・ブロックする場合は、Azure Firewallにトラフィックをルーティングするか、Azure Virtual Network Managerのセキュリティ管理規則を使用してネットワークレベルで一元的にルールを適用する必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する（または ①Azure ID とガバナンスを管理する）","id":135},{"question":"2つの仮想マシンを含むAzureサブスクリプションがあります（VM1のプライベートIPアドレスは 10.0.0.4 に設定されています）。\n\nVM2から 10.0.0.4 に対して逆引きDNSルックアップを実行します。\nどのFQDNが返されますか？","options":[{"label":"A","text":"vm1.core.windows.net"},{"label":"B","text":"vm1.azure.com"},{"label":"C","text":"vm1.westeurope.cloudapp.azure.com"},{"label":"D","text":"vm1.internal.cloudapp.net"}],"correct":"D","explanation":"Azureで仮想ネットワークを作成した際、デフォルトで提供される名前解決（Azure-provided DNS）を使用している場合、VNet内の仮想マシンのプライベートIPアドレスに逆引きDNSルックアップを行うと、自動生成されたFQDNが返されます。このFQDNは [仮想マシン名].internal.cloudapp.net というサフィックスを持つ形式になります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":136},{"question":"App1というアプリが、VM1とVM2という2台のAzure仮想マシンにインストールされています。App1への接続はAzureロードバランサーを使用して管理されています。\n外部の 131.107.100.50 から TCP ポート 443 経由の App1 への接続が失敗することがわかりました。ロードバランサーのルールが正しく構成されていることは確認済みです。\n131.107.100.50 から TCP ポート 443 経由で App1 への接続が正常に確立されるようにする必要があります。\n解決策：送信元「AzureLoadBalancer」からの任意のトラフィックを許可する、優先度（コスト）150の受信セキュリティルールを作成します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"送信元を「AzureLoadBalancer」として許可するセキュリティルールは、ロードバランサー自体から仮想マシンへの「ヘルスプローブ（状態確認プローブ）」の通信を許可するためのものです。このルールを追加しても、外部のクライアント（131.107.100.50）からの実際のデータ通信は許可されません。接続を成功させるには、送信元を「Internet」または「131.107.100.50」、宛先ポートを443として許可するインバウンドルール（受信セキュリティルール）を作成する必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":137},{"question":"GW1という名前のポリシーベースの仮想ネットワークゲートウェイと、VNet1という名前の仮想ネットワークを含むAzureサブスクリプションがあります。\nオンプレミスのコンピューターからVNet1へのポイント対サイト（Point-to-Site）接続を構成できるようにする必要があります。\nどのアクションを2つ実行すべきですか？（それぞれが解決策の一部を表します）","options":[{"label":"A","text":"VNet1にサービスエンドポイントを追加する"},{"label":"B","text":"GW1をリセットする"},{"label":"C","text":"ルートベースの仮想ネットワークゲートウェイを作成する"},{"label":"D","text":"GW1に接続を追加する"},{"label":"E","text":"GW1を削除する\nF. VNet1にパブリックIPアドレス空間を追加する"}],"correct":"C","explanation":"ポイント対サイト（P2S）VPN接続は「ルートベース（Route-based）」のVPNゲートウェイのみでサポートされており、「ポリシーベース」のゲートウェイでは構成できません。既存のVPNゲートウェイの種類を後から直接変更することはできないため、まず既存のポリシーベースのゲートウェイ（GW1）を削除し、新たにルートベースの仮想ネットワークゲートウェイを作成し直す必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":138},{"question":"（問題の前提は＃68と同じ）\n131.107.100.50 から TCP ポート 443 経由で App1 への接続が失敗することがわかりました。ロードバランサーのルールは正しく設定されています。\n131.107.100.50 から TCP ポート 443 経由で App1 への接続を正常に確立する必要があります。\n解決策：送信元 131.107.100.50 からのすべてのトラフィックを「拒否（Deny）」する、優先度 64999 の受信セキュリティルールを作成します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"目標はクライアント（131.107.100.50）からの通信を「確立させる（成功させる）」ことです。「拒否（Deny）」するルールを作成しても、当然ながら通信はブロックされたままとなるため、目標を達成できません。正しい解決策は「許可（Allow）」するルールを作成することです。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":139},{"question":"展示に示されているVNet1という名前の仮想ネットワークがあります。（「展示」タブをクリックしてください。）\n\nVNet1にはどのデバイスも接続されていません。\nVNet1をVNet2という名前の別の仮想ネットワークとピアリングする予定です。VNet2のアドレス空間は 10.2.0.0/16 です。\nピアリングを作成する必要があります。最初に何をすべきですか？","options":[{"label":"A","text":"VNet1のアドレス空間を変更する。"},{"label":"B","text":"VNet1にゲートウェイサブネットを追加する。"},{"label":"C","text":"VNet1およびVNet2にサブネットを作成する。"},{"label":"D","text":"VNet2でサービスエンドポイントを構成する。"}],"correct":"A","explanation":"仮想ネットワークピアリングを作成する際、両方の仮想ネットワークのIPアドレス空間が重複しているとピアリングを設定することができません。この問題の展示では、VNet1のアドレス空間がVNet2（10.2.0.0/16）と重複している設定になっていると推測されます。VNet1にはまだデバイスが接続されていないため、ピアリングを作成する前にまずVNet1のアドレス空間を変更して重複を解消する必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":140},{"question":"以下の表に示すAzure仮想マシンがあります。（VM1とVM2が存在）\nVNET1は、contoso.com という名前のプライベートDNSゾーンにリンクされています。このゾーンには表に示すレコードが含まれています。\nVM1からVM2にPingを実行する必要があります。VM2へのPingに使用できるDNS名はどれですか？","options":[{"label":"A","text":"comp2.contoso.com と comp4.contoso.com のみ"},{"label":"B","text":"comp1.contoso.com, comp2.contoso.com, comp3.contoso.com, および comp4.contoso.com"},{"label":"C","text":"comp2.contoso.com のみ"},{"label":"D","text":"comp1.contoso.com と comp2.contoso.com のみ"},{"label":"E","text":"comp1.contoso.com, comp2.contoso.com, および comp4.contoso.com のみ"}],"correct":"A","explanation":"表にはVM2のプライベートIPアドレスを指すAレコード（例：comp2）と、そのAレコードのエイリアスであるCNAMEレコード（例：comp4）が登録されていると推測されます。VM1からVM2にPingを送信するには、VM2のIPアドレスを正しく解決できるDNS名を使用する必要があるため、VM2宛てのレコードである comp2.contoso.com および comp4.contoso.com の両方が使用可能です。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":141},{"question":"Computer1という名前のコンピューターが、Azure仮想ネットワーク（VNet1）へのポイント対サイト（P2S）VPN接続を持っています。このポイント対サイト接続では自己署名証明書を使用しています。\nAzureからVPNクライアント構成パッケージをダウンロードし、Computer2という名前のコンピューターにインストールします。\nComputer2からVNet1へのポイント対サイトVPN接続を確立できるようにする必要があります。\n解決策：Computer2で、IPSec Policy Agentサービスのスタートアップの種類を「自動」に設定します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"自己署名証明書を使用したAzure証明書認証のポイント対サイト（P2S）VPN接続を行う場合、接続元のコンピューター（この場合はComputer2）の証明書ストアに「クライアント証明書」をインストールする必要があります。サービスのスタートアップ設定を変更するだけではVPN接続を確立することはできず、目標を達成できません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":142},{"question":"Windows Server 2016を実行する5台のAzure仮想マシンがあります。これらの仮想マシンはWebサーバーとして構成されています。\nこれらの仮想マシンに負荷分散サービスを提供するLB1という名前のAzureロードバランサーがあります。\n訪問者がリクエストごとに同じWebサーバーによってサービスを受ける（ルーティングされる）ようにする必要があります。\n何を構成すべきですか？","options":[{"label":"A","text":"セッションの永続化 (Session persistence) を「クライアント IP とプロトコル (Client IP and protocol)」にする"},{"label":"B","text":"プロトコルを UDP にする"},{"label":"C","text":"セッションの永続化を「なし (None)」にする"},{"label":"D","text":"フローティング IP (Direct Server Return) を「有効 (Enabled)」にする"}],"correct":"A","explanation":"ロードバランサーにおいて、特定のクライアントからの後続のリクエストを常に同じバックエンドのWebサーバーに転送したい場合は「セッションの永続化（ソース IP アフィニティ）」を構成します。「クライアント IP」または「クライアント IP とプロトコル」を選択することで、クライアントが維持されるようになります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":143},{"question":"表に示すパブリックIPアドレス（IP1、IP2、IP3など）を使用するAzureサブスクリプションがあります。\n\nパブリック Azure Standard Load Balancer（標準ロードバランサー）を作成する必要があります。\nどのパブリックIPアドレスを使用できますか？","options":[{"label":"A","text":"IP1, IP2, および IP3"},{"label":"B","text":"IP2 のみ"},{"label":"C","text":"IP3 のみ"},{"label":"D","text":"IP1 および IP3 のみ"}],"correct":"C","explanation":"Azure Load BalancerのフロントエンドIPとして使用するパブリックIPアドレスは、ロードバランサーのSKUと一致している必要があります。「Standard SKU」のロードバランサーのフロントエンドには「Standard SKU」のパブリックIPアドレスのみを指定できます。表の中で IP3 だけが Standard SKU で構成されていると推測されるため、IP3 のみが使用可能です。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":144},{"question":"VM1とVM2という2つの仮想マシンを含むAzureサブスクリプションがあります。\nAzureロードバランサーを作成します。\nVM1とVM2の間でHTTPSトラフィックを負荷分散する負荷分散規則（ロードバランシングルール）を作成する予定です。\n負荷分散規則を作成する前に、追加で作成する必要がある2つのロードバランサーリソースはどれですか？（それぞれの正解がソリューションの一部を示します。2つ選択してください）","options":[{"label":"A","text":"フロントエンドIPアドレス"},{"label":"B","text":"インバウンドNATルール"},{"label":"C","text":"仮想ネットワーク"},{"label":"D","text":"バックエンドプール"},{"label":"E","text":"正常性プローブ"}],"correct":"D","explanation":"Azure Load Balancerで「負荷分散規則（Load Balancing Rule）」を作成するためには、事前に以下の要素が構成されている必要があります。\n\n- フロントエンドIPアドレス（ロードバランサー作成時に構成されることが多い）\n\n- バックエンドプール（トラフィックを転送する対象のVMやインスタンスのグループ）\n\n- 正常性プローブ（バックエンドインスタンスが通信可能な状態かを監視する設定）\n設問では「追加で作成する必要がある」リソースを問われているため、バックエンドプールと正常性プローブを作成してからルールに紐づける必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":145},{"question":"dbserver1という名前のデータベースサーバーを含むオンプレミスネットワークがあります。\nAzureサブスクリプションがあります。\n3つのAzure仮想マシンをデプロイする予定です。各仮想マシンは別々の可用性ゾーンにデプロイされます。\nサイト間（Site-to-Site）VPN用のAzure VPNゲートウェイを構成する必要があります。このソリューションでは、仮想マシンがdbserver1に接続できるようにする必要があります。\nゲートウェイにはどのタイプのパブリックIPアドレスのSKUと割り当てを使用すべきですか？","options":[{"label":"A","text":"Basic SKU と 静的IPアドレス割り当て"},{"label":"B","text":"Standard SKU と 静的IPアドレス割り当て"},{"label":"C","text":"Basic SKU と 動的IPアドレス割り当て"}],"correct":"B","explanation":"可用性ゾーン（Availability Zones）を跨いで冗長性を持つVPNゲートウェイ（例：VpnGw1AZ などのゾーン冗長SKU）をデプロイする場合、関連付けるパブリックIPアドレスは必ず「Standard SKU」かつ「静的（Static）」なIPアドレス割り当てである必要があります。Basic SKUのパブリックIPアドレスは可用性ゾーン構成をサポートしていません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":146},{"question":"オンプレミスのデータセンターとAzureサブスクリプションがあります。\nExpressRouteを使用してデータセンターをAzureに接続する予定です。\nExpressRouteゲートウェイをデプロイする必要があります。ソリューションは以下の要件を満たす必要があります：\n・最大10 Gbpsのトラフィックをサポートする。\n・可用性ゾーン（Availability zones）をサポートする。\n・FastPathをサポートする。\n・コストを最小限に抑える。\nどのSKUをデプロイすべきですか？","options":[{"label":"A","text":"ERGw1AZ"},{"label":"B","text":"ERGw2"},{"label":"C","text":"ErGw3"},{"label":"D","text":"ErGw3AZ"}],"correct":"D","explanation":"Azure ExpressRouteゲートウェイの要件に基づく選定です。\n\n- 最大10 Gbpsの帯域幅をサポートするのは ErGw3 クラスのゲートウェイです。\n\n- 可用性ゾーンをサポートするためには、名前の末尾に「AZ」が付くSKUを選択する必要があります。\n\n- FastPath機能は、ErGw3 や UltraPerformance などの高パフォーマンスSKUでのみサポートされています。\n要件を満たしつつコストを最適化する最小構成のSKUは ErGw3AZ となります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":147},{"question":"オンプレミスネットワークに Share1 という名前のSMB共有が含まれています。\n以下のリソースを含むAzureサブスクリプションがあります：\n・webapp1 という名前のWebアプリ（Azure App Service）\n・VNET1 という名前の仮想ネットワーク\nwebapp1が Share1 に接続できるようにする必要があります。\n何をデプロイすべきですか？","options":[{"label":"A","text":"Azure Application Gateway"},{"label":"B","text":"Azure Active Directory (Azure AD) Application Proxy"},{"label":"C","text":"Azure Virtual Network Gateway"}],"correct":"C","explanation":"Azure App Service（webapp1）からオンプレミスにあるリソース（SMB共有など）へプライベート通信でアクセスするためには、まずWebアプリをVNet（VNET1）に統合（VNet統合）します。さらに、そのVNetからオンプレミスネットワークへサイト間（Site-to-Site）VPNまたはExpressRouteを経由して通信経路を確立する必要があります。この接続を実現するために、VNet内に「仮想ネットワークゲートウェイ（Azure Virtual Network Gateway）」を展開する必要があります。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":148},{"question":"表に示すリソース（仮想マシン、ロードバランサー、ネットワークインターフェースなど）を含むAzureサブスクリプションがあります。\n\nIP1という名前のパブリックIPアドレスを作成します。\nIP1に関連付けることができる2つのリソースはどれですか？（それぞれが完全な解決策を表します。2つ選択してください）","options":[{"label":"A","text":"VM1"},{"label":"B","text":"LB1"},{"label":"C","text":"NIC1"},{"label":"D","text":"VPN1"},{"label":"E","text":"VNet1"}],"correct":"B","explanation":"AzureのパブリックIPアドレスは、特定のリソースにのみ直接関連付けることができます。代表的な割り当て先は以下の通りです。\n・ネットワークインターフェース（NIC）：仮想マシンにパブリックIPを付与する場合、VM本体ではなくVMにアタッチされたNICに関連付けます。\n・パブリックロードバランサー（LB）：ロードバランサーのフロントエンドIP構成に関連付けます。\n・仮想ネットワークゲートウェイ（VPN / ExpressRoute）やApplication Gatewayなど。\n仮想マシン（VM）そのものや仮想ネットワーク（VNet）にパブリックIPを直接紐付けることはできません。\n\n【関連する出題項目】\n④仮想ネットワークを実装および管理する\n\n【問題文＃101】\nルートベースのサイト間 (Site-to-Site) VPN 接続を、複数のオンプレミス拠点と Azure 仮想ネットワーク間でデプロイする予定です。\nどのトンネリングプロトコルを使用する必要がありますか？\nA. IKEv1\nB. PPTP\nC. IKEv2\nD. L2TP","id":149},{"question":"次の表に示す仮想ネットワークを含む Azure サブスクリプションがあります（※表：米国西部 (West US) リージョンに存在するVNET1とVNET4、それ以外に存在するVNET2とVNET3）。\n\nAF1 という名前の Azure ファイアウォールを米国西部 Azure リージョンの RG1 にデプロイする必要があります。\nAF1 はどの仮想ネットワークにデプロイできますか？","options":[{"label":"A","text":"VNET1、VNET2、VNET3、および VNET4"},{"label":"B","text":"VNET1 と VNET2 のみ"},{"label":"C","text":"VNET1 のみ"},{"label":"D","text":"VNET1、VNET2、および VNET4 のみ"},{"label":"E","text":"VNET1 と VNET4 のみ"}],"correct":"E","explanation":"Azure Firewall は、デプロイ先として指定する仮想ネットワークと同じリージョンに配置されている必要があります。このケースでは、Firewallがデプロイされる「米国西部」に存在している仮想ネットワーク（VNET1とVNET4）のみがデプロイ先の対象となります。\n【関連する出題項目】④仮想ネットワークを実装および管理する","id":150},{"question":"次の表に示すリソースを含む Azure サブスクリプションがあります（※表には VNET1、Firewall1 等が含まれます）。\n\nVNET1 からのアウトバウンドトラフィックを Firewall1 を使用して管理する必要があります。\nまず何をすべきですか？","options":[{"label":"A","text":"ハイブリッド接続マネージャー (Hybrid Connection Manager) を構成する。"},{"label":"B","text":"ASP1 を Premium SKU にアップグレードする。"},{"label":"C","text":"ルートテーブル (route table) を作成する。"},{"label":"D","text":"Azure Network Watcher を作成する。"}],"correct":"C","explanation":"VNET1 から発生するすべてのアウトバウンドトラフィックを Azure Firewall（Firewall1）経由でルーティングするには、ユーザー定義ルート (UDR) を含む「ルートテーブル」を作成し、デフォルトルート（0.0.0.0/0）のネクストホップをファイアウォールのプライベートIPアドレスに指定して、該当サブネットに適用する必要があります。\n【関連する出題項目】④仮想ネットワークを実装および管理する","id":151},{"question":"次の表に示すリソースを含む Azure サブスクリプションがあります（※表には VM1、App1 (App Service 等)、contoso.com が含まれます）。\n\nすべてのリソースは VNet1 という名前の仮想ネットワークに接続されています。\nBastion1 という名前の Azure Bastion ホストを VNet1 にデプロイする予定です。\nBastion1 を使用して保護できるリソースはどれですか？","options":[{"label":"A","text":"VM1 のみ"},{"label":"B","text":"contoso.com のみ"},{"label":"C","text":"App1 と contoso.com のみ"},{"label":"D","text":"VM1 と contoso.com のみ"},{"label":"E","text":"VM1、App1、および contoso.com"}],"correct":"A","explanation":"Azure Bastion は、仮想ネットワーク内の「仮想マシン (VM)」または「仮想マシン スケールセット (VMSS)」に対する安全な RDP / SSH 接続を提供するサービスです。App Service などの PaaS リソースは RDP や SSH で管理するものではないため、Azure Bastion の保護対象にはなりません。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃116】\nWindows Server 2016 を実行する 5 台の Azure 仮想マシンがあります。これらの仮想マシンは Web サーバーとして構成されています。\n仮想マシンに負荷分散サービスを提供する LB1 という名前の Azure ロードバランサーがあります。\n訪問者がリクエストごとに同じ Web サーバーによってサービスを受けられるようにする必要があります。\n何を構成する必要がありますか？\nA. セッションの持続性を「なし」にする\nB. ヘルスプローブ\nC. セッションの持続性を「クライアント IP とプロトコル」にする\nD. アイドルタイムアウト (分) を 20 にする","id":152},{"question":"10 台の仮想マシンと次の表に示すリソースを含む Azure サブスクリプションがあります（※表では Bastion1 が Basic SKU であると指定されています）。\n\nBastion1 が 100 人の同時 SSH ユーザーをサポートできるようにする必要があります。このソリューションは管理作業を最小限に抑える必要があります。\nまず何をすべきですか？","options":[{"label":"A","text":"Bastion1 のサブネットのサイズを変更する"},{"label":"B","text":"ホストスケーリングを構成する"},{"label":"C","text":"ネットワークセキュリティグループ (NSG) を作成する"},{"label":"D","text":"Bastion1 を Standard SKU にアップグレードする"}],"correct":"D","explanation":"100人といった多数の同時接続をサポートするために「ホストスケーリング（インスタンス数の追加）」を行う必要がありますが、ホストスケーリング機能は Basic SKU ではサポートされていません。したがって、まず最初に Bastion ホストを Standard SKU にアップグレードする必要があります。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃119】\nWindows Server 2016 を実行する 5 台の Azure 仮想マシンがあります。これらの仮想マシンは Web サーバーとして構成されています。\n仮想マシンに負荷分散サービスを提供する LB1 という名前の Azure ロードバランサーがあります。\n訪問者がリクエストごとに同じ Web サーバーによってサービスを受けられるようにする必要があります。\n何を構成する必要がありますか？\nA. セッションの持続性を「クライアント IP とプロトコル」にする\nB. プロトコルを UDP にする\nC. セッションの持続性を「なし」にする\nD. フローティング IP (Direct Server Return) を「無効」にする","id":153},{"question":"次の表に示すパブリック IP アドレスを含む Azure サブスクリプションがあります（※表には IP1 から IP5 までの SKU、割り当て方法、階層などが記載されています）。\n\nBastion1 という名前の Azure Bastion Basic SKU ホストをデプロイする予定です。\nどの IP アドレスを使用できますか？","options":[{"label":"A","text":"IP1 のみ"},{"label":"B","text":"IP1 と IP2 のみ"},{"label":"C","text":"IP3、IP4、および IP5 のみ"},{"label":"D","text":"IP1、IP2、IP4、および IP5 のみ"},{"label":"E","text":"IP1、IP2、IP3、IP4、および IP5"}],"correct":"A","explanation":"Azure Bastion をデプロイするためのパブリック IP アドレスの要件として、「Standard SKU」「静的 (Static) な割り当て」「IPv4」「リージョナル (Regional) 階層」である必要があります。一般的な問題の表では、IP1 のみがこれらの要件を満たしており、それ以外は Basic SKU、動的割り当て、または Global 階層などの理由でサポートされません。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃123】\nWindows Server 2016 を実行する 5 台の Azure 仮想マシンがあります。これらの仮想マシンは Web サーバーとして構成されています。\n仮想マシンに負荷分散サービスを提供する LB1 という名前の Azure ロードバランサーがあります。\n訪問者がリクエストごとに同じ Web サーバーによってサービスを受けられるようにする必要があります。\n何を構成する必要がありますか？\nA. フローティング IP (Direct Server Return) を「無効」にする\nB. フローティング IP (Direct Server Return) を「有効」にする\nC. ヘルスプローブ\nD. セッションの持続性を「クライアント IP」にする","id":154},{"question":"別々の Microsoft Entra テナントにリンクされた Sub1 と Sub2 という名前の 2 つの Azure サブスクリプションがあります。\n\n次の表に示す仮想ネットワークがあります（※表には、サブスクリプションとテナントが異なる VNet2、VNet3、VNet4、VNet5 が含まれています）。\nVNet1 とピアリングできる仮想ネットワークはどれですか？","options":[{"label":"A","text":"VNet2 のみ"},{"label":"B","text":"VNet2 と VNet3 のみ"},{"label":"C","text":"VNet2 と VNet4 のみ"},{"label":"D","text":"VNet2、VNet3、および VNet4 のみ"},{"label":"E","text":"VNet2、VNet3、VNet4、および VNet5"}],"correct":"E","explanation":"Azure Virtual Network ピアリングは、異なるリージョン間（グローバル VNet ピアリング）、異なるサブスクリプション間、さらには異なる Microsoft Entra ID（旧 Azure AD）テナント間であっても、ピアリング接続を確立することがサポートされています。したがって、問題のリストにあるすべての仮想ネットワークとピアリングすることが可能です。\n【関連する出題項目】④仮想ネットワークを実装および管理する","id":155},{"question":"注：この問題は、同じシナリオを提示する一連の問題の一部です。（中略）\nVM1 と VM2 という 2 台の Azure 仮想マシンにインストールされた App1 というアプリがあります。App1 への接続は、Azure ロードバランサーを使用して管理されています。\nVM2 の有効なネットワークセキュリティ構成が展示に示されています（※展示：現在のNSGルールの一覧）。\n\n131.107.100.50 から TCP ポート 443 経由の App1 への接続が失敗することがわかりました。\nロードバランサーのルールが正しく構成されていることは確認済みです。\n131.107.100.50 から TCP ポート 443 経由で App1 への接続を正常に確立できるようにする必要があります。\n\n解決策：送信元を「AzureLoadBalancer」とするすべてのトラフィックを許可し、優先度を 150 としたインバウンドセキュリティルールを作成する。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい (Yes)"},{"label":"B","text":"いいえ (No)"}],"correct":"B","explanation":"送信元を「AzureLoadBalancer」とするトラフィックを許可するルールは、ロードバランサーのヘルスプローブ（正常性プローブ）の通信を許可するためのものです。実際のクライアント（131.107.100.50）からのデータトラフィックは、NSG においては元のクライアントの送信元 IP アドレスとして評価されるため、このクライアント IP アドレスからのアクセスを明示的に許可するルールを作成しなければ接続は成功しません。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃133】\n次の表に示すリソースを含む Azure サブスクリプションがあります（※表には米国東部リージョンの VNet1、Subnet1、NIC1 が含まれています）。\n\n米国東部 Azure リージョンに RT1 という名前のルートテーブルを作成します。\nRT1 はどのリソースに関連付けることができますか？\nA. VNet1 のみ\nB. Subnet1 のみ\nC. VNet1 と NIC1 のみ\nD. Subnet1 と NIC1 のみ\nE. VNet1、Subnet1、および NIC1","id":156},{"question":"次の表に示す仮想ネットワークを含む Azure サブスクリプションがあります（※複数の VNet が存在します）。\n\nすべての仮想ネットワークはピアリングされています。各仮想ネットワークには 9 台の仮想マシンが含まれています。\nAzure Bastion を使用して、仮想マシンへの安全な RDP 接続を構成する必要があります。\n必要な Bastion ホストの最小数はいくつですか？","options":[{"label":"A","text":"1"},{"label":"B","text":"3"},{"label":"C","text":"9"},{"label":"D","text":"10"}],"correct":"A","explanation":"Azure Bastion は仮想ネットワークピアリングをサポートしています。ピアリングされたネットワークハブ（1 つの VNet）に Bastion ホストを 1 つデプロイするだけで、ピアリング経由で接続されている他の VNet 内の仮想マシンに対しても RDP / SSH 接続を提供することができます。\n【関連する出題項目】④仮想ネットワークを実装および管理する","id":157},{"question":"次の表に示す仮想ネットワークを含む Azure サブスクリプションがあります（※表：VNet1 と VNet2 がピアリングされている等）。\nサブスクリプションには、次の表に示す仮想マシンが含まれています（※表：VM1 が VNet1、VM2 が VNet2、VM3 が VNet3 に配置されている等）。\nすべての仮想マシンにはプライベート IP アドレスのみがあります。\nVNet1 に Bastion1 という名前の Azure Bastion ホストをデプロイします。\nBastion1 を介して接続できる仮想マシンはどれですか？","options":[{"label":"A","text":"VM1 のみ"},{"label":"B","text":"VM1 と VM2 のみ"},{"label":"C","text":"VM1 と VM3 のみ"},{"label":"D","text":"VM1、VM2、および VM3"}],"correct":"B","explanation":"Azure Bastion は仮想ネットワークピアリングを介した接続をサポートしています。Bastion がデプロイされている仮想ネットワーク (VNet1) 内の仮想マシン (VM1) に接続できるのはもちろんのこと、VNet1 と直接ピアリングされている仮想ネットワーク (VNet2) 内の仮想マシン (VM2) にも安全に接続することができます。ピアリングされていない VNet3 内の仮想マシン (VM3) には接続できません。\n【関連する出題項目】④仮想ネットワークを実装および管理する","id":158},{"question":"次の表に示す仮想ネットワークを含む Azure サブスクリプションがあります（※表：VNet1 と VNet2 が記載されている）。\n\nVNet1 と VNet2 の間のすべてのトラフィックが Microsoft バックボーンネットワークを通過するようにする必要があります。\n何を構成する必要がありますか？","options":[{"label":"A","text":"プライベートエンドポイント"},{"label":"B","text":"ピアリング (peering)"},{"label":"C","text":"ExpressRoute"},{"label":"D","text":"ルートテーブル"}],"correct":"B","explanation":"2 つの仮想ネットワーク (VNet) を相互に接続するための VNet ピアリングを使用すると、VNet 間のトラフィックはパブリックインターネットを経由せず、完全に Microsoft のプライベートなグローバルバックボーンネットワーク内のみをルーティングされるようになります。\n【関連する出題項目】④仮想ネットワークを実装および管理する\n\n【問題文＃149】\nピアリングされた VNet1 と VNet2 という 2 つの仮想ネットワークを含む Azure サブスクリプションがあります。VNet1 には、静的ルーティング (static routing) を使用する VPN ゲートウェイがあります。\nオンプレミスネットワークには、VNet1 の VPN ゲートウェイを使用する VPN 接続があります。\nオンプレミスネットワーク上のユーザーが VNet2 上の仮想マシンに接続できるようにアクセスを構成する必要があります。ソリューションはコストを最小限に抑える必要があります。\nどの種類の接続を使用するべきですか？\nA. プライベート IP アドレスを持つ Azure Firewall\nB. サービスチェーンとユーザー定義ルート (UDR)\nC. Azure Application Gateway\nD. VNet2 への ExpressRoute 回線","id":159},{"question":"10台の仮想マシンを含む既存のAzureサブスクリプションがあります。\nオンプレミスネットワークと仮想マシン間のレイテンシ（遅延）を監視する必要があります。\n何を使用すべきですか？","options":[{"label":"A","text":"サービス マップ (Service Map)"},{"label":"B","text":"接続のトラブルシューティング (Connection troubleshoot)"},{"label":"C","text":"ネットワーク パフォーマンス モニター (Network Performance Monitor)"},{"label":"D","text":"有効なルート (Effective routes)"}],"correct":"C","explanation":"Network Performance Monitor（NPM）は、オンプレミスとAzureのネットワーク間、またはAzureの仮想ネットワーク間のパフォーマンス、レイテンシ、パケット損失を継続的に監視するために使用されるソリューションです。（※現在、この機能はNetwork Watcherの「接続モニター」に統合されていますが、過去の試験や選択肢ベースではNPMが正解となります）。\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":160},{"question":"West US（米国西部）のAzureリージョンに複数の仮想マシンを含むAzureサブスクリプションがあります。\n仮想マシンのトラフィックを監視するために、Azure Network Watcherのトラフィックアナリティクス（Traffic Analytics）を使用する必要があります。\n作成すべき2つのリソースはどれですか？それぞれ正解の一部を表しています。","options":[{"label":"A","text":"Log Analytics ワークスペース (a Log Analytics workspace)"},{"label":"B","text":"Azure Monitor ブック (an Azure Monitor workbook)"},{"label":"C","text":"ストレージアカウント (a storage account)"},{"label":"D","text":"Microsoft Sentinel ワークスペース (a Microsoft Sentinel workspace)"},{"label":"E","text":"Azure Monitorのデータ収集ルール (a Data Collection Rule (DCR) in Azure Monitor)"}],"correct":"A","explanation":"Network WatcherのTraffic Analytics（トラフィック分析）機能を利用するには、ネットワークトラフィックの履歴を記録する「NSGフローログ」を有効にする必要があります。このフローログの生データを保存・保持するための「ストレージアカウント」と、Traffic Analyticsがデータを解析・視覚化するために送信先となる「Log Analytics ワークスペース」の2つのリソースが必須となります。\n【関連する出題項目】\n④仮想ネットワークを実装および管理する / ⑤Azure リソースの監視と管理","id":161},{"question":"※表が欠落しているため、文脈から翻訳と解説を提示します。\n\n8台の仮想マシンと、以下の表に示すリソースを含むAzureサブスクリプションがあります。\n\n（※VNET1、VNET2、storage1、storage2、Azure ADなどが存在します）\nVNET1のアクセスを構成する必要があります。このソリューションは以下の要件を満たす必要があります：\n・VNET1に接続された仮想マシンは、Microsoftバックボーンを使用してVNET2に接続された仮想マシンと通信できなければならない。\n・VNET1に接続された仮想マシンは、Microsoftバックボーンを使用してstorage1、storage2、およびAzure ADにアクセスできなければならない。\nVNET1に追加すべきサービスエンドポイントの最小数はいくつですか？","options":[{"label":"A","text":"1"},{"label":"B","text":"2"},{"label":"C","text":"3"},{"label":"D","text":"5"}],"correct":"B","explanation":"要件1（VNET1とVNET2の通信）については、「VNetピアリング」を使用して接続するため、サービスエンドポイントは不要です。\n要件2（ストレージおよびAzure ADへのアクセス）については、サービスエンドポイントを使用してMicrosoftバックボーン経由でトラフィックをルーティングします。必要なサービスエンドポイントは、ストレージアカウント向け（storage1とstorage2の両方をカバー）の Microsoft.Storage 1つと、Azure AD向けの Microsoft.AzureActiveDirectory 1つの、合計2つとなります。\n【関連する出題項目】\n④仮想ネットワークを実装および管理する","id":162},{"question":"3つのAzureリージョンにAzure仮想マシンをデプロイしています。\n各リージョンには仮想ネットワークが含まれており、各仮想ネットワークにはフルメッシュトポロジでピアリングされた複数のサブネットが含まれています。\n各サブネットには、ルールが定義されたネットワークセキュリティグループ (NSG) が含まれています。\nあるユーザーから、あるリージョンの仮想マシンから別のリージョンの仮想マシンへ、ポート33000を使用して接続できないと報告がありました。\nこの問題の診断に使用できる2つのオプションはどれですか？（それぞれの正解が完全なソリューションを表します。）","options":[{"label":"A","text":"Azure Virtual Network Manager"},{"label":"B","text":"IP フロー検証"},{"label":"C","text":"Azure Monitor Network Insights"},{"label":"D","text":"接続のトラブルシューティング"},{"label":"E","text":"有効なセキュリティルール (※問題文の elective は effective のタイポと推測)"}],"correct":"B","explanation":"ネットワーク通信のブロック原因を診断するには、Azure Network Watcherの機能が最適です。「IP フロー検証」は、パケットが対象のVMに対して許可されているか、どのNSGルールによって拒否されているかを確認できます。「接続のトラブルシューティング」は送信元から宛先への到達可能性、ルーティング、NSGによるブロックなどの接続問題を包括的にチェックしてくれます。\n\n【関連する出題項目】 ④仮想ネットワークを実装および管理する","id":163},{"question":"VM1という名前の仮想マシンを含むAzureサブスクリプションがあります。\nDC1という名前のドメインコントローラーを含むオンプレミスのデータセンターがあります。ExpressRouteを使用してオンプレミスのデータセンターとAzureを接続しています。\n接続モニター (Connection Monitor) を使用して、VM1とDC1間のネットワーク遅延を特定する必要があります。\nDC1には何をインストールすべきですか？","options":[{"label":"A","text":"Azure Arc対応サーバー用Azure Connected Machineエージェント"},{"label":"B","text":"Azure Network Watcher Agent 仮想マシン拡張機能"},{"label":"C","text":"Log Analytics エージェント"},{"label":"D","text":"Azure Monitor エージェント拡張機能"}],"correct":"C","explanation":"Azure Network Watcherの「接続モニター」を使用してオンプレミスのマシン（DC1）をエンドポイントとして監視する場合、オンプレミスのマシンには「Log Analyticsエージェント」（Microsoft Monitoring Agent: MMAとも呼ばれます）をインストールする必要があります。（※Azure側のVM1にはNetwork Watcher Agent拡張機能を使用します）\n\n【関連する出題項目】 ④仮想ネットワークを実装および管理する（または ⑤）","id":164},{"question":"トラフィック分析 (Traffic Analytics) が構成されているAzureサブスクリプションがあります。\n次の設定を持つVM1という名前の新しい仮想マシンをデプロイします。\n・リージョン: 米国東部\n・仮想ネットワーク: VNet1\n・NICネットワークセキュリティグループ: NSG1\nトラフィック分析を使用してVM1のトラフィックを監視する必要があります。\nどの設定を構成すべきですか？","options":[{"label":"A","text":"VM1の診断設定"},{"label":"B","text":"NSG1のNSGフローログ"},{"label":"C","text":"NSG1の診断設定"},{"label":"D","text":"VM1のInsights"}],"correct":"B","explanation":"Network Watcherのトラフィック分析機能は、NSG（ネットワークセキュリティグループ）を通過する通信パケットの情報を基に機能します。そのため、VM1が紐づいている「NSG1のNSGフローログ」を有効化し、その設定内でトラフィック分析を有効にする必要があります。\n\n【関連する出題項目】 ④仮想ネットワークを実装および管理する\n\n【ケーススタディの前提条件：Topic 11】(※Contoso, Ltd.)\n\n※直前の問題と同様の環境です。\n要件の抜粋:\n・VM5からのIPトラフィックのフローログ（NSGフローログ）を有効にし、ログを8か月間保持する。\n・仮想マシンとストレージの配置：\n　- VM5は「米国西部 (West US)」の VNET3 に配置されています。\n　- storage1: 汎用 v1 (米国東部)\n　- storage2: 汎用 v2 (米国東部)\n　- storage3: BlobStorage (米国東部)\n　- storage4: 汎用 v1 (米国西部)\n\n★Question #3 Topic 11\n\n質問\nVM5からのIPトラフィックのフローログに使用するストレージアカウントを特定する必要があります。このソリューションは保持要件を満たす必要があります。","id":165},{"question":"あなたの会社の Azure サブスクリプションには、Windows Server 2016 を実行する Azure 仮想マシン (VM) が含まれています。\nそのうちの1つの VM は、Azure Backup Instant Restore を使用して毎日バックアップされています。\nこの VM がデータを暗号化するランサムウェアに感染したため、あなたはこの VM の「ファイル」を回復することを決定しました。\nこのシナリオで正しい記述は次のうちどれですか？","options":[{"label":"A","text":"感染したVMにのみファイルを回復できる。"},{"label":"B","text":"会社のサブスクリプション内の任意のVMにファイルを回復できる。"},{"label":"C","text":"新しいVMにのみファイルを回復できる。"},{"label":"D","text":"ファイルを回復することはできない。"}],"correct":"B","explanation":"Azure Backup の「ファイルの回復（Item Level Recovery）」機能を使用すると、指定した回復ポイントをローカルドライブとしてマウントするための実行可能スクリプトが生成されます。このスクリプトは感染したVMに限らず、同じOS（または互換性のあるOS）を実行しネットワーク接続の要件を満たしている任意の VM 上で実行し、安全なファイルをコピーして取り出すことができます。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":166},{"question":"あなたは Azure 上のソリューションを管理していますが、現在パフォーマンスの問題が発生しています。\nAzure インフラストラクチャのメトリックに関連するパフォーマンス問題の原因を特定する必要があります。\n次のうちどのツールを使用するべきですか？","options":[{"label":"A","text":"Azure トラフィック アナリティクス (Traffic Analytics)"},{"label":"B","text":"Azure Monitor"},{"label":"C","text":"Azure アクティビティ ログ (Activity Log)"},{"label":"D","text":"Azure Advisor"}],"correct":"B","explanation":"Azure Monitor は、Azure インフラストラクチャおよびアプリケーションのパフォーマンスのメトリック（CPU使用率、メモリ、ネットワークトラフィックなど）やログを収集、分析、監視するための主要なサービスです。メトリックに基づくパフォーマンス問題の調査に最適です。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":167},{"question":"Subscription1 という名前の Azure サブスクリプションと、Microsoft System Center Service Manager のオンプレミス デプロイメントがあります。\nSubscription1 には、VM1 という名前の仮想マシンが含まれています。\nVM1 の利用可能なメモリ量が 10% を下回ったときに、Service Manager にアラートが設定されるようにする必要があります。\nあなたはまず何をすべきですか？","options":[{"label":"A","text":"Automation Runbook を作成する"},{"label":"B","text":"関数アプリ (Function App) をデプロイする"},{"label":"C","text":"IT Service Management Connector (ITSM) をデプロイする"},{"label":"D","text":"通知を作成する"}],"correct":"C","explanation":"Azure Monitor で発生したアラートを、System Center Service Manager (SCSM) や ServiceNow などの外部の IT サービス マネジメント ツールと連携させるためには、IT Service Management Connector (ITSM) をデプロイおよび構成する必要があります。\n【関連する出題項目】 ⑤Azure リソースの監視と管理\n\n★【問題文＃15】\n\nRG26 という名前のリソース グループを含む Azure サブスクリプションがあります。\nRG26 は西ヨーロッパのリージョンに設定されており、プロジェクト用の一時的なリソースを作成するために使用されます。RG26 には、以下の表に示すリソースが含まれています。\n*(※表は欠落していますが、VM1、SQLDB01、sa001、RGV1 などのリソースが含まれています)*\n\nSQLDB01 は RGV1 にバックアップされています。\nプロジェクトが完了したため、Azure portal から RG26 を削除しようと試みましたが、削除に失敗しました。\nRG26 を削除する必要があります。\nあなたはまず何をすべきですか？\n\n- VM1 を削除する\nB. VM1 を停止する\nC. SQLDB01 のバックアップを停止する\nD. sa001 を削除する","id":168},{"question":"Workspace1 という名前の Azure Log Analytics ワークスペースを含む、Subscription1 という名前の Azure サブスクリプションがあります。\nEvent という名前のテーブルからエラー (error) イベントを表示する必要があります。\nWorkspace1 で実行すべきクエリはどれですか？","options":[{"label":"A","text":"Get-Event Event | where {$_.EventType == \"error\"}"},{"label":"B","text":"search in (Event) \"error\""},{"label":"C","text":"select * from Event where EventType == \"error\""},{"label":"D","text":"search in (Event) * | where EventType -eq \"error\""}],"correct":"B","explanation":"Azure Log Analytics では Kusto Query Language (KQL) を使用します。選択肢の中で正しい KQL 構文として機能するのは search in (Event) \"error\" です（Event テーブル内のすべての列から \"error\" という文字列を検索します）。A は PowerShell、C は SQL の構文であり KQL ではありません。D は文法が誤っています。\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":169},{"question":"Azure サブスクリプションがあります。\n100 台の Azure 仮想マシンがあります。\n使用率が低く、サービス レベルをより安価なプランに変更できる仮想マシンをすばやく特定する必要があります。\nどのブレードを使用する必要がありますか？","options":[{"label":"A","text":"モニター (Monitor)"},{"label":"B","text":"アドバイザー (Advisor)"},{"label":"C","text":"メトリック (Metrics)"},{"label":"D","text":"カスタマー インサイト (Customer insights)"}],"correct":"B","explanation":"Azure Advisor は、Azure リソースの構成と使用状況を分析し、高可用性、セキュリティ、パフォーマンス、コスト最適化に関する推奨事項を提供します。「コスト最適化」の推奨事項の 1 つとして、過去の CPU 使用率やネットワーク アクティビティを分析し、使用率の低い（アンダープロビジョニングされた）仮想マシンのサイズ変更やシャットダウンを提案してくれます。\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":170},{"question":"VM1 および VM2 という名前の 2 つの Azure 仮想マシンがあります。RSV1 および RSV2 という名前の 2 つの Recovery Services コンテナーがあります。\n現在、VM2 は RSV1 にバックアップされています。\nあなたは VM2 を RSV2 にバックアップする必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"RSV1 のブレードから[バックアップアイテム] をクリックし、VM2 のバックアップを停止する"},{"label":"B","text":"RSV2 のブレードから [バックアップ] をクリックし、該当の仮想マシンを選択してバックアップする"},{"label":"C","text":"VM2 のブレードから[ディザスター リカバリー] をクリックし、レプリケーション設定から Recovery Services コンテナーとして RSV2 を選択する"},{"label":"D","text":"RSV1 のブレードから [バックアップジョブ] をクリックし、VM2 のジョブをエクスポートする"}],"correct":"A","explanation":"Azure 仮想マシンは、一度に 1 つの Recovery Services コンテナーにしか関連付けてバックアップすることができません。別のコンテナー（RSV2）にバックアップ先を変更するためには、まず現在のコンテナー（RSV1）で動いている VM2 のバックアップジョブを停止（Stop backup） する必要があります。\n\n【関連する出題項目】\n⑤ Azure リソースの監視と管理（バックアップと復旧の構成）\n\n【問題文＃15】\nWindows Server 2016 を実行する VM1 という名前の Azure 仮想マシンがあります。\nVM1 のシステムイベントログに、1 時間以内に 2 つ以上のエラーイベントが記録された場合に Azure でアラートを作成する必要があります。\nソリューション：VM1 にイベントサブスクリプションを作成します。Azure Monitor でアラートを作成し、ソースとして VM1 を指定します。\nこれは目標を達成していますか？\n\nA. はい\nB. いいえ","id":171},{"question":"問題文：\nあなたは、以下の表に示すリソースを含む Subscription1 という名前の Azure サブスクリプションを持っています。\n\n（※例：Vault1 は West Europe に配置）\nあなたは、以下の表に示す仮想マシンを Subscription1 に作成します。\n（※例：VM1, VM3, VMA, VMC は West Europe に配置。VM2, VMB は異なるリージョンに配置）\nあなたは、Vault1 を使用して可能な限り多くの仮想マシンをバックアップする予定です。\nVault1 にバックアップできる仮想マシンはどれですか？","options":[{"label":"A","text":"VM1 のみ"},{"label":"B","text":"VM3 および VMC のみ"},{"label":"C","text":"VM1、VM2、VM3、VMA、VMB、および VMC"},{"label":"D","text":"VM1、VM3、VMA、および VMC のみ"},{"label":"E","text":"VM1 および VM3 のみ"}],"correct":"D","explanation":"Azure Backup を使用して仮想マシンを Recovery Services コンテナー（Vault）にバックアップする場合、保護対象となる仮想マシンと Vault は完全に同一のリージョン（場所）に存在している必要があります[]。リソースグループが異なっていても問題ありませんが、リージョンが異なる VM（VM2 や VMB）は Vault1 のバックアップ対象として選択できません。したがって、Vault1 と同じ West Europe にある VM1, VM3, VMA, VMC だけがバックアップ可能です。\n【関連する出題項目】\n⑤ Azure リソースの監視と管理","id":172},{"question":"問題文：\nあなたは Subscription1 という名前の Azure サブスクリプションを持っています。\nあなたは VM1 という名前の Linux 仮想マシンを Subscription1 にデプロイします。\nVM1 のメトリックとログを監視する必要があります。\n何を使用すべきですか？","options":[{"label":"A","text":"Azure HDInsight"},{"label":"B","text":"Linux 診断拡張機能 (LAD) 3.0"},{"label":"C","text":"AzurePerformanceDiagnostics 拡張機能"},{"label":"D","text":"Azure Analysis Services"}],"correct":"B","explanation":"Azure 上の Linux 仮想マシンから、OS ゲストレベルの詳細なパフォーマンス メトリックやログ（Syslog など）を収集し、Azure Monitor やストレージ アカウントに送信するには、Linux 診断拡張機能 (LAD: Linux Diagnostic Extension) を使用します（Cの AzurePerformanceDiagnostics は Windows 向けです）。\n【関連する出題項目】\n⑤ Azure リソースの監視と管理","id":173},{"question":"Azure仮想マシン「VM1」のバックアップを計画しています。\nBackup Pre-Check（バックアップの事前チェック）のステータスが「Warning（警告）」と表示されていることがわかりました。\nWarningステータスの原因として考えられるものはどれですか？","options":[{"label":"A","text":"VM1が停止している。"},{"label":"B","text":"VM1に最新バージョンのAzure VMエージェント（WaAppAgent.exe）がインストールされていない。"},{"label":"C","text":"VM1がアンマネージドディスクを使用している。"},{"label":"D","text":"Recovery Servicesコンテナーが利用できない。"}],"correct":"B","explanation":"Azure Backupの事前チェックで「Warning（警告）」が表示される最も一般的な原因は、対象の仮想マシンにインストールされているVMエージェントのバージョンが古い場合です。バックアップ自体は可能ですが、最新の機能や安定性を確保するためにエージェントのアップデートが推奨されている状態を示しています。\n\n【関連する出題項目】\n⑤ Azure リソースの監視と管理","id":174},{"question":"（注：この問題は同じシナリオを提示する一連の質問の一部です。）\nWindows Server 2016を実行するAzure仮想マシン「VM1」があります。\n1時間以内にVM1のシステム（System）イベントログに2つ以上のエラーイベントが記録されたときに、Azureでアラートを作成する必要があります。\n解決策：Azure Log Analyticsワークスペースを作成し、エージェント構成設定を構成します。Microsoft Monitoring AgentをVM1にインストールします。Azure Monitorでアラートを作成し、ソースとしてLog Analyticsワークスペースを指定します。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"仮想マシンのOS内部のイベントログを収集してアラートのトリガーにするには、Log Analyticsワークスペースを作成し、VMにエージェントをインストールしてログを収集する設定を行う必要があります。収集されたログデータをソースとしてAzure Monitorのログクエリアラートを作成する手順は、要件を満たす正しいアプローチです。\n\n【関連する出題項目】\n⑤ Azure リソースの監視と管理","id":175},{"question":"（注：この問題は、同じシナリオを提示する一連の質問の一部です。質問ごとに独自の解決策が提示されており、それぞれの解決策が目標を満たすかどうかを判断します。）\nWindows Server 2016を実行するAzure仮想マシン「VM1」があります。\n1時間以内にVM1のシステム（System）イベントログに2つ以上のエラーイベントが記録されたときに、Azureでアラートを作成する必要があります。\n解決策：Azure Log Analyticsワークスペースを作成し、データ設定を構成します。Microsoft Monitoring AgentをVM1にインストールします。Azure Monitorでアラートを作成し、ソースとしてLog Analyticsワークスペースを指定します。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"以前の関連問題（#64、#70）と同様のシナリオです。仮想マシンのOSからイベントログ（システムイベントログ）を収集するには、Log Analyticsワークスペースを作成し、対象のVMにエージェント（MMA等）をインストールしてデータソースを構成する必要があります。集めたログをもとにAzure Monitorのログクエリアラートを作成するこの手順は、目標を満たす正しいアプローチです。\n\n【関連する出題項目】\n⑤ Azure リソースの監視と管理","id":176},{"question":"次の表に示すリソースを含むAzureサブスクリプションがあります。（※すべての仮想マシンはWindows Server 2016を実行しています）\nVM1で、展示（グラフィックは省略）に示すように「Folder1」という名前のフォルダーをバックアップします。\nこのバックアップを別の仮想マシンに復元（リストア）する予定です。\nバックアップをVM2に復元する必要があります。\nまず何をすべきですか？\n\n- VM1から、Windows Serverバックアップ機能をインストールする。","options":[{"label":"B","text":"VM2から、Microsoft Azure Recovery Servicesエージェントをインストールする。"},{"label":"C","text":"VM1から、Microsoft Azure Recovery Servicesエージェントをインストールする。"},{"label":"D","text":"VM2から、Windows Serverバックアップ機能をインストールする。"}],"correct":"B","explanation":"特定のファイルやフォルダーのバックアップ・復元には、Microsoft Azure Recovery Services (MARS) エージェントを使用します。VM1で取得したバックアップのデータを、代替サーバーであるVM2に復元するには、復元先のVM2にもMARSエージェントをインストールし、同じRecovery Servicesコンテナーに登録してシークレットキーで認証する必要があります。VM1でのバックアップは既に完了しているため、最初に行うべきはVM2へのエージェントインストールです。\n\n【関連する出題項目】\n⑤ Azure リソースの監視と管理","id":177},{"question":"VNet1とVNet2という2つのAzure仮想ネットワークがあります。VNet1にはVM1が含まれ、VNet2にはVM2が含まれています。\nVM1は、データを取得するためにVM2に接続するフロントエンドアプリケーションをホストしています。\nユーザーから、フロントエンドアプリケーションが通常より遅いという報告があります。\nVM1からVM2へのパケットの平均ラウンドトリップ時間（RTT）を確認する必要があります。\nどのAzure Network Watcherの機能を使用すべきですか？","options":[{"label":"A","text":"IPフロー検証 (IP flow verify)"},{"label":"B","text":"接続のトラブルシューティング (Connection troubleshoot)"},{"label":"C","text":"接続モニター (Connection monitor)"},{"label":"D","text":"NSGフローログ (NSG flow logs)"}],"correct":"C","explanation":"接続モニター（Connection Monitor）は、指定したエンドポイント間の通信状況を継続的に監視する機能です。これを使用することで、仮想マシン間の到達可能性、遅延、およびパケットの平均ラウンドトリップ時間（RTT）などのパフォーマンスメトリックを視覚化および追跡することができます。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":178},{"question":"米国西部のAzureリージョンにホストされているVNet1という仮想ネットワークを管理しています。VNet1は、Windows Serverを実行するVM1とVM2という2台の仮想マシンをホストしています。\nVM1からVM2への「すべてのネットワークトラフィックを3時間検査（インスペクト）」する必要があります。\n解決策：Azure Network Watcherから「パケットキャプチャ」を作成します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Azure Network Watcherのパケットキャプチャ機能を使用すると、仮想マシンとの間で送受信されるトラフィックの内容そのもの（パケット）をキャプチャし、後からパケットアナライザー（Wiresharkなど）で詳細に検査（インスペクト）することができます。キャプチャの実行時間は制限を指定することができ、3時間といった長時間のすべてのトラフィックを記録・検査する目的に合致しています。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":179},{"question":"（問題の前提は＃73と同じ）\nVM1からVM2へのすべてのネットワークトラフィックを3時間検査する必要があります。\n解決策：Azure Network Watcherから「接続モニター (connection monitor)」を作成します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"接続モニター（Connection Monitor）は、エンドポイント間（VM1からVM2など）の通信の到達性、遅延（RTT）、トポロジの変更などを監視するための機能です。通信が成功しているかどうかを監視するには最適ですが、パケットの内容そのものや「すべてのトラフィックを検査（インスペクト）」することはできません。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":180},{"question":"（問題の前提は＃73と同じ）\nVM1からVM2へのすべてのネットワークトラフィックを3時間検査する必要があります。\n解決策：パフォーマンスモニターから「データコレクターセット（DCS）」を作成します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"Windows Serverのパフォーマンスモニターのデータコレクターセット（DCS）は、システムリソース（CPU、メモリ、ネットワークの帯域幅や送受信パケット数など）のパフォーマンスカウンターの推移を記録するための機能です。パケットの内容（ペイロード）をキャプチャしてネットワークトラフィックを詳細に検査する目的には使用できません。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":181},{"question":"（問題の前提は＃73と同じ）\nVM1からVM2へのすべてのネットワークトラフィックを3時間検査する必要があります。\n解決策：Azure Monitorから「Network In」および「Network Out」に対するメトリックを作成します。\nこれは目標を達成しますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"Azure Monitorのメトリック（Network In / Network Out）は、仮想マシンのネットワークインターフェースを通過するトラフィックの「データ量（バイト数）」などをグラフ化・監視するためのものです。やり取りされているパケットの中身をインスペクト（検査）することはできません。検査にはパケットキャプチャが必要です。\n\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":182},{"question":"オンプレミスネットワークがあります。\nVNET1、VNET2、VNET3 という名前の 3 つの仮想ネットワークを含む Azure サブスクリプションがあります。これらの仮想ネットワークはピアリングされており、オンプレミスネットワークに接続されています。\nサブスクリプションには、次の表に示す仮想マシンが含まれています（※表：仮想マシンが「米国東部」と「米国西部」の2つの異なるリージョンに配置されている）。\n\n接続モニター (Connection Monitor) を使用して、仮想マシンとオンプレミスネットワーク間の接続を監視する必要があります。\nデプロイすべき接続モニターの最小数はいくつですか？","options":[{"label":"A","text":"1"},{"label":"B","text":"2"},{"label":"C","text":"3"},{"label":"D","text":"4"}],"correct":"B","explanation":"接続モニターは Azure Network Watcher の機能であり、リージョン（場所）ごとに作成されるリソースです。監視のソースとなる仮想マシンが複数のリージョン（例えば米国東部と米国西部）にまたがって存在している場合、対象となる各リージョンごとに最低 1 つの接続モニターをデプロイする必要があります。\n【関連する出題項目】⑤Azure リソースの監視と管理\n\n【問題文＃131】\nVault1 という名前の Recovery Services コンテナーを含む Azure サブスクリプションがあります。\nVault1 に対してマルチユーザー承認 (Multi-User Authorization: MUA) を有効にする必要があります。\n最初に作成するべきリソースはどれですか？\nA. 管理単位 (administrative unit)\nB. マネージド ID (managed identity)\nC. リソースガード (resource guard)\nD. カスタム Azure ロール (custom Azure role)","id":183},{"question":"あなたは「Vault1」という名前のRecovery Services コンテナーを持つAzureサブスクリプションを持っています。サブスクリプションには、以下の表に示す仮想マシンが含まれています。\n\n（※表は省略されていますが、複数のWindowsおよびLinux仮想マシンが含まれている設定です）\n毎晩23:00にバックアップが発生するようにスケジュールする予定です。\nAzure Backupを使用してバックアップできる仮想マシンはどれですか？","options":[{"label":"A","text":"VM1 と VM3 のみ"},{"label":"B","text":"VM1, VM2, VM3, VM4"},{"label":"C","text":"VM1 と VM2 のみ"},{"label":"D","text":"VM1 のみ"}],"correct":"B","explanation":"Azure Backupは、WindowsおよびLinuxオペレーティングシステムを実行しているすべてのAzure仮想マシンをサポートしており、バックアップすることが可能です。そのため、問題の表に含まれるすべての仮想マシン（VM1〜VM4）をバックアップできます。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":184},{"question":"あなたはVM1という名前の仮想マシンを含むAzureサブスクリプションを持っています。\nVM1のCPU使用率が80%を超えたときにアラートをトリガーするAzure Monitorアラートルールをデプロイする予定です。\nアラートルールがUser1とUser2という2人のユーザーに電子メールメッセージを確実に送信するようにする必要があります。\nAzure Monitor用に何を作成する必要がありますか？","options":[{"label":"A","text":"アクショングループ"},{"label":"B","text":"メールが有効なセキュリティグループ"},{"label":"C","text":"配布グループ"},{"label":"D","text":"Microsoft 365 グループ"}],"correct":"A","explanation":"Azure Monitorのアラートがトリガーされた際に通知（メール送信やSMS、Webhookの呼び出しなど）を行うには、「アクショングループ」を作成して構成する必要があります。アクショングループ内にUser1とUser2のメールアドレスを含めることで、アラート発生時に通知が送信されます。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":185},{"question":"あなたは以下の表に示すAzure仮想マシンを持っています。\n（※表は省略されていますが、異なるリージョンに配置されたVMが含まれている設定です）\n\nVM1とVM2を保護するRecovery Servicesコンテナーがあります。\nRecovery Servicesを使用して、VM3とVM4を保護する必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"新しいRecovery Services コンテナーを作成する"},{"label":"B","text":"ストレージアカウントを作成する"},{"label":"C","text":"VM3とVM4の拡張機能を構成する"},{"label":"D","text":"新しいバックアップポリシーを作成する"}],"correct":"A","explanation":"AzureのRecovery Servicesコンテナーは、保護対象の仮想マシンと「同じリージョン」に存在する必要があります。VM3とVM4がVM1/VM2とは異なるリージョンにある場合、それらを保護するためには、VM3・VM4が存在するリージョンに新しいRecovery Servicesコンテナーを作成する必要があります。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":186},{"question":"あなたは、以下の表に示すIDを含むAzureサブスクリプションを持っています。\n（※表は省略されていますが、User1、Principal1、およびUser2を含むGroup1などが存在します）\n\nUser1、Principal1、およびGroup1には、「Monitoring Reader（監視リーダー）」ロールが割り当てられています。\nAG1という名前のアクショングループは「Azure Resource Manager のロールを電子メールで送信する (Email Azure Resource Manager Role)」の通知タイプを持ち、Monitoring Readerロール宛てにメールを送信するように構成されています。\nあなたはAG1を使用するAlert1という名前のアラートルールを作成します。\nAlert1がトリガーされたときに、誰が電子メール通知を受信するかを特定する必要があります。\n誰を特定すべきですか？","options":[{"label":"A","text":"User1 と Principal1 のみ"},{"label":"B","text":"User1, User2, Principal1, Principal2"},{"label":"C","text":"User1 のみ"},{"label":"D","text":"User1 と User2 のみ"}],"correct":"C","explanation":"アクショングループの通知タイプとして「Email Azure Resource Manager Role」を使用した場合、指定されたロール（この場合はMonitoring Reader）が直接割り当てられているAzure ADのユーザーにのみ電子メールが送信されます。Azure ADグループ（Group1）経由で割り当てられているユーザーや、サービスプリンシパル（Principal1）はメール送信の対象外となります。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":187},{"question":"VM1という名前のAzure仮想マシンがあります。\nAzure Backupを使用して、VM1のバックアップを作成し、Backup1という名前を付けます。\nBackup1を作成した後、VM1に対して以下の変更を行います：\n・VM1のサイズを変更する。\n・Dataという名前のフォルダにBudget.xlsという名前のファイルをコピーする。\n・組み込みの管理者アカウントのパスワードをリセットする。\n・VM1にデータディスクを追加する。\n管理者は「既存のものを置き換える（Replace existing）」オプションを使用して、Backup1からVM1を復元します。\nVM1に対するすべての変更が確実に復元（反映）されるようにする必要があります。\nどの変更を再度実行する必要がありますか？","options":[{"label":"A","text":"VM1のサイズを変更する。"},{"label":"B","text":"組み込みの管理者アカウントのパスワードをリセットする。"},{"label":"C","text":"データディスクを追加する。"},{"label":"D","text":"DataにBudget.xlsをコピーする。"}],"correct":"D","explanation":"「既存のものを置き換える」オプション（現在の「ディスクの置き換え」機能）を使用してVMを復元すると、VMに接続されている既存のディスクがバックアップ時点のディスクとスワップ（置き換え）されます。この際、VMのサイズ設定や、バックアップ後に追加された新しいデータディスクはそのまま維持されます。しかし、OSディスクやバックアップ対象ディスク内のデータはバックアップ時点の状態に完全に巻き戻るため、バックアップ後にディスク内へコピーされたファイル（Budget.xls）は消失します。そのため、再度ファイルをコピーし直す必要があります。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":188},{"question":"VM1という名前のAzure仮想マシンがあります。\nAzureはVM1からイベントを収集します。\nVM1のシステムイベントログにエラーが記録されたときに管理者に通知する、Azure Monitorのアラートルールを作成しています。\nアラートルールで監視すべきターゲットリソースはどれですか？","options":[{"label":"A","text":"仮想マシン拡張機能 (virtual machine extension)"},{"label":"B","text":"仮想マシン (virtual machine)"},{"label":"C","text":"メトリックアラート (metric alert)"},{"label":"D","text":"Azure Log Analytics ワークスペース (Azure Log Analytics workspace)"}],"correct":"D","explanation":"仮想マシンのOS内部で発生したログ（システムイベントログなど）に基づいてアラートをトリガーする場合、それらのログはAzure Monitorのエージェントを経由して「Log Analytics ワークスペース」に収集されます。そのため、ログ検索（KQLクエリ）に基づくアラートルールを作成する際のターゲットリソースは、データが蓄積されている「Log Analytics ワークスペース」になります。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":189},{"question":"App1という名前のAzure Webアプリがあります。\n複数ステップのWebテスト (multi-step web test) を使用して、App1の可用性を監視する必要があります。\nAzure Monitorで何を使用すべきですか？","options":[{"label":"A","text":"Azure Service Health"},{"label":"B","text":"Azure Application Insights"},{"label":"C","text":"診断設定 (Diagnostic settings)"},{"label":"D","text":"メトリック (metrics)"}],"correct":"B","explanation":"複数ステップのWebテストは、Azure Application Insightsの「可用性 (Availability)」機能を使用することで構成できます。これにより、ユーザーがWebサイト内を遷移して特定の操作を行うといった複雑なシナリオをシミュレートし、アプリケーションの可用性と応答性を監視することができます。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":190},{"question":"RSV1という名前のRecovery Services コンテナーがあります。RSV1には、インスタントスナップショットを5日間保持し、毎日のバックアップを14日間保持するバックアップポリシーがあります。\nRSV1はVM1の毎日のバックアップを実行します。VM1は、8日前に更新された静的Webサイトをホストしています。\nVM1を8日前の時点に回復する必要があります。このソリューションではダウンタイムを最小限に抑える必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"VM1を割り当て解除 (Deallocate) する。"},{"label":"B","text":"「既存のものを置き換える (Replace existing)」復元構成オプションを使用してVM1を復元する。"},{"label":"C","text":"VM1を削除する。"},{"label":"D","text":"「新しく作成する (Create new)」復元構成オプションを使用してVM1を復元する。"}],"correct":"D","explanation":"「既存のものを置き換える」オプションを使用すると、ディスクの置き換え（スワップ）処理中に元のVMがシャットダウンされるため、復元作業が完了するまでWebサイトにアクセスできずダウンタイムが発生します。ダウンタイムを最小化するには、「新しく作成する」オプションで別のVMとして並行して復元を行い、新しいVMの稼働確認が完了した後にトラフィック（IPアドレスやDNS設定）を切り替えるのが最適な手順です。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":191},{"question":"Workspace1という名前のAzure Log Analyticsワークスペースを含むSubscription1という名前のAzureサブスクリプションがあります。\nEventという名前のテーブルからエラーイベントを表示する必要があります。\nWorkspace1で実行すべきクエリはどれですか？","options":[{"label":"A","text":"search in (Event) \"error\""},{"label":"B","text":"Event | where EventType is \"error\""},{"label":"C","text":"select * from Event where EventType == \"error\""},{"label":"D","text":"Get-Event Event | where {$_.EventType == \"error\"}"}],"correct":"A","explanation":"Log Analyticsでのログ検索にはKusto Query Language (KQL) を使用します。特定のテーブルから特定の文字列を検索するには search in (<テーブル名>) \"<検索文字列>\" という構文を使用します。選択肢BはKQLの構文として不正確（等価比較には is ではなく == を使用します）であり、CはSQL構文、DはPowerShell構文であるため不適切です。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":192},{"question":"App1という名前のAzure App Service Webアプリがあります。\nApp1のパフォーマンストレースを収集する必要があります。\n何を使用すべきですか？","options":[{"label":"A","text":"Azure Application Insights プロファイラー (Azure Application Insights Profiler)"},{"label":"B","text":"アクティビティログ (the Activity log)"},{"label":"C","text":"デプロイセンター (the Deployment center)"},{"label":"D","text":"問題の診断と解決の設定 (the Diagnose and solve problems settings)"}],"correct":"A","explanation":"App Serviceで稼働するアプリケーションのパフォーマンスボトルネックや遅延の原因をコードレベルで詳細に分析するためには、Azure Application Insightsの機能である「Profiler（プロファイラー）」を使用します。これにより、リクエスト処理のパフォーマンストレースを収集できます。\n【関連する出題項目】\n⑤Azure リソースの監視と管理","id":193},{"question":"10個のネットワークセキュリティグループ（NSG）、10台の仮想マシン、およびWorkspace1という名前のLog Analyticsワークスペースを含むAzureサブスクリプションがあります。各NSGは仮想マシンに接続されています。\n疑わしいネットワークトラフィックが検出されたときにトリガーされるAzure Monitor Network Insightsのアラートを構成する必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"接続モニター (Connection Monitor) をデプロイする。"},{"label":"B","text":"データ収集エンドポイント (data collection endpoints) を構成する。"},{"label":"C","text":"プライベートリンク (private link) を構成する。"},{"label":"D","text":"NSGフローログ (NSG flow logs) を構成する。"}],"correct":"D","explanation":"Azure Monitor Network InsightsやTraffic Analyticsを使用してネットワークのセキュリティ監視や疑わしいトラフィック（悪意のあるIPとの通信など）の検出を行うためには、ネットワークインフラを通過するIPトラフィックのログを収集する必要があります。そのため、最初のステップとして各NSGで「NSGフローログ」を有効にして、トラフィックデータの収集を開始することが必須です。\n【関連する出題項目】\n④仮想ネットワークを実装および管理する / ⑤Azure リソースの監視と管理","id":194},{"question":"Workspace1 と Workspace2 という名前の2つのLog Analyticsワークスペースと、Windows Serverを実行する100台の仮想マシンを含むAzureサブスクリプションがあります。\n仮想マシンからパフォーマンスデータとイベントを収集する必要があります。このソリューションは以下の要件を満たす必要があります。\n・ログは Workspace1 と Workspace2 に送信される必要がある。\n・すべてのWindowsイベントがキャプチャされる必要がある。\n・すべてのセキュリティイベントがキャプチャされる必要がある。\n\n各仮想マシンに何をインストールおよび構成すべきですか？","options":[{"label":"A","text":"Azure Monitor エージェント"},{"label":"B","text":"Windows Azure 診断拡張機能 (WAD)"},{"label":"C","text":"Windows VM エージェント"}],"correct":"A","explanation":"Azure Monitor エージェント (AMA) は、ゲストOSから監視データ（Windowsイベント、セキュリティイベント、パフォーマンスデータ等）を収集し、複数のLog Analyticsワークスペースへデータを送信する（マルチホーミング）ことが可能です。従来のLog Analyticsエージェント等の機能を集約した推奨される最新の手段です。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":195},{"question":"VM1という名前の仮想マシンと、App1という名前のAzure 関数（Azure Functions）を含むAzureサブスクリプションがあります。\nVM1が停止した場合に、App1を実行するアラートルールを作成する必要があります。\nアラートルールには何を作成すべきですか？","options":[{"label":"A","text":"アプリケーションセキュリティグループ"},{"label":"B","text":"動的デバイスメンバーシップを持つセキュリティグループ"},{"label":"C","text":"アクショングループ"},{"label":"D","text":"アプリケーショングループ"}],"correct":"C","explanation":"Azure Monitor でアラートが発生した際、何らかの動作（メール送信、Webhookの呼び出し、Azure Functionsの実行など）を自動でトリガーするには「アクショングループ」を作成し、アラートルールに割り当てる必要があります。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":196},{"question":"VNet1という名前の仮想ネットワークを含むAzureサブスクリプションがあります。\nVNet1は、2つの個別のオンプレミスデータセンターに接続する2つのExpressRoute回線を使用しています。\n詳細なメトリックとネットワークトポロジの視覚的表現を表示するダッシュボードを作成する必要があります。\n何を使用すべきですか？","options":[{"label":"A","text":"Azure Monitor Network Insights"},{"label":"B","text":"データ収集ルール (DCR)"},{"label":"C","text":"Azure Virtual Network Watcher"},{"label":"D","text":"Log Analytics"}],"correct":"A","explanation":"「Azure Monitor Network Insights」は、ネットワーク全体の正常性、メトリック、ExpressRouteを含むネットワークリソースの依存関係やトポロジを包括的に視覚化するダッシュボードを提供する機能です。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理（または ④仮想ネットワークを実装および管理する）","id":197},{"question":"Azureサブスクリプションがあります。このサブスクリプションには、VNet1という名前の仮想ネットワークに接続する仮想マシンが含まれています。\nVM InsightsのためにAzure Monitorを構成する予定です。\nすべての仮想マシンが、VNet1経由でのみAzure Monitorと通信するようにする必要があります。\n最初に何を作成すべきですか？","options":[{"label":"A","text":"データ収集ルール (DCR)"},{"label":"B","text":"Log Analytics ワークスペース"},{"label":"C","text":"Azure Monitor Private Link スコープ (AMPLS)"},{"label":"D","text":"プライベートエンドポイント"}],"correct":"C","explanation":"仮想マシンとAzure Monitorの通信をインターネットを経由させずにプライベートネットワーク（VNet）内に閉じる場合、Azure Private Linkを使用します。これをAzure Monitorに適用するには、まず「Azure Monitor Private Link スコープ (AMPLS)」を作成し、対象のLog Analyticsワークスペースなどをスコープに関連付ける必要があります。その後、VNetにプライベートエンドポイントを作成して通信を構成します。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":198},{"question":"Job1という名前のAzure Stream Analyticsジョブを含むAzureサブスクリプションがあります。\nJob1の入力イベントを監視して、処理されなかったイベントの数を特定する必要があります。\nどのメトリックを使用すべきですか？","options":[{"label":"A","text":"順序が乱れたイベント (Out-of-Order Events)"},{"label":"B","text":"出力イベント (Output Events)"},{"label":"C","text":"遅延入力イベント (Late Input Events)"},{"label":"D","text":"バックログされた入力イベント (Backlogged Input Events)"}],"correct":"D","explanation":"Stream Analyticsにおいて、「バックログされた入力イベント (Backlogged Input Events)」メトリックは、入力データの受信から処理が遅れており、まだ処理されていない（バックログに滞留している）イベントの数を示します。これを使用することで未処理のデータがどれだけあるかを特定できます。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":199},{"question":"DB1という名前のAzure SQLデータベースを含むAzureサブスクリプションがあります。\nAzure Monitorを使用してDB1のパフォーマンスを監視する予定です。ログデータを分析するためのクエリを実行できるようにする必要があります。\nDB1の診断設定でどの宛先を構成すべきですか？","options":[{
