<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure 資格試験 練習クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
  --border:#2e3250;--border2:#3d4270;
  --text:#e8eaf6;--text2:#8b90b8;--text3:#5c6194;
  --accent:#6c8ef0;--accent2:#4a6ee0;
  --green:#4caf82;--red:#e05a5a;
  --yellow:#f0c060;
  --radius:10px;--radius-sm:6px;
}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:2rem 1.5rem}

/* ---- SCREENS ---- */
.screen{display:none}
.screen.active{display:block}

/* ---- START ---- */
.hero{text-align:center;padding:3rem 0 2rem}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(108,142,240,.15);border:1px solid rgba(108,142,240,.3);color:var(--accent);font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;margin-bottom:1.5rem;letter-spacing:.5px}
.hero h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;line-height:1.2;margin-bottom:.75rem;background:linear-gradient(135deg,#e8eaf6 30%,#6c8ef0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:15px;color:var(--text2);line-height:1.7;margin-bottom:2rem}
.stat-row{display:flex;justify-content:center;gap:2rem;margin-bottom:2.5rem}
.stat{text-align:center}
.stat-n{font-size:2rem;font-weight:700;color:var(--accent);font-family:"JetBrains Mono",monospace}
.stat-l{font-size:12px;color:var(--text3);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:2.5rem}
.tag{background:var(--bg3);border:1px solid var(--border);padding:4px 12px;border-radius:99px;font-size:12px;color:var(--text2)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto 2rem}
.mode-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;cursor:pointer;transition:all .2s;text-align:center}
.mode-card:hover{border-color:var(--border2);background:var(--bg3)}
.mode-card.sel{border-color:var(--accent);background:rgba(108,142,240,.1)}
.mode-icon{font-size:1.5rem;margin-bottom:8px}
.mode-name{font-size:14px;font-weight:500}
.mode-desc{font-size:12px;color:var(--text3);margin-top:3px}
.mode-card.sel .mode-desc{color:rgba(108,142,240,.8)}
.start-btn{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:13px 36px;font-size:15px;font-weight:600;cursor:pointer;margin:0 auto;transition:background .2s;font-family:inherit}
.start-btn:hover{background:var(--accent2)}

/* ---- ADD QUESTION SECTION ---- */
.add-section{margin-top:2rem;border-top:1px solid var(--border);padding-top:2rem}
.add-section h3{font-size:14px;color:var(--text2);margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.add-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
.form-group{margin-bottom:1rem}
.form-label{font-size:12px;color:var(--text3);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
.form-input:focus{outline:none;border-color:var(--accent)}
.opt-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.opt-label-input{width:32px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--accent);font-size:13px;font-weight:500;text-align:center;font-family:"JetBrains Mono",monospace}
.opt-text-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-size:13px;font-family:inherit}
.opt-text-input:focus,.opt-label-input:focus{outline:none;border-color:var(--accent)}
.form-row{display:flex;gap:10px;align-items:flex-end}
.form-row .form-group{flex:1}
.add-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 16px;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:9px 20px}
.add-btn.primary:hover{background:var(--accent2)}

/* ---- QUIZ ---- */
.quiz-hdr{display:flex;align-items:center;gap:12px;margin-bottom:1.75rem}
.q-badge{background:var(--bg3);border:1px solid var(--border);color:var(--accent);font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;font-family:"JetBrains Mono",monospace;white-space:nowrap}
.pb-wrap{flex:1;height:4px;background:var(--bg3);border-radius:99px;overflow:hidden}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78ef0);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.score-chip{font-size:13px;color:var(--text2);white-space:nowrap}
.q-label{font-size:12px;color:var(--text3);margin-bottom:10px;font-family:"JetBrains Mono",monospace}
.q-text{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:1.5rem;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.opt-btn{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);cursor:pointer;font-size:14px;line-height:1.6;color:var(--text);transition:all .15s;font-family:inherit}
.opt-btn:hover:not(:disabled){background:var(--bg3);border-color:var(--border2)}
.opt-btn:disabled{cursor:default}
.opt-btn.ok{border-color:var(--green);background:rgba(76,175,130,.1)}
.opt-btn.ng{border-color:var(--red);background:rgba(224,90,90,.1)}
.opt-lbl{font-weight:600;font-size:13px;min-width:20px;padding-top:1px;color:var(--text3);font-family:"JetBrains Mono",monospace}
.opt-btn.ok .opt-lbl{color:var(--green)}
.opt-btn.ng .opt-lbl{color:var(--red)}
.exp{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:1.1rem 1.25rem;margin-bottom:1rem;font-size:14px;line-height:1.75;color:var(--text)}
.exp-title{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;font-family:"JetBrains Mono",monospace}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.action-btn{padding:9px 20px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);cursor:pointer;font-size:14px;font-weight:500;color:var(--text);transition:all .2s;font-family:inherit}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.action-btn.primary:hover{background:var(--accent2)}

/* ---- RESULT ---- */
.result-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:3rem 2rem;text-align:center;margin-top:1rem}
.result-pct{font-size:5rem;font-weight:700;color:var(--accent);line-height:1;font-family:"JetBrains Mono",monospace;margin-bottom:.5rem}
.result-sub{font-size:15px;color:var(--text2);margin-bottom:2rem}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto 2rem}
.rc{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1.25rem}
.rv{font-size:2rem;font-weight:700;font-family:"JetBrains Mono",monospace}
.rl{font-size:12px;color:var(--text3);margin-top:4px}
.rc.ok-c .rv{color:var(--green)}
.rc.ng-c .rv{color:var(--red)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media(max-width:480px){
  #app{padding:1rem}
  .mode-grid{grid-template-columns:1fr 1fr}
  .result-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">

<!-- START SCREEN -->
<div id="s-start" class="screen active">
  <div class="hero">
    <div class="hero-badge">Azure 資格試験対策</div>
    <h1>Azure<br>練習クイズ</h1>
    <div class="hero-sub">
      Azure AD・RBAC・ストレージ・仮想マシン・<br>ネットワーク・監視など全範囲を網羅
    </div>
    <div class="stat-row">
      <div class="stat"><div class="stat-n" id="total-count">202</div><div class="stat-l">収録問題数</div></div>
      <div class="stat"><div class="stat-n">5</div><div class="stat-l">カテゴリ</div></div>
    </div>
    <div class="tags">
      <span class="tag">Azure AD / Entra ID</span>
      <span class="tag">RBAC / ポリシー</span>
      <span class="tag">ストレージ</span>
      <span class="tag">仮想マシン</span>
      <span class="tag">ネットワーク</span>
      <span class="tag">監視 / バックアップ</span>
    </div>
    <div class="mode-grid">
      <div class="mode-card sel" onclick="selMode('all',this)">
        <div class="mode-icon">📋</div>
        <div class="mode-name">全問モード</div>
        <div class="mode-desc">順番に解く</div>
      </div>
      <div class="mode-card" onclick="selMode('shuffle',this)">
        <div class="mode-icon">🔀</div>
        <div class="mode-name">シャッフル</div>
        <div class="mode-desc">ランダム順</div>
      </div>
      <div class="mode-card" onclick="selMode('yn',this)">
        <div class="mode-icon">⚖️</div>
        <div class="mode-name">はい/いいえ</div>
        <div class="mode-desc">2択問題のみ</div>
      </div>
      <div class="mode-card" onclick="selMode('multi',this)">
        <div class="mode-icon">🔢</div>
        <div class="mode-name">多択問題</div>
        <div class="mode-desc">4択・5択のみ</div>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">▶ 開始する</button>
  </div>

  <div class="add-section">
    <h3>➕ 問題を追加する（画像問題など）</h3>
    <div class="add-form">
      <div class="form-group">
        <label class="form-label">問題文</label>
        <textarea class="form-input" id="add-q" rows="4" placeholder="問題文を入力..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">選択肢</label>
        <div id="add-opts">
          <div class="opt-row"><input class="opt-label-input" value="A" readonly><input class="opt-text-input" placeholder="選択肢A"></div>
          <div class="opt-row"><input class="opt-label-input" value="B" readonly><input class="opt-text-input" placeholder="選択肢B"></div>
          <div class="opt-row"><input class="opt-label-input" value="C" readonly><input class="opt-text-input" placeholder="選択肢C（任意）"></div>
          <div class="opt-row"><input class="opt-label-input" value="D" readonly><input class="opt-text-input" placeholder="選択肢D（任意）"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">正解</label>
          <select class="form-input" id="add-correct" style="height:36px">
            <option>A</option><option>B</option><option>C</option><option>D</option><option>E</option>
          </select>
        </div>
        <div class="form-group" style="flex:3">
          <label class="form-label">解説</label>
          <textarea class="form-input" id="add-exp" rows="2" placeholder="解説を入力..."></textarea>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:.5rem">
        <button class="add-btn primary" onclick="addQuestion()">追加する</button>
        <button class="add-btn" onclick="exportQuestions()">📤 JSONエクスポート</button>
        <button class="add-btn" onclick="importQuestions()">📥 JSONインポート</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
      </div>
      <div id="add-msg" style="font-size:12px;color:var(--green);margin-top:8px;display:none"></div>
    </div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="s-quiz" class="screen">
  <div class="quiz-hdr">
    <div class="q-badge" id="qc">1 / 202</div>
    <div class="pb-wrap"><div class="pb-fill" id="pf" style="width:0%"></div></div>
    <div class="score-chip" id="sd">正解: 0</div>
  </div>
  <div class="q-label" id="ql">問題 1</div>
  <div class="q-text" id="qt"></div>
  <div class="opts" id="oc"></div>
  <div class="exp" id="exp" style="display:none">
    <div class="exp-title">解説</div>
    <div id="ex"></div>
  </div>
  <div class="actions">
    <button class="action-btn primary" id="nb" style="display:none" onclick="nextQ()">次の問題 →</button>
    <button class="action-btn" onclick="goHome()">⌂ トップへ</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="s-result" class="screen">
  <div class="result-card">
    <div class="result-pct" id="rp"></div>
    <div class="result-sub" id="rb"></div>
    <div class="result-grid">
      <div class="rc ok-c"><div class="rv" id="rcv"></div><div class="rl">正解</div></div>
      <div class="rc ng-c"><div class="rv" id="rwv"></div><div class="rl">不正解</div></div>
    </div>
    <div class="result-actions">
      <button class="action-btn primary" onclick="startQuiz()">🔄 もう一度</button>
      <button class="action-btn" onclick="goHome()">⌂ トップへ</button>
    </div>
  </div>
</div>

</div>
<script>
const BASE_QUESTIONS = [{"question":"あなたの会社には複数の部門があります。各部門には多数の仮想マシン（VM）があります。\n会社には、RG1という名前のリソースグループを含むAzureサブスクリプションがあります。\nすべてのVMはRG1に配置されています。\nあなたは、各VMをそれぞれの部門に関連付けたいと考えています。\n何をするべきですか？","options":[{"label":"A","text":"各部門用のAzure管理グループを作成する。"},{"label":"B","text":"各部門用のリソースグループを作成する。"},{"label":"C","text":"仮想マシンにタグを割り当てる。"},{"label":"D","text":"仮想マシンの設定を変更する。"}],"correct":"C","explanation":"タグを使用することで、Azureリソースにメタデータ（「部門名」など）を付与し、論理的に整理することができます。すべてのVMが既に同じリソースグループ(RG1)に配置されているため、リソースの構成自体を変更せずに各部門へVMを関連付ける（コスト計算や管理のため）には、タグ付けが最も適切な方法です。","id":1},{"question":"注：この問題は、同一の設定を示す一連の問題の一部です。ただし、各問題には異なる解決策が提示されています。解決策が要件を満たしているかを判断してください。\n\nあなたの会社には、Azure Active Directory (Azure AD) のサブスクリプションがあります。\nあなたは、Azure AD の条件付きアクセスポリシーを実装したいと考えています。\nこのポリシーは、グローバル管理者グループのメンバーが信頼できない場所から Azure AD に接続する場合に、「多要素認証 (MFA)」および「Azure AD 参加済みデバイス」の使用を要求するように構成する必要があります。\n\n解決策：多要素認証ページにアクセスして、ユーザー設定を変更する。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"従来の「ユーザーごとの多要素認証設定ページ」では、ユーザーにMFAを強制することはできますが、「特定の場所からのアクセスであるか」や「デバイスがAzure AD参加済みであるか」といった詳細なアクセス制御を設定することはできません。これらは「条件付きアクセス (Conditional Access)」の機能を使用して設定する必要があります。","id":2},{"question":"注：この問題は、同一の設定を示す一連の問題の一部です。ただし、各問題には異なる解決策が提示されています。解決策が要件を満たしているかを判断してください。\n\n（※前提条件は問題文＃2と同じです）\n\n解決策：Azure portal にアクセスして、Azure AD 条件付きアクセスポリシーの「セッション制御 (session control)」を変更する。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"条件付きアクセスポリシーの「セッション制御」は、サインインの頻度やブラウザーセッションの永続性などを制御するために使用します。MFAや特定のデバイス状態（Azure AD参加済みなど）を要求する設定は、「セッション制御」ではなく「アクセス権の付与 (grant control)」セクションで行う必要があります。","id":3},{"question":"注：この問題は、同一の設定を示す一連の問題の一部です。ただし、各問題には異なる結果が提示されています。解決策が要件を満たしているかを判断してください。\n\nあなたの会社には、オンプレミスの Active Directory ドメインとハイブリッド共存するように構成された weyland.com という名前の Azure Active Directory (Azure AD) テナントがあります。\nDirSync サーバーとして構成された DirSync1 という名前のサーバーがあります。\nあなたはオンプレミスの Active Directory で新しいユーザーアカウントを作成しました。ここで、そのユーザー情報を直ちに Azure AD に複製する必要があります。\n\n解決策：ドメインコントローラー上で NetLogon サービスを再起動する。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"NetLogonサービスの再起動によってAzure AD Connectの同期がトリガーされることはありません。新しいユーザーをただちに同期させるには、DirSync（Azure AD Connect）サーバー上で PowerShell の Start-ADSyncSyncCycle -PolicyType Delta コマンドを実行する必要があります。","id":4},{"question":"注：この問題は、同一のシナリオを提示する一連の問題の一部です。各問題には、記載された目標を達成する可能性のある独自の解決策が含まれています。\nこのセクションの質問に回答した後は、その質問に戻ることはできません。\n\nあなたには contoso.com という名前の Azure Active Directory (Azure AD) テナントがあります。\n500 人の外部ユーザーの名前と電子メールアドレスが含まれる CSV ファイルがあります。\n500 人の外部ユーザーそれぞれに対して、contoso.com にゲストユーザーアカウントを作成する必要があります。\n\n解決策：各ユーザーに対して New-AzureADUser コマンドレットを実行する PowerShell スクリプトを作成する。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"New-AzureADUser コマンドレットは、ディレクトリ内に通常の「メンバー」ユーザーを作成するためのものです。外部ユーザーを「ゲスト」として Azure AD (Entra ID) に招待・作成するためには不適切です。","id":5},{"question":"注：この問題は、同一のシナリオを提示する一連の問題の一部です。（※前提条件は問題文＃38と同じです）\n\n500 人の外部ユーザーそれぞれに対して、contoso.com にゲストユーザーアカウントを作成する必要があります。\n\n解決策：Azure portal の Azure AD から「ユーザーの一括作成 (Bulk create user)」操作を使用する。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"Azure portal の「ユーザーの一括作成 (Bulk create user)」機能は、組織内の通常のメンバーユーザーを一括作成するための機能です。ゲストユーザーをCSVから一括で追加するには、専用の「ゲストユーザーの一括招待 (Bulk invite guest user)」機能を使用する必要があります。","id":6},{"question":"Microsoft 365 テナントと、contoso.com という名前の Azure Active Directory (Azure AD) テナントがあります。\nUser1、User2、User3 という 3 人のユーザーに、Library1 という名前の一時的な Microsoft SharePoint ドキュメント ライブラリへのアクセス権を付与する予定です。\nユーザー用のグループを作成する必要があります。このソリューションでは、グループが 180 日後に自動的に削除されるようにする必要があります。\n作成するべき 2 つのグループはどれですか？（正解は2つあります。それぞれが完全なソリューションを提示します）","options":[{"label":"A","text":"「割り当て済み (Assigned)」メンバーシップタイプを使用する Microsoft 365 グループ"},{"label":"B","text":"「割り当て済み (Assigned)」メンバーシップタイプを使用する セキュリティグループ"},{"label":"C","text":"「動的ユーザー (Dynamic User)」メンバーシップタイプを使用する Microsoft 365 グループ"},{"label":"D","text":"「動的ユーザー (Dynamic User)」メンバーシップタイプを使用する セキュリティグループ"},{"label":"E","text":"「動的デバイス (Dynamic Device)」メンバーシップタイプを使用する セキュリティグループ"}],"correct":"A","explanation":"Azure AD (Entra ID) の「グループの有効期限 (Expiration) ポリシー」機能（180日後の自動削除など）は、Microsoft 365 グループでのみサポートされています。セキュリティグループでは有効期限機能を使用できません。メンバーの追加方法（手動の「割り当て済み」、条件による「動的ユーザー」）に関わらず、Microsoft 365 グループであれば有効期限ポリシーを適用できます。","id":7},{"question":"★Question #6\n次の展示に示すような Azure ポリシーがあります。\n（※設定内容：「許可されていないリソースタイプ」として「Azure SQL サーバー」を指定し、スコープを Subscription 1、除外（Exclusion）を ContosoRG1 リソースグループとして設定している）\nこのポリシーの適用結果（効果）はどうなりますか？","options":[{"label":"A","text":"Subscription 1 内のどこにも Azure SQL サーバーを作成できなくなる。"},{"label":"B","text":"ContosoRG1 でのみ Azure SQL サーバーを作成できる。"},{"label":"C","text":"ContosoRG1 でのみ Azure SQL サーバーを作成できなくなる。"},{"label":"D","text":"Subscription 1 内のどのリソースグループでも Azure SQL サーバーを作成できる。"}],"correct":"B","explanation":"ポリシーによって「Subscription 1」全体で Azure SQL サーバーの作成が拒否（Deny）されますが、除外スコープ（Exclusions）に「ContosoRG1」が指定されています。この結果、Subscription 1 の中では ContosoRG1 というリソースグループの中に限って、例外的に Azure SQL サーバーを作成できる状態になります。","id":8},{"question":"AZPT1 という名前の Azure サブスクリプションがあり、以下のリソースが含まれています。\n\n・VM1 (仮想マシン)\n・storage1 (ストレージアカウント)\n・VNET1 (仮想ネットワーク)\n・VM1Managed (マネージドディスク)\n・RVAULT1 (Recovery Services コンテナー)\n新しく AZPT2 という名前の Azure サブスクリプションを作成しました。\nAZPT2 に移動できるリソースを特定する必要があります。\nどのリソースを特定するべきですか？","options":[{"label":"A","text":"VM1、storage1、VNET1、VM1Managed のみ"},{"label":"B","text":"VM1 と VM1Managed のみ"},{"label":"C","text":"VM1、storage1、VNET1、VM1Managed、および RVAULT1"},{"label":"D","text":"RVAULT1 のみ"}],"correct":"C","explanation":"Azure では、仮想マシン、ストレージアカウント、仮想ネットワーク、マネージドディスク、および Recovery Services コンテナーのいずれも、要件（リソースの依存関係などが適切に処理されていること等）を満たせば、別の Azure サブスクリプションへのリソースの移動（Move）がサポートされています。したがって、リストされているすべてのリソースを AZPT2 に移動可能です。","id":9},{"question":"5,000個のユーザーアカウントを含むAzure Active Directory (Azure AD)テナントがあります。\nAdminUser1 という名前の新しいユーザーアカウントを作成します。\nAdminUser1 に「ユーザー管理者 (User administrator)」の管理ロールを割り当てる必要があります。\nユーザーアカウントのプロパティから何を行うべきですか？","options":[{"label":"A","text":"「ライセンス」ブレードから、新しいライセンスを割り当てる。"},{"label":"B","text":"「ディレクトリ ロール（割り当てられたロール）」ブレードから、ディレクトリ ロールを変更する。"},{"label":"C","text":"「グループ」ブレードから、ユーザーアカウントを新しいグループに招待する。"}],"correct":"B","explanation":"Azure AD (Entra ID) 内で特定のユーザーに「ユーザー管理者」や「グローバル管理者」などの組み込みの管理者権限を付与するには、その対象ユーザーのプロパティ画面にある「割り当てられたロール（旧称：ディレクトリ ロール）」のメニューからロールを追加（割り当て）します。","id":10},{"question":"contoso.onmicrosoft.com という名前の Azure Active Directory (Azure AD) テナントがあり、100 個のユーザー アカウントが含まれています。\nこのテナント用に 10 個の Azure AD Premium P2 ライセンスを購入しました。\n10 人のユーザーがすべての Azure AD Premium の機能を使用できるようにする必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"Azure AD の [ライセンス] ブレードから、ライセンスを割り当てる"},{"label":"B","text":"各ユーザーの [グループ] ブレードから、ユーザーをグループに招待する"},{"label":"C","text":"Azure AD ドメインから、エンタープライズ アプリケーションを追加する"},{"label":"D","text":"各ユーザーの [ディレクトリ ロール] ブレードから、ディレクトリ ロールを変更する"}],"correct":"A","explanation":"Azure AD Premium (P1 または P2) の機能を利用するためには、対象となるユーザーまたはグループに対して、Azure Portal の [ライセンス] ブレードから明示的にライセンスを割り当てる必要があります[]。ライセンスを購入しただけでは機能は有効になりません。","id":11},{"question":"Azure Active Directory (Azure AD) Premium P2 にサインアップしました。\nadmin1@contoso.com という名前のユーザーを、Azure AD ドメインに参加するすべてのコンピューターの管理者として追加する必要があります。\nAzure AD で何を構成する必要がありますか？","options":[{"label":"A","text":"[デバイス] ブレードの [デバイスの設定]"},{"label":"B","text":"[MFA サーバー] ブレードの[プロバイダー]"},{"label":"C","text":"[ユーザー] ブレードの [ユーザー設定]"},{"label":"D","text":"[グループ] ブレードの [全般設定]"}],"correct":"A","explanation":"特定のユーザーを Azure AD 参加済みデバイスすべてのローカル管理者として設定するには、Azure AD (現 Microsoft Entra ID) の [デバイス] ブレード内にある [デバイスの設定] を開きます[]。そこで「Azure AD 参加済みデバイスの追加のローカル管理者」として該当ユーザーを構成します[]。\n\n★【問題文＃14】\n\nHOTSPOT -\nContoso.com という名前の Azure Active Directory テナントがあり、以下のユーザーが含まれています。\n*(※プロンプト上にユーザーの表データが欠落しています)*\nContoso.com には、以下の Windows 10 デバイスが含まれています。\n*(※プロンプト上にデバイスの表データが欠落しています)*\nContoso.com に以下のセキュリティ グループを作成します。\n*(※プロンプト上にセキュリティ グループの表データが欠落しています)*\n\n以下の各ステートメントについて、ステートメントが true の場合は Yes を選択してください。それ以外の場合は、No を選択してください。\n注：正しい選択はそれぞれ 1 ポイントの価値があります。","id":12},{"question":"Subscription1 という名前の Azure サブスクリプションがあり、RG1 という名前のリソース グループに VNet1 という名前の仮想ネットワークが含まれています。\nSubscription1 には User1 という名前のユーザーがいます。User1 には次のロールが割り当てられています。\n・閲覧者 (Reader)\n・セキュリティ管理者 (Security Admin)\n・セキュリティ閲覧者 (Security Reader)\n\nUser1 が VNet1 に対する「閲覧者」ロールを他のユーザーに割り当てることができるようにする必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"Subscription1 の セキュリティ閲覧者 と 閲覧者 ロールから User1 を削除する。"},{"label":"B","text":"VNet1 に対する ユーザー アクセス管理者 (User Access Administrator) ロールを User1 に割り当てる。"},{"label":"C","text":"VNet1 に対する ネットワーク コントリビューター ロールを User1 に割り当てる。"},{"label":"D","text":"RG1 に対する ネットワーク コントリビューター ロールを User1 に割り当てる。"}],"correct":"B","explanation":"Azure のロールベースのアクセス制御 (RBAC) において、他のユーザーにロールを割り当てる権限を持つのは「所有者 (Owner)」または「ユーザー アクセス管理者 (User Access Administrator)」ロールです。User1 に VNet1 に対する権限の割り当てのみを許可したい場合、VNet1 スコープで「ユーザー アクセス管理者」ロールを割り当てるのが適切な対応となります。","id":13},{"question":"contosocloud.onmicrosoft.com という名前の Azure Active Directory (Azure AD) テナントがあります。\nあなたの会社は contoso.com のパブリック DNS ゾーンを所有しています。\ncontoso.com をカスタム ドメイン名として Azure AD に追加します。\nAzure がドメイン名を検証できるようにする必要があります。\nどの種類の DNS レコードを作成する必要がありますか？","options":[{"label":"A","text":"MX"},{"label":"B","text":"NSEC"},{"label":"C","text":"PTR"},{"label":"D","text":"RRSIG"}],"correct":"A","explanation":"Azure AD にカスタム ドメインを追加する際、ドメインの所有権を証明するために、所有しているパブリック DNS に Azure から指定されたレコードを追加する必要があります。所有権の検証でサポートされている DNS レコードの種類は「TXT レコード」または「MX レコード」です[]。選択肢の中では MX が該当します。","id":14},{"question":"*(※注：この問題は、同じシナリオを提示する一連の問題の一部です)*\nAdatum という名前の Azure Active Directory (Azure AD) テナントと、Subscription1 という名前の Azure サブスクリプションがあります。Adatum には Developers という名前のグループが含まれています。\nSubscription1 には Dev という名前のリソース グループが含まれています。\nDevelopers グループに、Dev リソース グループ内に Azure Logic Apps を作成する機能を提供する必要があります。\n\n解決策： Subscription1 において、Developers グループに DevTest Labs ユーザー ロールを割り当てます。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"「DevTest Labs ユーザー」ロールは、Azure DevTest Labs 内の仮想マシンの表示や起動/停止、制限内での仮想マシン作成等を行うための権限です。Logic Apps を作成する権限は持っていないため、要件を満たしません。","id":15},{"question":"contoso.onmicrosoft.com という名前の Azure Active Directory (Azure AD) テナントがあります。\nユーザー管理者 (User administrator) ロールが Admin1 という名前のユーザーに割り当てられています。\n外部パートナーは、user1@outlook.com でサインインする Microsoft アカウントを持っています。\nAdmin1 は外部パートナーを Azure AD テナントにサインインするよう招待しようとしましたが、次のエラー メッセージを受け取りました。\nUnable to invite user user1@outlook.com \"Generic authorization exception.\"\nAdmin1 が外部パートナーを Azure AD テナントに招待できるようにする必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"[ユーザー設定] ブレードから、[外部コラボレーションの設定] を変更する。"},{"label":"B","text":"[カスタム ドメイン名] ブレードから、カスタム ドメインを追加する。\nC.[組織の構成] ブレードから、ID プロバイダーを追加する。"},{"label":"D","text":"[ロールと管理者] ブレードから、セキュリティ管理者ロールを Admin1 に割り当てる。"}],"correct":"A","explanation":"Azure AD には、外部ユーザー（ゲスト）の招待に関する制限を設定できる「外部コラボレーションの設定 (External collaboration settings)」があります。この設定で「ゲストを招待できるのは、特定の管理者ロールのみ」に制限されている、あるいは招待そのものが無効化されている場合、ゲストユーザーを招待しようとするとエラーが発生します。この設定を変更して権限を緩和する必要があります。","id":16},{"question":"Azure Active Directory テナントにリンクされた Azure サブスクリプションがあります。このテナントには、User1 という名前のユーザー アカウントが含まれています。\nUser1 がテナントのルート管理グループにポリシーを割り当てることができるようにする必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"User1 に Azure サブスクリプションの所有者ロールを割り当て、次に既定の条件付きアクセス ポリシーを変更する。"},{"label":"B","text":"User1 に Azure サブスクリプションの所有者ロールを割り当て、次に User1 に Azure リソースのアクセス管理を構成するよう指示する。"},{"label":"C","text":"User1 にグローバル管理者ロールを割り当て、次に User1 に Azure リソースのアクセス管理を構成するよう指示する。"},{"label":"D","text":"新しい管理グループを作成し、User1 を新しい管理グループの所有者として委任する。"}],"correct":"C","explanation":"テナントのルート管理グループ (Root Management Group) は、階層の最上位に位置します。このレベルで権限（ポリシーの割り当てなど）を管理するには、まず Azure AD の「グローバル管理者」が、Azure Portal のプロパティ設定から「Azure リソースのアクセス管理 (Access management for Azure resources)」のトグルを「はい」に変更して自身の権限を昇格させ、ルート スコープ (/) に対する「ユーザー アクセス管理者」ロールを取得する必要があります。\n\n★【問題文＃31】\n\nHOTSPOT -\nadatum.com という名前の Azure Active Directory (Azure AD) テナントがあります。Adatum.com には、次の表に示すグループが含まれています。\n*(※グループの表データは欠落しています)*\n次の表に示すように構成された 2 つのユーザー アカウントを作成します。\n*(※ユーザー アカウントの表データは欠落しています)*\nUser1 と User2 はそれぞれどのグループのメンバーになりますか？解答エリアで適切なオプションを選択してください。","id":17},{"question":"User1 という名前のユーザーを含む Azure サブスクリプションがあります。\nUser1 が仮想マシンのデプロイと仮想ネットワークの管理を行えるようにする必要があります。このソリューションでは、最小特権の原則を使用する必要があります。\nUser1 にどのロールベースのアクセス制御 (RBAC) ロールを割り当てるべきですか？","options":[{"label":"A","text":"所有者 (Owner)"},{"label":"B","text":"仮想マシン共同作成者 (Virtual Machine Contributor)"},{"label":"C","text":"共同作成者 (Contributor)"},{"label":"D","text":"仮想マシン管理者ログイン (Virtual Machine Administrator Login)"}],"correct":"C","explanation":"要件として「仮想マシンのデプロイ」と「仮想ネットワークの管理」の両方が求められています。「仮想マシン共同作成者」ロールは仮想マシンの管理は可能ですが、仮想ネットワーク（VNet やサブネットの作成・変更など）の管理権限は含まれていません。仮想マシンと仮想ネットワークの両方のリソースを作成および管理するためには、より広範な権限を持つ「共同作成者」ロールが必要です。所有者ロールは他者へのアクセス権付与も可能になってしまうため、最小特権の原則に反します。\n【関連する出題項目】 ①Azure ID とガバナンスを管理する\n\n★【問題文＃37】\n\nHOTSPOT -\nAdmin1、Admin2、Admin3 という名前の 3 人のグローバル管理者を含む Azure Active Directory (Azure AD) テナントがあります。\nこのテナントは Azure サブスクリプションに関連付けられています。サブスクリプションのアクセス制御は、[アクセス制御] タブの図に示すように構成されています。(※前提として、Admin3 はサブスクリプションの所有者です)\nAdmin1 として Azure portal にサインインし、[テナント] タブの図に示すようにテナントを構成します。","id":18},{"question":"Subscription1 という名前の Azure サブスクリプションに、VM1 という名前の Azure 仮想マシンが含まれています。VM1 は RG1 という名前のリソース グループ内にあります。\nVM1 では、RG1 にリソースをデプロイするために使用されるサービスが実行されています。\nVM1 上で実行されているサービスが、VM1 の ID を使用して RG1 内のリソースを管理できるようにする必要があります。\nあなたはまず何をすべきですか？","options":[{"label":"A","text":"Azure portal から、VM1 のマネージド ID (Managed Identity) の設定を変更する"},{"label":"B","text":"Azure portal から、RG1 のアクセス制御 (IAM) の設定を変更する"},{"label":"C","text":"Azure portal から、VM1 のアクセス制御 (IAM) の設定を変更する"},{"label":"D","text":"Azure portal から、RG1 のポリシー (Policies) の設定を変更する"}],"correct":"A","explanation":"アプリケーションやサービスが「VM 自身の ID」を使って他の Azure リソース（ここでは RG1）にアクセスして管理を行う場合、まずは対象となる VM1 の「システム割り当てマネージド ID (System-assigned Managed Identity)」を有効化（オンに）する必要があります。これを有効にした後、RG1 のアクセス制御 (IAM) に移動して、そのマネージド ID に共同作成者などの適切なロールを割り当てる流れとなります[]。\n\n★【問題文＃39】\n\nTestRG という名前のリソース グループを含む Azure サブスクリプションがあります。\nAzure デプロイを検証するために TestRG を使用します。\nTestRG には以下のリソースが含まれています。\n・VM1 (仮想マシン)：実行中であり、毎日 Vault1 にバックアップされるように構成されています。\n・Vault1 (Recovery Services コンテナー)：VM1 のすべてのバックアップが含まれています。\n・VNET1 (仮想ネットワーク)：「削除 (Delete)」タイプの リソース ロック が設定されています。\n\nTestRG を削除する必要があります。","id":19},{"question":"Azure Active Directory (Azure AD) テナントがあります。\nAzure Active Directory 管理センターの 一括削除 (Bulk delete) を使用して、複数のユーザーを削除する予定です。\n一括削除用にファイルを作成してアップロードする必要があります。\nファイルにはどのユーザー属性を含める必要がありますか？","options":[{"label":"A","text":"各ユーザーの ユーザー プリンシパル名 と 使用場所 のみ"},{"label":"B","text":"各ユーザーの ユーザー プリンシパル名 のみ"},{"label":"C","text":"各ユーザーの 表示名 のみ"},{"label":"D","text":"各ユーザーの 表示名 と 使用場所 のみ"},{"label":"E","text":"各ユーザーの 表示名 と ユーザー プリンシパル名 のみ"}],"correct":"B","explanation":"Azure AD (Microsoft Entra ID) ポータルからユーザーを一括削除 (Bulk delete) する際にダウンロードする CSV テンプレートで必須となっている項目（ユーザーを特定するための一意の識別子）は「ユーザー プリンシパル名 (User principal name: UPN)」のみです。表示名や使用場所を含める必要はありません。\n\n★【問題文＃48】\n\nHOTSPOT -\n次の表に示す Azure リソースを含む、Sub1 という名前の Azure サブスクリプションがあります。\n*(※リソース（RG1、VNET1など）の表が欠落しています)*\n\n次の設定を持つ Azure ポリシーを割り当てます。\n・スコープ: Sub1\n・除外 (Exclusions): Sub1/RG1/VNET1\n・ポリシー定義: リソースにタグとその値を追加する (Append a tag and its value to resources)\n・ポリシーの適用: 有効 (Enabled)\n・タグ名: Tag4\n・タグ値: value4\n\n次の表に示すように、リソースにタグを割り当てます。\n*(※タグ割り当ての表が欠落しています)*\n\n以下の各ステートメントについて、ステートメントが true の場合は Yes を選択してください。","id":20},{"question":"3 つのオフィスと、Azure Active Directory (Azure AD) テナントを含む Azure サブスクリプションがあります。\n各オフィスのローカル管理者にユーザー管理のアクセス権限を付与する必要があります。\n何を使用する必要がありますか？","options":[{"label":"A","text":"Azure AD ロール"},{"label":"B","text":"管理単位 (Administrative units)"},{"label":"C","text":"Azure AD エンタイトルメント管理 の アクセス パッケージ"},{"label":"D","text":"Azure ロール"}],"correct":"B","explanation":"組織が複数の拠点や部門に分かれている場合、一部のユーザーやグループの管理のみを現地の管理者に委任したい（例：東京オフィスの管理者は東京オフィスのユーザーのパスワードリセットのみを行えるようにする）という要件があります。このような Azure AD 内での論理的な境界線を作成し、スコープを絞った管理権限の委任を実現する機能が「管理単位 (Administrative units)」です。","id":21},{"question":"15 個の Azure サブスクリプションがあります。\nGroup1 という名前のセキュリティ グループを含む Azure Active Directory (Azure AD) テナントがあります。\n追加の Azure サブスクリプションを購入する予定です。\nGroup1 が、既存のサブスクリプションおよび予定している新しいサブスクリプションのロールの割り当てを管理できるようにする必要があります。このソリューションは、次の要件を満たしている必要があります。\n・最小特権の原則を使用する。\n・管理の手間を最小限に抑える。\nあなたは何をすべきですか？","options":[{"label":"A","text":"ルート管理グループ (root management group) に対して、Group1 に 所有者 (Owner) ロールを割り当てる。"},{"label":"B","text":"ルート管理グループ に対して、Group1 に ユーザー アクセス管理者 (User Access Administrator) ロールを割り当てる。"},{"label":"C","text":"新しい管理グループを作成し、そのグループに対して Group1 に ユーザー アクセス管理者 ロールを割り当てる。"},{"label":"D","text":"新しい管理グループを作成し、そのグループに対して Group1 に 所有者 ロールを割り当てる。"}],"correct":"B","explanation":"「既存のサブスクリプション」だけでなく「将来追加されるサブスクリプション」に対しても自動的に権限を適用し、管理の手間を最小限にするには、テナントの最上位である「ルート管理グループ」スコープでロールを割り当てるのが最適です。また、最小特権の原則に基づき、すべてのリソース操作を許可する「所有者」ロールではなく、ロール割り当ての管理のみを許可する「ユーザー アクセス管理者」ロールを使用する必要があります。\n\n★【問題文＃57】\n\nHOTSPOT -\n次の図に示す階層を含む Azure サブスクリプションがあります。\n*(※管理グループ、サブスクリプション、リソースグループなどの階層図が欠落しています)*\n\nPolicy1 という名前の Azure Policy 定義を作成します。\nPolicy1 を割り当てることができる Azure リソースはどれですか？また、Policy1 からの「除外 (exclusions)」として指定できる Azure リソースはどれですか？解答エリアで適切なオプションを選択してください。","id":22},{"question":"次の表に示すリソースを含む Sub1 という名前の Azure サブスクリプションがあります。\n\nAdmin1 という名前のユーザーを作成します。\nAdmin1 を「共同管理者 (co-administrator)」として追加できる対象はどれですか？","options":[{"label":"A","text":"RG1"},{"label":"B","text":"MG1"},{"label":"C","text":"Sub1"},{"label":"D","text":"VM1"}],"correct":"C","explanation":"Azure の「共同管理者 (co-administrator)」は、クラシック デプロイメント モデル（古い Azure Service Management モデル）に由来する管理者ロールであり、割り当ては常に「サブスクリプション」レベルでのみサポートされます。管理グループやリソースグループ、個別のリソースに対して共同管理者を割り当てることはできません。\n【関連する出題項目】①","id":23},{"question":"以下の展示（省略）に示すように構成された Microsoft Entra テナントがあります。\n\nテナントには、次の表（省略）に示す ID が含まれています。\n\nMicrosoft Fabric のライセンスを購入しました。\nこのライセンスを割り当てることができるのはどの ID ですか。","options":[{"label":"A","text":"User1 のみ"},{"label":"B","text":"User1 と Group1 のみ"},{"label":"C","text":"User1 と Group2 のみ"},{"label":"D","text":"User1、Group1、Group2"}],"correct":"A","explanation":"展示のテナント構成が「Microsoft Entra ID Free」となっている場合、グループベースのライセンス割り当てはサポートされていません（P1 または P2 以上のライセンスが必要）。そのため、無料版のテナントではユーザーアカウント（User1）に対してのみ直接ライセンスを割り当てることができます。","id":24},{"question":"storage1 という名前のストレージ アカウントを含む Azure サブスクリプションがあります。\nstorage1 にロールベースのアクセス制御 (RBAC) ロールを割り当てる際に、条件 (conditions) を使用する予定です。\nロールの割り当て時に条件をサポートしている storage1 のサービスはどれですか？","options":[{"label":"A","text":"コンテナーのみ"},{"label":"B","text":"ファイル共有のみ"},{"label":"C","text":"テーブルのみ"},{"label":"D","text":"キューのみ"},{"label":"E","text":"コンテナーおよびキューのみ\nF. ファイル共有およびテーブルのみ"}],"correct":"E","explanation":"Azure では、ロールの割り当て時に属性ベースのアクセス制御 (Azure ABAC) を利用して「条件 (conditions)」を追加することができます。ストレージ アカウントにおいて、このロール割り当て条件（BLOB インデックス タグなどを利用したアクセス制御など）をサポートしているサービスは、BLOB ストレージ (コンテナー) と Queue ストレージ (キュー) です。\n\n【問題文＃86】\n注：この問題は、同じシナリオを提示する一連の問題の一部です。シリーズの各問題には、記載された目標を達成する可能性のある独自のソリューションが含まれています。\nこのセクションの質問に回答した後は、その質問に戻ることはできません。そのため、これらの質問はレビュー画面には表示されません。\nstorage1という名前のAzure Storageアカウントがあります。\nUser1という名前のユーザーが、storage1のストレージアカウントキーを一覧表示および再生成できるようにする必要があります。\nソリューション：User1 に「ストレージ アカウント キー オペレーター サービス ロール (Storage Account Key Operator Service Role)」を割り当てます。\nこれは目標を達成していますか？\n\nA. はい\nB. いいえ","id":25},{"question":"問題文：\nあなたは、以下の表に示すユーザーを含む adatum.com という名前の Azure Active Directory (Azure AD) テナントを持っています。\n\n（※User1=一般ユーザー、User2=グローバル管理者、User3=クラウドデバイス管理者、User4=Intune管理者）\nAdatum.com には以下の構成があります：\n・「ユーザーはデバイスを Azure AD に参加させることができる」の設定：User1\n・「Azure AD 参加済みデバイスの追加のローカル管理者」の設定：なし (None)\nあなたは Windows 10 を Computer1 という名前のコンピューターにデプロイします。User1 は Computer1 を adatum.com に参加させます。\nComputer1 のローカル Administrator グループのメンバーシップを特定する必要があります。\nローカル Administrators グループのメンバーとなるユーザーは誰ですか？","options":[{"label":"A","text":"User1 のみ"},{"label":"B","text":"User2 のみ"},{"label":"C","text":"User1 および User2 のみ"},{"label":"D","text":"User1、User2、および User3 のみ"},{"label":"E","text":"User1、User2、User3、および User4"}],"correct":"D","explanation":"Windows 10 デバイスを Azure AD に参加させた場合、ローカルの Administrators グループには自動的に以下のユーザーが追加されます。\n\n- デバイスを参加させたユーザー（User1）\n\n- Azure AD の「グローバル管理者」ロールを持つユーザー（User2）\n\n- Azure AD の「クラウド デバイス管理者」ロールを持つユーザー（User3）\n「追加のローカル管理者」が「なし」であっても、上記の権限を持つユーザーはデフォルトで管理者権限を得ます[][]。","id":26},{"question":"以下の表に示すリソースを含む Azure サブスクリプションがあります。（※RG1などが存在）\n\nポリシーの適用が有効になっている「許可されないリソースの種類 (Not allowed resource types)」Azure ポリシーが RG1 に割り当てられており、以下のパラメーターを使用しています。\n・Microsoft.Network/virtualNetworks\n・Microsoft.Compute/virtualMachines\n\nRG1 に VM2 という名前の新しい仮想マシンを作成し、VM2 を VNET1 に接続する必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"ポリシーから Microsoft.Compute/virtualMachines を削除する。"},{"label":"B","text":"Azure Resource Manager テンプレートを作成する。"},{"label":"C","text":"VNET1 にサブネットを追加する。"},{"label":"D","text":"ポリシーから Microsoft.Network/virtualNetworks を削除する。"}],"correct":"A","explanation":"Azure Policy の設定により、RG1 内での仮想マシン (Microsoft.Compute/virtualMachines) の作成が明示的にブロック（Deny）されています。新しい仮想マシン (VM2) を作成するためには、まずこのポリシーのパラメーターから仮想マシンの制限を削除するか、ポリシーの適用を解除する必要があります。\n\n【問題文＃35】\n10個の仮想ネットワークを含むAzureサブスクリプションがあります。仮想ネットワークは別々のリソースグループでホストされています。\n別の管理者が、サブスクリプション内に複数のネットワークセキュリティグループ（NSG）を作成する予定です。\nNSGが作成されたときに、仮想ネットワーク間のTCPポート8080が自動的にブロックされるようにする必要があります。\n解決策：リソースロックを作成し、そのロックをサブスクリプションに割り当てます。\nこれは目標を満たしていますか？\n\nA. はい\nB. いいえ","id":27},{"question":"注：この問題は、同じシナリオを提示する一連の問題の一部です。シリーズの各問題には、記載された目標を満たす可能性のある独自の解決策が含まれています。問題セットによっては複数の正しい解決策がある場合もあれば、正しい解決策がない場合もあります。\nこのセクションの質問に回答した後は、その質問に戻ることはできません。そのため、これらの質問はレビュー画面には表示されません。\n\ncontoso.onmicrosoft.comという名前のAzure Active Directoryテナントに、以下のユーザーを含むAzureサブスクリプションがあります。\n（※表は省略されていますが、User1が存在します）\n\nUser1は、external.contoso.onmicrosoft.comという名前の新しいAzure Active Directoryテナントを作成します。\nあなたは、external.contoso.onmicrosoft.comに新しいユーザーアカウントを作成する必要があります。\n解決策：User1にユーザーアカウントを作成するように指示します。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Azure ADテナントを新規作成したユーザー（このシナリオではUser1）には、自動的にその新しいテナントの「グローバル管理者（Global Administrator）」ロールが割り当てられます。グローバル管理者はテナント内でユーザーアカウントを作成・管理する完全な権限を持つため、User1にアカウント作成を依頼することで要件を達成できます。","id":28},{"question":"10のAzureサブスクリプションにリンクされているAzure Active Directory (Azure AD) テナントがあります。\nすべてのサブスクリプション全体でユーザーアクティビティを集中管理（監視）する必要があります。\n何を使用すべきですか？","options":[{"label":"A","text":"Azure Application Insights プロファイラー"},{"label":"B","text":"アクセスレビュー (access reviews)"},{"label":"C","text":"アクティビティログフィルター (Activity log filters)"},{"label":"D","text":"Log Analytics ワークスペース (a Log Analytics workspace)"}],"correct":"D","explanation":"複数のAzureサブスクリプションにまたがるユーザー操作やリソースの変更イベント（Azure アクティビティログ）を1つの場所で集中的に監視および分析するには、各サブスクリプションの診断設定を構成し、単一の「Log Analytics ワークスペース」にログを送信・統合するのがベストプラクティスです。統合されたログはKusto Query Language (KQL) を使用して横断的に検索することが可能です。","id":29},{"question":"Azureサブスクリプションがあります。\nサブスクリプション内の任意のリソースからリソースロックが削除されたときに、電子メールアラートを受信する必要があります。\nAzure Monitorでアクティビティログアラートを作成するには、何を使用すべきですか？","options":[{"label":"A","text":"リソース、条件、およびアクショングループ"},{"label":"B","text":"リソース、条件、およびMicrosoft 365グループ"},{"label":"C","text":"Log Analyticsワークスペース、リソース、およびアクショングループ"},{"label":"D","text":"データ収集エンドポイント、アプリケーションセキュリティグループ、およびリソースグループ"}],"correct":"A","explanation":"Azure Monitorでアクティビティログをトリガーとするアラートを作成する際は、対象となる「リソース（この場合はサブスクリプション等）」、トリガーの基準となる「条件（リソースロックの削除イベント）」、およびメール送信などの具体的な処理を定義する「アクショングループ」の3つの要素が必要になります。","id":30},{"question":"（※導入情報、概要、既存環境、技術的要件、ユーザー要件などのケーススタディ前提部分は Question #1 と同一のため割愛します。）\n\n質問\nAdmin1 に対するユーザー要件を満たす必要があります。\n何をすべきですか？","options":[{"label":"A","text":"Azure Active Directory ブレードから、グループを変更する"},{"label":"B","text":"Azure Active Directory ブレードから、プロパティを変更する"},{"label":"C","text":"サブスクリプションブレードからサブスクリプションを選択し、アクセス制御 (IAM) 設定を変更する"},{"label":"D","text":"サブスクリプションブレードからサブスクリプションを選択し、プロパティを変更する"}],"correct":"D","explanation":"Admin1 に対する要件は「サブスクリプションのサービス管理者 (Service admin) に指定すること」と「サービス停止に関するメールアラートを受信すること」の2点です。\nAzureにおいて「サービス管理者」という役割はクラシック管理者の1つであり、RBAC（IAM：アクセス制御）の設定画面ではなく、該当するサブスクリプションの「プロパティ (Properties)」ブレードから設定・変更を行います。\nまた、Azure サブスクリプションのサービス管理者に指定されたユーザーは、Azure 基盤のサービス停止などのシステム障害通知（アラート）を自動的に受信する仕様となっているため、この設定を行うだけで両方の要件を同時に満たすことができます。\n\n【関連する出題項目】\n①Azure ID とガバナンスを管理する\n\n★Question #1 Topic 9\n\n質問\nHOTSPOT -\nUser1がイニシアティブ定義を作成でき、User4がRG2にイニシアティブを割り当てることができるようにする必要があります。このソリューションは技術的要件を満たす必要があります。\n各ユーザーにどの役割を割り当てるべきですか？回答領域で適切なオプションを選択してください。","id":31},{"question":"あなたの会社には Microsoft Azure サブスクリプションがあります。\n会社はロサンゼルスとニューヨークにデータセンターを持っています。\nサイトの回復力（レジリエンス）を高めるために、2つのデータセンターを地理的にクラスター化されたサイトとして構成しています。\nあなたは、Azure ストレージの冗長性オプションを推奨する必要があります。\nデータストレージには以下の要件があります：\n・データを複数のノードに保存する必要がある。\n・データを地理的に離れた場所にあるノードに保存する必要がある。\n・データはプライマリロケーションからだけでなく、セカンダリロケーションからも読み取ることができる必要がある。\n\n次のAzureストレージの冗長性オプションのうち、どれを推奨するべきですか？","options":[{"label":"A","text":"Geo 冗長ストレージ"},{"label":"B","text":"読み取り専用 Geo 冗長ストレージ (RA-GRS)"},{"label":"C","text":"ゾーン冗長ストレージ"},{"label":"D","text":"ローカル冗長ストレージ"}],"correct":"B","explanation":"要件の「地理的に離れた場所（セカンダリ）からもデータを読み取ることができる」を満たすためには、読み取りアクセス機能を持った Geo 冗長ストレージ（Read-access geo-redundant storage）を選択する必要があります。通常の Geo 冗長ストレージ (GRS) では、プライマリ領域がダウンしてフェールオーバーが発生するまでセカンダリ領域のデータは読み取れません。\n\n★【問題文＃44】\n\nHOTSPOT -\nstorage1 という名前のストレージ アカウントを含む Azure サブスクリプションがあります。このサブスクリプションは、オンプレミスの Active Directory ドメインと同期している contoso.com という名前の Azure Active Directory (Azure AD) テナントにリンクされています。\nドメインには次の表に示すセキュリティ プリンシパルが含まれています。\n*(※表は欠落しています)*\nAzure AD で、User2 という名前のユーザーを作成します。\nstorage1 アカウントには share1 という名前のファイル 共有 が含まれており、次の構成があります。","id":32},{"question":"storage1 という名前のストレージ アカウントを含む Azure サブスクリプションがあります。storage1 アカウントには share1 という名前のファイル 共有が含まれています。\nこのサブスクリプションは、Group1 という名前のセキュリティ グループを含むハイブリッド Azure Active Directory (Azure AD) テナントにリンクされています。\nGroup1 に share1 に対する Storage File Data SMB Share Elevated Contributor (ストレージ ファイル データ SMB 共有の権限限度昇格の共同作成者) ロールを付与する必要があります。\nあなたはまず何をすべきですか？","options":[{"label":"A","text":"storage1 の Active Directory Domain Service (AD DS) 認証を有効にする。"},{"label":"B","text":"エクスプローラーを使用して、共有レベルのアクセス許可を付与する。"},{"label":"C","text":"エクスプローラーを使用して share1 をマウントする。"},{"label":"D","text":"プライベート エンドポイントを作成する。"}],"correct":"A","explanation":"Azure Files（ファイル共有）に対して、オンプレミスの AD DS や Azure AD DS を利用した ID ベースのアクセス制御 (SMB 経由) を行うためには、まず対象のストレージ アカウントで AD DS（または Azure AD DS）認証を有効にする必要があります。これを有効にして初めて、共有レベルの RBAC ロール（Storage File Data SMB Share Elevated Contributor など）を特定のユーザーやグループに割り当てることが可能になります。\n\nQuestion #62\n【問題文＃62】※展示画像のある問題\nstorageacct1234という名前のストレージアカウントと、User1、User2という2人のユーザーを含むAzureサブスクリプションがあります。\nUser1には、次の展示に示されているロールが割り当てられています。\nUser1が実行できる2つのアクションはどれですか？それぞれ正解を選択してください。\n\nA. storageacct1234に対してUser2にロールを割り当てる。\nB. storageacct1234にBLOBデータをアップロードする。\nC. storageacct1234のファイアウォールを変更する。\nD. storageacct1234のBLOBデータを表示する。","id":33},{"question":"次の表に示すリソースを含む Azure サブスクリプションがあります。\nWorkspace1 に対して、storage1 のコンテナーに保存されているデータに対する読み取り、書き込み、および削除の操作を許可するロールを割り当てる必要があります。\nどのロールを割り当てるべきですか？\n\n- ストレージ アカウント共同作成者 (Storage Account Contributor)","options":[{"label":"B","text":"共同作成者 (Contributor)"},{"label":"C","text":"ストレージ BLOB データ共同作成者 (Storage Blob Data Contributor)"},{"label":"D","text":"閲覧者とデータアクセス (Reader and Data Access)"}],"correct":"C","explanation":"BLOBコンテナー内の「データそのもの」に対する読み取り・書き込み・削除（データプレーン操作）を行うには、データアクセス用のロールが必要です。「ストレージ BLOB データ共同作成者」はまさにこの権限を提供します。「共同作成者」や「ストレージアカウント共同作成者」は、リソース設定を変更する管理プレーンの権限であり、データ自体にアクセスする権限はデフォルトで含まれていません。","id":34},{"question":"「Subscription1」という名前の Azure サブスクリプションには、次の表（省略）に示すストレージ アカウントが含まれています。\n\nAzure Import/Export サービスを使用して、Subscription1 からデータをエクスポートする予定です。\nデータのエクスポートに使用できるストレージ アカウントを特定する必要があります。\n何を特定するべきですか。","options":[{"label":"A","text":"storage1"},{"label":"B","text":"storage2"},{"label":"C","text":"storage3"},{"label":"D","text":"storage4"}],"correct":"D","explanation":"Azure Import/Export サービスでデータ「エクスポート」機能がサポートされているのは、Azure Blob Storage に限定されます。また、Premium FileStorage や Premium BlockBlobStorage のエクスポートはサポートされていません。エクスポートが可能なのは、Standard 汎用 v2 (General Purpose v2)、Standard 汎用 v1、および Blob Storage のみです。表の中でこれらの要件を満たすアカウント（通常は Standard GPv2 として提示される storage4）を選択します。","id":35},{"question":"次の場所にデータが含まれる Azure サブスクリプションがあります。\n\n「Export1」という名前の Azure Import/Export ジョブを使用してデータをエクスポートする予定です。\nExport1 を使用してエクスポートできるデータを特定する必要があります。\nどのデータを特定する必要がありますか。","options":[{"label":"A","text":"DB1"},{"label":"B","text":"container1"},{"label":"C","text":"share1"},{"label":"D","text":"Table1"}],"correct":"B","explanation":"Azure Import/Export ジョブの「エクスポート」は Azure Blob Storage （コンテナー）内のデータにのみ対応しています。SQLデータベース (DB1)、Azure Files (share1)、Tableストレージ (Table1) からのエクスポートはサポートされていません。","id":36},{"question":"次の表（省略）に示すリソースを含む Azure サブスクリプションがあります。\n\nStore1（ストレージアカウント）には、「data」という名前のファイル共有が含まれており、5,000 個のファイルが存在します。\nファイル共有 data 内のファイルを、「Server1」という名前のオンプレミス サーバーに同期する必要があります。\n実行すべき 3 つのアクションはどれですか。","options":[{"label":"A","text":"コンテナー インスタンスを作成する"},{"label":"B","text":"Server1 を登録する"},{"label":"C","text":"Server1 に Azure File Sync エージェントをインストールする"},{"label":"D","text":"自動化スクリプトをダウンロードする"},{"label":"E","text":"同期グループを作成する"}],"correct":"B","explanation":"Azure File Sync を使用してクラウドのファイル共有とオンプレミスを同期させる手順です。①対象サーバー (Server1) に「Azure File Sync エージェント」をインストールし、②「ストレージ同期サービス」にサーバーを登録し、③同期グループを作成して「クラウドエンドポイント（ファイル共有）」と「サーバーエンドポイント（オンプレミスのパス）」を紐付けます。","id":37},{"question":"次の表（省略）に示すストレージ アカウントを含む Azure サブスクリプションがあります。\n（storage1: 汎用 v1 LRS / storage2: 汎用 v2 LRS / storage3: Blob Storage LRS / storage4: 汎用 v2 GRS）\n\nAzure サポートにライブ マイグレーションをリクエストすることで、ゾーン冗長ストレージ (ZRS) レプリケーションに変換できるストレージ アカウントを特定する必要があります。\n何を特定するべきですか。","options":[{"label":"A","text":"storage1"},{"label":"B","text":"storage2"},{"label":"C","text":"storage3"},{"label":"D","text":"storage4"}],"correct":"B","explanation":"Azure ストレージにおいて、ダウンタイムを発生させることなく LRS（ローカル冗長）や GRS（地理冗長）から ZRS（ゾーン冗長）へ移行する「ライブ マイグレーション（サポートへのリクエストによる移行）」がサポートされているのは、「Standard 汎用 v2 (General Purpose v2)」アカウントのみです。汎用 v1 や Blob Storage アカウントはサポートされていません。通常、要件を満たすLRSからの移行対象として storage2 が該当します。\n\n【問題文＃16 (Topic 3)】\n「account1」という名前のストレージ アカウントを含む Azure サブスクリプションがあります。\nオンプレミス ネットワークから account1 に仮想マシンのディスク ファイルをアップロードする予定です。オンプレミス ネットワークは、131.107.1.0/24 のパブリック IP アドレス空間を使用しています。\nこれらのディスク ファイルを使用して、「VM1」という名前の Azure 仮想マシンをプロビジョニングする予定です。VM1 は、「VNet1」という名前の仮想ネットワーク（IP アドレス空間 192.168.0.0/24）に接続されます。\n以下の要件を満たすように account1 を構成する必要があります。","id":38},{"question":"ローカル冗長ストレージ (LRS) を使用する、storage1 という名前の汎用 v1 (general-purpose v1) Azure ストレージ アカウントがあります。\nゾーン障害が発生した場合でもストレージ アカウント内のデータが保護されるようにする必要があります。このソリューションでは、コストと管理の労力を最小限に抑える必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"新しいストレージ アカウントを作成する。"},{"label":"B","text":"オブジェクト レプリケーション ルールを構成する。"},{"label":"C","text":"アカウントを汎用 v2 (general-purpose v2) にアップグレードする。"},{"label":"D","text":"storage1 のレプリケーション設定を変更する。"}],"correct":"C","explanation":"ゾーン障害に対する保護（可用性ゾーンの障害耐性）を持たせるためには「ゾーン冗長ストレージ (ZRS)」に変更する必要があります。しかし、古い規格である「汎用 v1 (general-purpose v1)」は ZRS をサポートしていません。新しいストレージ アカウントを作成してデータを移行するのは管理の手間がかかるため、既存のアカウントを「汎用 v2」にアップグレードしてから、レプリケーションを ZRS に変更するのが最適解となります。","id":39},{"question":"contosostorage という名前の Azure ストレージ アカウントを作成します。\n「data」という名前のファイル共有を作成する予定です。\nユーザーは、Windows 10 を実行している自宅のコンピューターから「data」ファイル共有にネットワーク ドライブをマッピングする必要があります。\n自宅のコンピューターと data ファイル共有の間で開く必要があるアウトバウンド ポートはどれですか？","options":[{"label":"A","text":"80"},{"label":"B","text":"443"},{"label":"C","text":"445"},{"label":"D","text":"3389"}],"correct":"C","explanation":"Azure ファイル共有を Windows のネットワーク ドライブとして直接マウントするには、SMB (Server Message Block) プロトコルを使用します。SMB は TCP ポート 445 を使用するため、クライアントのネットワーク（ルーターやプロバイダー）側でアウトバウンドの 445 番ポートが許可されている必要があります。","id":40},{"question":"Subscription1 という名前の Azure サブスクリプションがあります。\nSubscription1 に転送する必要がある 5 TB のデータがあります。\nあなたは Azure Import/Export ジョブを使用する予定です。\nインポートされたデータの宛先として使用できるものはどれですか？","options":[{"label":"A","text":"Azure File Storage (Azure Files)"},{"label":"B","text":"Azure Cosmos DB データベース"},{"label":"C","text":"Azure Data Factory"},{"label":"D","text":"Azure SQL データベース"}],"correct":"A","explanation":"Azure Import/Export サービスは、暗号化した物理ハードディスク ドライブを Microsoft データセンターに郵送することで、大量のデータを安全にインポート/エクスポートするサービスです。このサービスのサポートされるインポートの宛先は、「Azure Blob Storage」 と 「Azure File Storage (Azure Files)」 のみです。","id":41},{"question":"storage1 という名前のストレージ アカウントを含む Azure サブスクリプションがあります。\n次の表に示すデバイス環境があります。\n\n・Device 1: Windows 10\n・Device 2: macOS\n・Device 3: Linux\nどのデバイスから AzCopy を使用して storage1 にデータをコピーできますか？","options":[{"label":"A","text":"Device 1 のみ"},{"label":"B","text":"Device 1、Device 2、および Device 3"},{"label":"C","text":"Device 1 および Device 2 のみ"},{"label":"D","text":"Device 1 および Device 3 のみ"}],"correct":"B","explanation":"AzCopy (v10) は、Azure Storage に対して最適なパフォーマンスでデータをコピー（アップロード、ダウンロード、サーバー間同期）するために使用されるコマンドライン ユーティリティです。実行可能ファイルとして提供されており、Windows、macOS、Linux のすべての主要なオペレーティング システムをサポートしています。","id":42},{"question":"storage1 という名前の Azure Storage アカウントがあり、container1 という名前の BLOB コンテナーが含まれています。\ncontainer1 に追加された新しいコンテンツが 1 年間変更されないようにする必要があります。\n何を構成する必要がありますか？","options":[{"label":"A","text":"アクセス層 (the access tier)"},{"label":"B","text":"アクセス ポリシー (an access policy)"},{"label":"C","text":"アクセス制御 (IAM) 設定 (the Access control (IAM) settings)"},{"label":"D","text":"アクセス レベル (the access level)"}],"correct":"B","explanation":"BLOB データが一定期間変更・削除されないようにする（WORM：Write-Once, Read-Many 状態にする）には、コンテナーの「アクセス ポリシー」から「不変ポリシー (Immutability policy / タイムベースの保持ポリシー)」を構成します。これにより、指定した期間（この場合は1年間）コンテンツの上書きや削除を禁止できます。","id":43},{"question":"storage1 という名前の Azure Storage アカウントで Azure Active Directory (Azure AD) 認証を構成しています。\nGroup1 という名前のグループのメンバーが、Azure ポータルを使用してファイルをアップロードできるようにする必要があります。このソリューションでは、最小特権の原則を使用する必要があります。\nstorage1 に対してどの 2 つのロールを構成する必要がありますか？（それぞれの正解がソリューションの一部を示します）","options":[{"label":"A","text":"ストレージ アカウント共同作成者 (Storage Account Contributor)"},{"label":"B","text":"ストレージ BLOB データ共同作成者 (Storage Blob Data Contributor)"},{"label":"C","text":"閲覧者 (Reader)"},{"label":"D","text":"共同作成者 (Contributor)"},{"label":"E","text":"ストレージ BLOB データ閲覧者 (Storage Blob Data Reader)"}],"correct":"B","explanation":"ユーザーが Azure ポータル（GUI）経由でストレージ アカウントのリソースを開き、コンテナーの一覧などをナビゲート（表示）するためには、コントロール プレーンの権限である「閲覧者 (Reader)」ロールが必要です。さらに、実際に BLOB データをコンテナーにアップロード（書き込み）するためには、データ プレーンの権限である「ストレージ BLOB データ共同作成者 (Storage Blob Data Contributor)」ロールが必要になります。最小特権の原則に従い、この2つを付与するのが正解です。","id":44},{"question":"D:\\Folder1 という名前のフォルダーを含むオンプレミス サーバーがあります。\nD:\\Folder1 のコンテンツを、contosodata という名前の Azure Storage アカウント内の public コンテナーにコピーする必要があります。\nどのコマンドを実行する必要がありますか？\n\nA. https://contosodata.blob.core.windows.net/public","options":[{"label":"A","text":"https://contosodata.blob.core.windows.net/public"},{"label":"B","text":"azcopy sync D:\\folder1 https://contosodata.blob.core.windows.net/public --snapshot"},{"label":"C","text":"azcopy copy D:\\folder1 https://contosodata.blob.core.windows.net/public --recursive"},{"label":"D","text":"az storage blob copy start-batch D:\\Folder1 https://contosodata.blob.core.windows.net/public"}],"correct":"C","explanation":"オンプレミスのディレクトリ内のファイルおよびサブディレクトリをすべて Azure Storage のコンテナーへコピーするには、azcopy copy コマンドを使用します。「D:\\Folder1 のコンテンツ（フォルダーの中身すべて）」を対象にするため、再帰的に処理を行う --recursive オプションを付与する必要があります。","id":45},{"question":"Azure サブスクリプションがあります。\nAzure ポータルで、次の設定を持つ storage1 という名前のストレージ アカウントを作成する予定です。\n・パフォーマンス: Standard\n・レプリケーション: ゾーン冗長ストレージ (ZRS)\n・アクセス層 (既定): クール\n・階層型名前空間: 無効\nstorage1 のアカウントの種類 (Account kind) を BlockBlobStorage に設定できるようにする必要があります。\n最初にどの設定を変更する必要がありますか？","options":[{"label":"A","text":"パフォーマンス (Performance)"},{"label":"B","text":"レプリケーション (Replication)"},{"label":"C","text":"アクセス層 (既定) (Access tier (default))"},{"label":"D","text":"階層型名前空間 (Hierarchical namespace)"}],"correct":"A","explanation":"アカウントの種類（Account kind）として「BlockBlobStorage（Premium ブロック BLOB ストレージ）」を選択するためには、前提としてパフォーマンス階層が「Premium (プレミアム)」に設定されている必要があります。初期設定の「Standard」では、汎用 v1 / v2 や BlobStorage のみが選択可能です。","id":46},{"question":"Azure Storage アカウントを作成します。\nこのストレージ アカウントに 10 個の BLOB コンテナーを追加する予定です。\nコンテナーの 1 つについて、保存データの暗号化に「異なるキー（独自のキー）」を使用する必要があります。\nコンテナーを作成する前に何をすべきですか？","options":[{"label":"A","text":"Shared Access Signature (SAS) を生成する。"},{"label":"B","text":"最小 TLS バージョンを変更する。"},{"label":"C","text":"アクセス キーをローテーションする。"},{"label":"D","text":"暗号化スコープ (encryption scope) を作成する。"}],"correct":"D","explanation":"Azure Storage では、既定でアカウント レベルの暗号化キーが全コンテナーに使用されますが、「暗号化スコープ (Encryption scope)」を作成しておくことで、コンテナー単位や特定の BLOB 単位で異なる暗号化キー（Microsoft マネージド キーまたはカスタマー マネージド キー）を適用させることができます。コンテナーの作成時にこの暗号化スコープを指定する必要があるため、事前に作成しておく必要があります。","id":47},{"question":"オンプレミス サーバーに D:\\Folder1 という名前のフォルダーがあります。\nD:\\Folder1 のコンテンツを、contosodata という名前の Azure Storage アカウントの public コンテナーにコピーする必要があります。\nどのコマンドを実行する必要がありますか？","options":[{"label":"A","text":"az storage blob copy start D:\\Folder1 https://contosodata.blob.core.windows.net/public"},{"label":"B","text":"azcopy sync D:\\folder1 https://contosodata.blob.core.windows.net/public --snapshot"},{"label":"C","text":"azcopy copy D:\\folder1 https://contosodata.blob.core.windows.net/public --recursive"},{"label":"D","text":"az storage blob copy start-batch D:\\Folder1 https://contosodata.blob.core.windows.net/public"}],"correct":"C","explanation":"指定したフォルダー（ディレクトリ）内のすべてのファイルとサブフォルダーを含めてコピーするためには、AzCopy コマンドの copy アクションを使用し、再帰的に処理を実行する --recursive オプションを付与するのが適切です。","id":48},{"question":"次の表に示すリソースを含む Azure サブスクリプションがあります。\n\n（※表の例：storage1, storage2 などのストレージアカウント）\n次の表に示すタスクを実行する必要があります。\n\n（※タスクの例：Task1: キューの作成、Task2: コンテナーの作成、Task3: ファイルのアップロード、Task4: ストレージアカウントのアクセス層の変更）\nAzure Storage Explorer を使用して実行できるタスクはどれですか？","options":[{"label":"A","text":"Task1 および Task3 のみ"},{"label":"B","text":"Task1、Task2、および Task3 のみ"},{"label":"C","text":"Task1、Task3、および Task4 のみ"},{"label":"D","text":"Task2、Task3、および Task4 のみ"},{"label":"E","text":"Task1、Task2、Task3、および Task4"}],"correct":"B","explanation":"Azure Storage Explorer は、ストレージ内のデータ（BLOB、ファイル、キュー、テーブル）の作成、アップロード、ダウンロード、管理などの「データ プレーン」の操作を行うための GUI ツールです。コンテナーの作成、ファイルのアップロード、キューの作成などは可能ですが、ストレージアカウント全体の種類変更やアカウントの既定のアクセス層変更といった「コントロール プレーン（Azure Resource Manager レベル）」のタスクは実行できません。","id":49},{"question":"storage1 という名前のストレージ アカウントを含む Azure サブスクリプションがあります。\ncontainer1 という名前の BLOB コンテナーを作成する予定です。\ncontainer1 に対してカスタマー マネージド キー (Customer-Managed Key: CMK) 暗号化を使用する必要があります。\nどのキーを使用する必要がありますか？","options":[{"label":"A","text":"P-384 曲線のみを使用する EC キー"},{"label":"B","text":"P-521 曲線のみを使用する EC キー"},{"label":"C","text":"P-384 または P-521 曲線のみを使用する EC キー"},{"label":"D","text":"キー サイズが 4096 のみの RSA キー"},{"label":"E","text":"キー サイズが 2048、3072、または 4096 のみの RSA キー タイプ"}],"correct":"E","explanation":"Azure Storage のカスタマー マネージド キー (CMK) 暗号化には、Azure Key Vault に保存されたキーを使用します。Azure Storage の暗号化でサポートされているキーの種類とサイズは、RSA および RSA-HSM のキー サイズ 2048、3072、4096 です。","id":50},{"question":"Azure サブスクリプションがあります。サブスクリプションには、（※省略された表に示す）ライフサイクル管理ルールを持つ storage1 という名前のストレージ アカウントが含まれています。\n\n6月1日に、storage1 のホット (Hot) アクセス層に File1 という名前の BLOB を保存します。\n6月7日の時点での File1 の状態はどうなっていますか？","options":[{"label":"A","text":"クール (Cool) アクセス層に保存されている"},{"label":"B","text":"アーカイブ (Archive) アクセス層に保存されている"},{"label":"C","text":"ホット (Hot) アクセス層に保存されている"},{"label":"D","text":"削除されている"}],"correct":"A","explanation":"本問題の典型的なライフサイクル管理ルールの表では、「最後に変更されてから 5 日後にクール層へ移動する」という設定がなされています。6月1日に作成/変更された File1 は、5日後である6月6日のタイミングでクール層に移動されます。したがって、6月7日の時点ではクール層に存在していることになります。","id":51},{"question":"share1 という名前のファイル共有を含む、storage1 という名前の Azure ストレージ アカウントを作成する予定です。\nshare1 が SMB マルチチャネル (SMB Multichannel) をサポートできるようにする必要があります。このソリューションではコストを最小限に抑える必要があります。\nストレージをどのように構成する必要がありますか？","options":[{"label":"A","text":"ローカル冗長ストレージ (LRS) を使用した Premium パフォーマンス"},{"label":"B","text":"ゾーン冗長ストレージ (ZRS) を使用した Standard パフォーマンス"},{"label":"C","text":"Geo 冗長ストレージ (GRS) を使用した Premium パフォーマンス"},{"label":"D","text":"ローカル冗長ストレージ (LRS) を使用した Standard パフォーマンス"}],"correct":"A","explanation":"Azure Files でネットワーク パフォーマンスを向上させる「SMB マルチチャネル」機能は、「Premium (プレミアム) パフォーマンス」のファイル共有（FileStorage アカウントタイプ）でのみサポートされています。Standard パフォーマンスでは利用できません。さらに、コストを最小限にするという要件を満たすため、冗長性オプションの中では最も安価な「ローカル冗長ストレージ (LRS)」を選択するのが正解です。","id":52},{"question":"注：この問題は、同じシナリオを提示する一連の質問の一部です。シリーズの各質問には、記載された目標を達成する可能性のある独自の解決策が含まれています。\nこのセクションの質問に回答した後は、元に戻ることはできません。そのため、これらの質問はレビュー画面に表示されません。\n\nstorage1 という名前の Azure ストレージ アカウントがあります。\nUser1 という名前のユーザーが、storage1 のストレージ アカウント キーの一覧表示 (list) と再生成 (regenerate) を実行できるようにする必要があります。\n\n解決策：User1 に「ストレージ アカウント暗号化スコープ共同作成者 (Storage Account Encryption Scope Contributor)」ロールを割り当てます。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい (Yes)"},{"label":"B","text":"いいえ (No)"}],"correct":"B","explanation":"「ストレージ アカウント暗号化スコープ共同作成者」ロールは、ストレージ アカウントにおける暗号化スコープの作成と管理に特化したロールであり、アカウント キーの一覧表示や再生成を行うためのアクセス許可 (Microsoft.Storage/storageAccounts/listkeys/action など) を持っていません。目標を達成するには、「ストレージ アカウント キー オペレーター サービス ロール (Storage Account Key Operator Service Role)」や「共同作成者 (Contributor)」などのロールを割り当てる必要があります。","id":53},{"question":"contoso.comという名前のAzure ADテナントがあります。\n「App1」という名前のAzure App Service Webアプリと、「KV1」という名前のAzure Key Vaultを含むAzureサブスクリプションがあります。KV1にはcontoso.comのワイルドカード証明書が含まれています。\nあなたは user1@contoso.com というユーザーであり、App1とKV1の両方で「所有者（Owner）」ロールが割り当てられています。\nKV1のワイルドカード証明書をApp1で使用するように構成する必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"KV1のアクセスポリシーを作成し、Microsoft Azure App Serviceプリンシパルをポリシーに割り当てる。"},{"label":"B","text":"App1にマネージドユーザーIDを割り当てる。"},{"label":"C","text":"KV1でロールベースのアクセス制御（RBAC）認可システムを使用するように構成する。"},{"label":"D","text":"KV1のアクセスポリシーを作成し、User1にポリシーを割り当てる。"}],"correct":"A","explanation":"App Service（Web Apps）からKey Vaultに保存されている証明書（Key Vault 証明書）をインポートするためには、App Serviceのバックエンドシステムである「Microsoft.Azure.WebSites」というファーストパーティのサービスプリンシパルが、Key Vaultに対する読み取り（Get）のアクセスポリシー権限を持っている必要があります。これが構成されていないと、ポータルやコマンドからApp Serviceへ証明書をインポートすることができません。\n\n【関連する出題項目】\n② ストレージを実装して管理する （または ③ Azure のコンピューティング リソースをデプロイおよび管理する）","id":54},{"question":"storage1という名前のストレージアカウントを含むAzureサブスクリプションがあります。\n選択したネットワークおよびホームオフィス（特定のIP）から storage1 へのアクセスを許可する必要があります。ソリューションは管理作業を最小限に抑える必要があります。\nstorage1に対して最初に何をすべきですか？","options":[{"label":"A","text":"プライベートエンドポイントを追加する。"},{"label":"B","text":"パブリックネットワークアクセス設定を変更する。"},{"label":"C","text":"インターネットルーティングを選択する。"},{"label":"D","text":"アクセス制御 (IAM) 設定を変更する。"}],"correct":"B","explanation":"ストレージアカウントにファイアウォールを構成し、「特定のIPアドレス」や「特定の仮想ネットワーク」からのみアクセスを許可するには、まずストレージアカウントのネットワーク設定画面で、「パブリックネットワークアクセス（Public network access）」の設定を「すべてのネットワークから有効」から、「選択した仮想ネットワークとIPアドレスから有効（Enabled from selected virtual networks and IP addresses）」に変更する必要があります。この変更を行うことで、初めて許可リストにホームオフィスのIPアドレス等を指定できるようになります。\n\n【関連する出題項目】\n②ストレージを実装して管理する\n\n【問題文＃112】\nストレージアカウントを含む Azure サブスクリプションがあります。このアカウントには Web サイトのデータが保存されています。\nユーザーからのインバウンドトラフィックが、ユーザーの場所に最も近い Microsoft の POP (Point-of-Presence) を使用するようにする必要があります。","id":55},{"question":"北ヨーロッパのAzureリージョンに storage1 という名前のストレージアカウントを含むAzureサブスクリプションがあります。\nblobデータが storage1 に追加されたときに、米国東部リージョンにセカンダリコピーが作成されるようにする必要があります。このソリューションは管理工数を最小限に抑える必要があります。\n何を構成すべきですか？","options":[{"label":"A","text":"オペレーショナルバックアップ"},{"label":"B","text":"オブジェクトレプリケーション"},{"label":"C","text":"地理冗長ストレージ (GRS)"},{"label":"D","text":"ライフサイクル管理ルール"}],"correct":"B","explanation":"ストレージアカウントの「オブジェクトレプリケーション」を使用すると、あるストレージアカウント内のコンテナーから、指定した別のリージョンにあるストレージアカウント内のコンテナーへ、非同期でBlobを自動コピーできます。「C. GRS（地理冗長ストレージ）」はAzure側で決められたペアリージョン（北ヨーロッパのペアは西ヨーロッパ）に自動でレプリケートされる仕組みであり、任意のリージョン（米国東部）を指定することはできないため不正解です。\n\n【関連する出題項目】 ②ストレージを実装して管理する","id":56},{"question":"Ubuntu Server 仮想マシンを会社の Azure サブスクリプションにデプロイすることを計画しています。\nあなたは、特定の信頼されたルート証明機関 (CA) の追加を含む、カスタムデプロイを実装する必要があります。\n仮想マシンの作成には、次のうちどれを使用する必要がありますか？","options":[{"label":"A","text":"New-AzureRmVm コマンドレット"},{"label":"B","text":"New-AzVM コマンドレット"},{"label":"C","text":"Create-AzVM コマンドレット"},{"label":"D","text":"az vm create コマンド"}],"correct":"D","explanation":"Linux VM（Ubuntuなど）の初回デプロイ時にルートCAの追加といったカスタム構成を行うには、cloud-init（カスタムデータ）を使用するのが標準的です。Azure CLI の az vm create コマンドは --custom-data パラメーターをネイティブにサポートしており、cloud-init の構成ファイルを渡すことで簡単にカスタムデプロイを実行できるため、このシナリオで推奨されます。","id":57},{"question":"注：この問題は、同一の設定を示す一連の問題の一部です。ただし、各問題には異なる結果が提示されています。解決策が要件を満たしているかを判断してください。\n\n（※前提条件は問題文＃13と同じです）\n\n解決策：「リソースグループ」のブレードにアクセスする。\nこの解決策は目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"リソースグループのブレードにある「デプロイ」セクションにアクセスすることで、そのリソースグループに対して実行されたすべての過去のデプロイメント履歴と、その際に使用されたARMテンプレートの全体を直接確認することができます。\n\n【関連する出題項目】\n③Azure のコンピューティング リソースをデプロイおよび管理する","id":58},{"question":"あなたの会社には、1つの可用性セットに含まれる3つの仮想マシン (VM) があります。\nそのうちの1つのVMのサイズを変更しようとすると、割り当て失敗 (allocation failure) メッセージが返されます。\nしかし、このVMのサイズ変更は必須要件です。\nあなたは次のうちどのアクションを取るべきですか？","options":[{"label":"A","text":"1つのVMだけを停止する。"},{"label":"B","text":"2つのVMを停止する。"},{"label":"C","text":"3つすべてのVMを停止する。"},{"label":"D","text":"可用性セットから対象のVMを削除する。"}],"correct":"C","explanation":"可用性セット内のVMは、基盤となる同じ物理ハードウェアクラスターに配置されます。サイズ変更時に割り当て失敗が発生するのは、現在のハードウェアクラスターが変更後の新しいサイズをサポートしていないためです。これを解決するには、可用性セット内の「すべてのVM」を一旦停止（割り当て解除）し、新しいサイズ要件を満たす別のクラスターに全体が再配置されるようにしてからサイズを変更する必要があります。","id":59},{"question":"単一のデータディスクが接続されている Azure 仮想マシン (VM) があります。あなたはこのデータディスクを別の Azure VM に接続するよう指示されました。\n仮想マシンのオフライン時間を最小限に抑える戦略を立てる必要があります。\n最初に実行すべきアクションは次のうちどれですか？","options":[{"label":"A","text":"データディスクを含むVMを停止する。"},{"label":"B","text":"データディスクを接続する予定のVMを停止する。"},{"label":"C","text":"データディスクをデタッチ（切断）する。"},{"label":"D","text":"データディスクを含むVMを削除する。"}],"correct":"C","explanation":"Azure VMでは、VMが稼働中であってもデータディスクをデタッチ（取り外し）することがサポートされています。VMを停止する必要がないため、両方のVMのダウンタイム（オフライン時間）を最小限に抑えるには、OS上で適切にアンマウント処理を行った後、稼働したままディスクのデタッチを実行するのが最も適切な最初のアクションです。","id":60},{"question":"あなたの会社には Azure サブスクリプションがあります。\nAzure Resource Manager (ARM) テンプレートを使用して、複数の Azure 仮想マシン (VM) をデプロイする必要があります。これらのVMは単一の可用性セットに含まれると通知されています。\nファブリックの障害やメンテナンスの際に、できるだけ多くのVMがアクセス可能な状態を維持できるように ARM テンプレートを構成する必要があります。\nplatformFaultDomainCount (障害ドメイン数) プロパティには、次のどの値を構成するべきですか？","options":[{"label":"A","text":"10"},{"label":"B","text":"30"},{"label":"C","text":"Min Value (最小値)"},{"label":"D","text":"Max Value (最大値)"}],"correct":"D","explanation":"障害ドメイン（Fault Domain）は、共通の電源とネットワークスイッチを共有する基盤ハードウェアのグループを指します。VMをできるだけ多くの障害ドメインに分散させる（すなわち最大値を設定する）ことで、ハードウェア障害時に同時に影響を受けるVMの数を最小限に抑えることができます。（通常、可用性セットの障害ドメインの最大値はリージョンにより 2 または 3 です。）","id":61},{"question":"（※前提条件は問題文＃18と同じです）\nファブリックの障害やメンテナンスの際に、できるだけ多くのVMがアクセス可能な状態を維持できるように ARM テンプレートを構成する必要があります。\nplatformUpdateDomainCount (更新ドメイン数) プロパティには、次のどの値を構成するべきですか？","options":[{"label":"A","text":"10"},{"label":"B","text":"20"},{"label":"C","text":"30"},{"label":"D","text":"40"}],"correct":"B","explanation":"更新ドメイン（Update Domain）は、基盤となるホストインフラストラクチャがパッチ適用などで再起動される際に、同時に再起動される論理的なグループです。ARMテンプレート等で可用性セットを作成する場合、更新ドメインとして設定可能な最大値は「20」です。これを最大値に設定することで、計画的メンテナンス時に同時にダウンするVMの割合を最小限に抑えることができます。","id":62},{"question":"あなたの会社には、オンプレミスの Active Directory ドメインとハイブリッド共存するように構成された Azure Active Directory (Azure AD) テナントがあります。\nオンプレミスの仮想環境は、Windows Server 2012 R2 Hyper-V ホストサーバー上で実行される仮想マシン (VM) で構成されています。\nあなたは、新しく作成されるVMの構成を自動化するためのいくつかの PowerShell スクリプトを作成しました。今後、複数の新しいVMを作成する予定です。\nスクリプトが新しいVM上で確実に実行されるようにするソリューションが必要です。\n次のうち、最適なソリューションはどれですか？\n\nA. %windir%\\setup\\scripts ディレクトリに SetupComplete.cmd バッチファイルを構成する。","options":[{"label":"A","text":"%windir%\\setup\\scripts ディレクトリに SetupComplete.cmd バッチファイルを構成する。"},{"label":"B","text":"ログオンスクリプトとしてスクリプトを実行するグループポリシーオブジェクト (GPO) を構成する。"},{"label":"C","text":"スタートアップスクリプトとしてスクリプトを実行するグループポリシーオブジェクト (GPO) を構成する。"},{"label":"D","text":"新しい仮想ハードディスク (VHD) にスクリプトを配置する。"}],"correct":"C","explanation":"Active Directory ドメイン環境において、新しく作成・参加したVMに対して、ユーザーのログオン操作を待たずにシステムレベルの権限で確実に構成スクリプトを実行させるには、GPOの「スタートアップスクリプト」を使用するのが最適かつ標準的な管理手法です。","id":63},{"question":"contoso.com という名前の Azure Active Directory (Azure AD) テナントと、AKS1 という名前の Azure Kubernetes Service (AKS) クラスターを含む Azure サブスクリプションがあります。\n管理者は、contoso.com のユーザーに AKS1 へのアクセス権を付与できないと報告しています。\ncontoso.com のユーザーに AKS1 へのアクセス権を付与できるようにする必要があります。\n最初に何をするべきですか？","options":[{"label":"A","text":"contoso.com から、組織の関係の設定を変更する。"},{"label":"B","text":"contoso.com から、OAuth 2.0 承認エンドポイントを作成する。"},{"label":"C","text":"AKS1 を再作成する。"},{"label":"D","text":"AKS1 から、名前空間を作成する。"}],"correct":"C","explanation":"従来の仕様では、AKS クラスター作成時に Azure AD 統合を有効にしていない場合、後から既存のクラスターに対して Azure AD 統合を有効にすることはできず、クラスターを再作成する必要がありました。（※注：現在の Azure の仕様では、AKS マネージド Azure AD 統合により既存クラスターの更新が可能になっていますが、本試験問題の正解としては「再作成」が想定されています。）","id":64},{"question":"最近、Admin1 というユーザーを含む新しい Azure サブスクリプションを作成しました。\nAdmin1 は Azure Resource Manager (ARM) テンプレートを使用して Azure Marketplace リソースをデプロイしようと試みます。Admin1 が Azure PowerShell を使用してテンプレートをデプロイすると、次のエラーメッセージが表示されます。\n「ユーザーはリソースを購入するための検証に失敗しました。エラー メッセージ: このサブスクリプションでは、このアイテムの法的条件が同意されていません。法的条件に同意するには、Azure portal にアクセスしてプログラムによるデプロイを構成するか、そこで初めてリソースを作成してください。」\nAdmin1 が Marketplace リソースを正常にデプロイできるようにする必要があります。\n何をするべきですか？","options":[{"label":"A","text":"Azure PowerShell から、Set-AzApiManagementSubscription コマンドレットを実行する。"},{"label":"B","text":"Azure portal から、Microsoft.Marketplace リソースプロバイダーを登録する。"},{"label":"C","text":"Azure PowerShell から、Set-AzMarketplaceTerms コマンドレットを実行する。"},{"label":"D","text":"Azure portal から、Admin1 に「課金管理者 (Billing administrator)」ロールを割り当てる。"}],"correct":"C","explanation":"一部の Azure Marketplace イメージやサードパーティ製リソースを ARM テンプレートや PowerShell から「プログラムで」デプロイする場合、事前にそのイメージのライセンス条項（法的条件）に同意する必要があります。PowerShell からこの条項に同意するには、Get-AzMarketplaceTerms で条件を取得し、Set-AzMarketplaceTerms コマンドレットを使用して同意状態を保存します。\n\n★【問題文＃23】\n\nHOTSPOT -\n米国東部 2 (East US 2) リージョンに VNET1 という名前の仮想ネットワークを含む Azure サブスクリプションがあります。VM1-NI という名前のネットワーク インターフェイスが VNET1 に接続されています。\n次の Azure Resource Manager (ARM) テンプレートを正常にデプロイします。\n*(※テンプレートの画像データが欠落)*\n以下の各ステートメントについて、ステートメントが true の場合は Yes を選択してください。それ以外の場合は、No を選択してください。","id":65},{"question":"Azure仮想マシンをデプロイするために使用される Template1 という名前の Azure Resource Manager テンプレートがあります。\nTemplate1 には次のテキストが含まれています。\n（※パラメーターセクションに location パラメーターの定義があります）\nTemplate1 の variables（変数）セクションには次のテキストが含まれています：\n\"location\": \"westeurope\"\nTemplate1 の resources（リソース）セクションには次のテキストが含まれています：\n\"location\": \"[parameters('location')]\"\n\nTemplate1 を使用して、仮想マシンを West US（米国西部）の場所にデプロイする必要があります。\n何をすべきですか？\n\n- リソースセクションの場所 (location) を westus に変更する","options":[{"label":"B","text":"デプロイ中に West US を選択する"},{"label":"C","text":"変数セクションの場所 (location) を westus に変更する"}],"correct":"B","explanation":"ARMテンプレートのリソースセクションでは \"location\": \"[parameters('location')]\" と記述されており、変数 (variables) ではなくパラメータ (parameters) の値を参照するように設定されています。そのため、変数セクションの \"westeurope\" という値は使用されません。デプロイを実行する際に、パラメータの値として「West US」を指定（選択）することで、米国西部にデプロイすることが可能です。\n\n【関連する出題項目】\n③Azure のコンピューティング リソースをデプロイおよび管理する\n\n【問題文＃13】\nPlan1 という名前の App Service プランと、webapp1 という名前の Azure Web App を作成します。\nステージングスロットを作成するオプションが利用できないことに気づきました。\nPlan1 のステージングスロットを作成する必要があります。\n最初に何をすべきですか？\n\nA. Plan1 から App Service プランをスケールアップする\nB. webapp1 からアプリケーション設定を変更する\nC. webapp1 からカスタムドメインを追加する\nD. Plan1 から App Service プランをスケールアウトする","id":66},{"question":"問題文：\nあなたは、以下の表に示すリソースを含むAzureサブスクリプションを持っています。\n（※VM1はVNET1に接続されています。）\nVM1をVNET2に接続する必要があります。\n解決策：VM1を削除します。VM1を再作成し、VM1用の新しいネットワークインターフェイスを作成してVNET2に接続します。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"A","explanation":"Azureでは、既存の仮想マシン（VM）が現在接続されている仮想ネットワーク（VNET）を、後から直接変更することはできません。VMを別のVNETに移動させる唯一の方法は、既存のVMを一度削除してから新しいネットワークインターフェイスを作成し、移動先のVNET（VNET2）に接続した状態でVMを再作成することです（OSディスクなどは引き継ぐことができます）。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する\n④ 仮想ネットワークを実装および管理する","id":67},{"question":"問題文：\nあなたは、以下の表に示すIPアドレスを使用する Cluster1 という名前の Azure Kubernetes Service (AKS) クラスターをデプロイします。\n\nインターネット上のユーザーに、Cluster1 で実行されているアプリケーションへのアクセスを提供する必要があります。\nCluster1 の DNS レコードにはどの IP アドレスを含めるべきですか？","options":[{"label":"A","text":"131.107.2.1"},{"label":"B","text":"10.0.10.11"},{"label":"C","text":"172.17.7.1"},{"label":"D","text":"192.168.10.2"}],"correct":"A","explanation":"インターネット上のユーザーがアプリケーションにアクセスするためには、インターネット経由で到達可能なパブリックIPアドレスが必要です。提示された選択肢の中で「131.107.2.1」はパブリックIPアドレスであり、その他のアドレス（10.x.x.x、172.x.x.x、192.168.x.x）はすべてプライベート（ローカル）IPアドレスです。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する\n④ 仮想ネットワークを実装および管理する","id":68},{"question":"問題文：\nあなたは、10 個の Azure Web アプリをデプロイするために使用される Template1 という名前のデプロイメント テンプレートを持っています。\nTemplate1 をデプロイする前に、何をデプロイすべきかを特定する必要があります。このソリューションは Azure のコストを最小限に抑える必要があります。\n何を特定すべきですか？","options":[{"label":"A","text":"5つの Azure Application Gateway"},{"label":"B","text":"1つの App Service プラン"},{"label":"C","text":"10個の App Service プラン"},{"label":"D","text":"1つの Azure Traffic Manager"},{"label":"E","text":"1つの Azure Application Gateway"}],"correct":"B","explanation":"Azure Web Apps（Web アプリ）をデプロイするには、実行環境である App Service プランが事前に必要です。コストを最小限に抑えるため、10個のWeb アプリごとに個別のプラン（C）を作るのではなく、1つのApp Serviceプランを共有してすべてのWebアプリをその上でホスト（B）するのが最も経済的です。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":69},{"question":"問題文：\nあなたは、VM1 という名前の仮想マシンを含む Azure サブスクリプションを持っています。VM1 は 24 時間利用可能な基幹業務アプリケーションをホストしています。VM1 には 1 つのネットワーク インターフェイスと 1 つのマネージド ディスクがあります。VM1 は D4s v3 サイズを使用しています。\nあなたは VM1 に以下の変更を加える予定です：\n・サイズを D8s v3 に変更する。\n・500 GB のマネージド ディスクを追加する。\n・Puppet Agent 拡張機能を追加する。\n・Desired State Configuration (DSC) 管理を有効にする。\nVM1 のダウンタイムを引き起こす変更はどれですか？","options":[{"label":"A","text":"Desired State Configuration 管理を有効にする"},{"label":"B","text":"500 GB のマネージド ディスクを追加する"},{"label":"C","text":"サイズを D8s v3 に変更する"},{"label":"D","text":"Puppet Agent 拡張機能を追加する"}],"correct":"C","explanation":"仮想マシンのサイズ（コンピューティングリソースのスペック）を変更する場合、VMは一度割り当て解除（Deallocate）され、再起動されるプロセスを伴うためダウンタイムが発生します[][]。データディスクの追加や、エージェントや拡張機能のインストール・有効化は、VMが実行中のままダウンタイムなしに行うことが可能です[][]。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":70},{"question":"問題文：\nあなたは、webapp1 という名前の Azure Web アプリ上で実行される App1 という名前のアプリを持っています。\nあなたの会社の開発者は、App1 のアップデートを Git1 という名前の Git リポジトリにアップロードします。\nWebapp1 には、以下の表に示すデプロイメント スロットがあります。（※webapp1-prod および webapp1-test）\n\nあなたは、App1 のアップデートがユーザーに提供される前に、確実にテストされるようにする必要があります。\nどの2つのアクションを実行すべきですか？各正解はソリューションの一部を示します。\n注: それぞれの正しい選択は 1 ポイントの価値があります。","options":[{"label":"A","text":"スロットをスワップする"},{"label":"B","text":"App1 のアップデートを webapp1-prod にデプロイし、アップデートをテストする"},{"label":"C","text":"webapp1-prod を停止する"},{"label":"D","text":"App1 のアップデートを webapp1-test にデプロイし、アップデートをテストする"},{"label":"E","text":"webapp1-test を停止する"}],"correct":"A","explanation":"本番環境（webapp1-prod）に直接アップデートを展開するとリスクが伴います。ダウンタイムなしで安全に更新を提供するためには、まずテスト用のスロット（webapp1-test）にアップデートをデプロイして事前検証（テスト）を実施します（D）[]。テストをパスした後に、テストスロットと本番スロットを「スワップ（入れ替え）」することで、ユーザーに対して即座に安全な更新バージョンを提供できます（A）[]。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":71},{"question":"問題文：\nできるだけ早く 5 つのインスタンスを含む Azure 仮想マシンスケールセット (VMSS) をデプロイする必要があります。\nあなたは何をすべきですか？","options":[{"label":"A","text":"5つの仮想マシンをデプロイする。各仮想マシンの可用性ゾーン (Availability Zones) 設定を変更する。"},{"label":"B","text":"5つの仮想マシンをデプロイする。各仮想マシンのサイズ設定を変更する。"},{"label":"C","text":"オーケストレーション モードが「VM (仮想マシン) 」に設定された 1 つの仮想マシン スケール セットをデプロイする。"},{"label":"D","text":"オーケストレーション モードが「ScaleSetVM (均一) 」に設定された 1 つの仮想マシン スケール セットをデプロイする。"}],"correct":"D","explanation":"同一の構成を持つ複数のVMを「最も早く」かつ一括で展開・スケーリングするには、VMSSの「均一（Uniform / ScaleSetVM）オーケストレーション モード」を使用するのが最適です。均一モードは同一のVMプロファイルを利用して大規模・高速なデプロイに最適化されています。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":72},{"question":"問題文：\n以下の表に示す Azure Web アプリを作成する予定です。\n\n（※表の例：WebApp1 = .NET Core / WebApp2 = ASP.NET V4.7 (Windows専用) / WebApp3 = PHP / WebApp4 = Ruby (Linux専用)）\nWeb アプリのために作成すべき App Service プランの最小数はいくつですか？","options":[{"label":"A","text":"1"},{"label":"B","text":"2"},{"label":"C","text":"3"},{"label":"D","text":"4"}],"correct":"B","explanation":"Azure App Service プランは、同じプラン内で「Windows」と「Linux」のオペレーティングシステム（OS）を混在させることはできません。ASP.NET は Windows ベースのプランが必要であり、Ruby などは Linux ベースのプランが必要です。そのため、すべてをホストするためには Windows 用と Linux 用で「最低 2 つ」の App Service プランを作成する必要があります[][]。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":73},{"question":"問題文：\nあなたは Subscription1 という名前の Azure サブスクリプションを持っています。Subscription1 には RG1 という名前のリソース グループが含まれています。RG1 にはテンプレートを使用してデプロイされたリソースが含まれています。\nあなたは RG1 でリソースが作成された日付と時刻を表示する必要があります。\n解決策：サブスクリプション ブレードからサブスクリプションを選択し、「プログラムによるデプロイ (Programmatic deployment)」をクリックします。\nこれは目標を達成していますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"テンプレートを使用してデプロイされたリソースの作成日時などの履歴を確認するには、該当するリソース グループ（RG1）のブレード内にある「デプロイ（Deployments）」セクションにアクセスする必要があります。サブスクリプションの「プログラムによるデプロイ」からは確認できません。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":74},{"question":"問題文：\nあなたは AKS1 という名前の Azure Kubernetes Service (AKS) クラスターを持っています。\nAKS1 のクラスター オートスケーラー (cluster autoscaler) を構成する必要があります。\nどの 2 つのツールを使用すべきですか？各正解は完全なソリューションを示します。\n注: それぞれの正しい選択は 1 ポイントの価値があります。","options":[{"label":"A","text":"kubectl コマンド"},{"label":"B","text":"az aks コマンド"},{"label":"C","text":"Set-AzVm コマンドレット"},{"label":"D","text":"Azure portal"},{"label":"E","text":"Set-AzAks コマンドレット"}],"correct":"B","explanation":"AKSのクラスター オートスケーラー（ノードプールのノード数の自動スケーリング）を有効化または構成するには、Azure CLI の az aks update などのコマンド（B）を使用するか、Azure Portal のGUI画面（D）から設定を行います。\nkubectl は Kubernetes 内部のポッドのオートスケーリング（HPA）の設定などに使用しますが、AKSのインフラストラクチャ（VMノード）レベルのスケーリング設定には使用しません。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":75},{"question":"問題文：\nあなたは Azure サブスクリプションに以下のリソースを作成します：\n・Registry1 という名前の Azure Container Registry (ACR) インスタンス\n・Cluster1 という名前の Azure Kubernetes Service (AKS) クラスター\nあなたは管理ワークステーション上で App1 という名前のコンテナ イメージを作成します。\nApp1 を Cluster1 にデプロイする必要があります。\n最初に何をすべきですか？","options":[{"label":"A","text":"docker push コマンドを実行する。"},{"label":"B","text":"App Service プランを作成する。"},{"label":"C","text":"az acr build コマンドを実行する。"},{"label":"D","text":"az aks create コマンドを実行する。"}],"correct":"A","explanation":"管理ワークステーション上で「すでに作成（ビルド）された」コンテナイメージ (App1) を AKS (Cluster1) にデプロイするためには、まずそのイメージを AKS がアクセスできるコンテナレジストリ (Registry1) にアップロード（プッシュ）する必要があります。したがって、最初に docker push コマンドを使用して ACR にイメージを保存するステップが必要です。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":76},{"question":"問題文：\nあなたは、以下の表に示すリソースを含む Azure サブスクリプションを持っています。\n（※表の例：VMSS1 は米国東部 (East US) に配置されていると仮定します。Proximity1 と Proximity3 が米国東部にあり、Proximity2 が米国西部に配置されています。）\n\nVMSS1 のために近接配置グループ (proximity placement group) を構成する必要があります。\nどの近接配置グループを使用すべきですか？","options":[{"label":"A","text":"Proximity2 のみ"},{"label":"B","text":"Proximity1、Proximity2、および Proximity3"},{"label":"C","text":"Proximity1 のみ"},{"label":"D","text":"Proximity1 および Proximity3 のみ"}],"correct":"D","explanation":"近接配置グループ（Proximity Placement Group）は、仮想マシンや仮想マシンスケールセット（VMSS）を物理的に近い場所に配置してネットワークレイテンシを最小限に抑えるための論理グループです。近接配置グループは特定のリージョンに紐付いて作成されるため、リソース（VMSS1）は「完全に同じリージョン」に存在する近接配置グループにのみ割り当てることができます。したがって、VMSS1 と同じリージョンにある Proximity1 と Proximity3 のみが選択可能です。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":77},{"question":"問題文：\nあなたは VM1、VM2、および VM3 という名前の 3 つの Azure 仮想マシンをデプロイする予定です。これらの仮想マシンは App1 という名前の Web アプリをホストします。\n単一の Azure データセンターが利用できなくなった場合でも、少なくとも 2 つの仮想マシンが利用可能であることを保証する必要があります。\n何をデプロイすべきですか？","options":[{"label":"A","text":"3 つすべての仮想マシンを単一の可用性ゾーン (Availability Zone) に配置する"},{"label":"B","text":"すべての仮想マシンを単一の可用性セット (Availability Set) に配置する"},{"label":"C","text":"各仮想マシンを別々の可用性ゾーン (Availability Zone) に配置する"},{"label":"D","text":"各仮想マシンを別々の可用性セット (Availability Set) に配置する"}],"correct":"C","explanation":"単一の「データセンター全体」の障害（火災や大規模停電など）から保護するには、物理的に独立したデータセンターである「可用性ゾーン（Availability Zone）」をまたいで配置する必要があります。3つのVMをそれぞれZone 1、Zone 2、Zone 3に分散して配置すれば、1つのゾーン（データセンター）が完全にダウンしても、残りの2つのゾーンにあるVMは稼働し続けるため、要件を満たします。（可用性セットは、同一データセンター内のラック障害に対する保護しか提供しません）\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":78},{"question":"問題文：\nあなたは Windows Server 2019 を実行する VM1 という名前の Azure 仮想マシンを持っています。\nあなたは VM1 を Template1 という名前のテンプレートとして Azure Resource Manager ライブラリに保存します。\nあなたは Template1 から VM2 という名前の仮想マシンをデプロイする予定です。\nVM2 のデプロイメント中に構成できるものは何ですか？","options":[{"label":"A","text":"オペレーティング システム"},{"label":"B","text":"管理者のユーザー名 (administrator username)"},{"label":"C","text":"仮想マシンのサイズ"},{"label":"D","text":"リソース グループ"}],"correct":"B","explanation":"稼働中の仮想マシンをテンプレート（ARM テンプレート）としてエクスポートした場合、セキュリティ上の理由から、OS の管理者パスワードなどはテンプレート内に保存されません。また、「管理者のユーザー名（adminUsername）」もパラメータ化されるため、テンプレートを使用して新しい仮想マシン（VM2）をデプロイする際、プロビジョニングのために管理者ユーザー名とパスワードを新たに構成（指定）することが可能になります。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":79},{"question":"問題文：\nあなたは、VM1 という名前の Azure 仮想マシンを含む Azure サブスクリプションを持っています。VM1 は、複数のアクティブインスタンスをサポートしない App1 という名前の財務報告アプリを実行しています。\n各月末に、App1 の実行時に VM1 の CPU 使用率がピークに達します。\nあなたは、各月末に VM1 のプロセッサのパフォーマンスを向上させるスケジュールされた Runbook を作成する必要があります。\nRunbook にはどのタスクを含めるべきですか？","options":[{"label":"A","text":"Azure Performance Diagnostics エージェントを VM1 に追加する。"},{"label":"B","text":"VM1 の VM サイズプロパティを変更する。"},{"label":"C","text":"VM1 をスケールセットに追加する。"},{"label":"D","text":"サブスクリプションの vCPU クォータを増やす。"},{"label":"E","text":"Desired State Configuration (DSC) 拡張機能を VM1 に追加する。"}],"correct":"B","explanation":"アプリケーションが複数のインスタンス（スケールアウト）をサポートしていないため、性能を向上させるには、単一の VM 自体のスペック（CPUやメモリ）を上げる「スケールアップ（垂直スケーリング）」を行う必要があります。Runbook に VM のサイズを変更するスクリプトを含めることで、月末の負荷増加に対応できます。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":80},{"question":"問題文：\nあなたは、Azure Resource Manager テンプレートを使用して、仮想マシンスケールセット内に Windows Server 2019 を実行する複数の Azure 仮想マシンをデプロイする予定です。\n仮想マシンのデプロイ後、すべての仮想マシンで NGINX が利用可能であることを確実にする必要があります。\n何を使用すべきですか？","options":[{"label":"A","text":"Azure App Service のデプロイセンター"},{"label":"B","text":"Desired State Configuration (DSC) 拡張機能"},{"label":"C","text":"New-AzConfigurationAssignment コマンドレット"},{"label":"D","text":"Microsoft Intune デバイス構成プロファイル"}],"correct":"B","explanation":"仮想マシンや仮想マシンスケールセットの展開後に、OS 内の構成を自動化したり、特定のソフトウェア（NGINXなど）をインストールして維持したりするには、Desired State Configuration (DSC) 拡張機能 または カスタムスクリプト拡張機能 を使用するのが最適です。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":81},{"question":"問題文：\nあなたは Windows Server 2019 を実行する VM1 という名前の Azure 仮想マシンを持っています。この VM はデフォルトのドライブ設定を使用してデプロイされました。\nあなたは User1 という名前のユーザーとして VM1 にサインインし、以下のアクションを実行します：\n・C ドライブにファイルを作成する。\n・D ドライブにファイルを作成する。\n・スクリーンセーバーのタイムアウトを変更する。\n・デスクトップの背景を変更する。\nあなたは VM1 を再デプロイ (redeploy) する予定です。\nVM1 の再デプロイ後に失われる変更はどれですか？","options":[{"label":"A","text":"変更されたスクリーンセーバーのタイムアウト"},{"label":"B","text":"新しいデスクトップの背景"},{"label":"C","text":"D ドライブの新しいファイル"},{"label":"D","text":"C ドライブの新しいファイル"}],"correct":"C","explanation":"Azure VM の「再デプロイ (Redeploy)」は、仮想マシンの稼働に問題が生じた際などに、VM を現在の Azure ホストノードから別の正常なホストノードに移動させる機能です。この際、OS ディスク（C ドライブ）およびアタッチされたデータディスクの内容はそのまま保持されます。しかし、デフォルトで割り当てられている「一時ディスク（D ドライブ）」は物理ホストに依存しているため、ホストが移動することでデータは完全に失われます。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":82},{"question":"問題文：\nあなたは Azure サブスクリプションを持っています。\nあなたはオンプレミスに VM1 という名前の仮想マシンを持っています。VM1 の設定は展示に示されています。（展示タブをクリックします。）\n\n（※展示の例：ハードドライブの形式が VHDX として構成されている）\nVM1 にアタッチされているディスクを Azure 仮想マシンのテンプレートとして使用できるようにする必要があります。\nVM1 で何を変更すべきですか？","options":[{"label":"A","text":"メモリ"},{"label":"B","text":"ネットワーク アダプター"},{"label":"C","text":"ハードドライブ"},{"label":"D","text":"プロセッサ"},{"label":"E","text":"統合サービス (Integration Services)"}],"correct":"C","explanation":"オンプレミスの Hyper-V 仮想マシンのディスクを Azure にアップロードして VM テンプレートとして使用する場合、Azure は .vhd 形式かつ固定サイズのディスクのみをサポートしています（.vhdx や動的拡張ディスクはサポートされていません）。そのため、ハードドライブのフォーマットを VHDX から VHD に変換する必要があります。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":83},{"question":"問題文：\nあなたの会社の複数の部門で使用される Subscription1 という名前の Azure サブスクリプションがあります。Subscription1 には以下の表のリソースが含まれています：\n\n（※表の例：RG1 というリソースグループが存在する）\n別の管理者が、単一の Azure Resource Manager テンプレートを使用して、VM1 という名前の仮想マシンと storage2 という名前の Azure ストレージ アカウントをデプロイします。\nあなたはデプロイに使用されたテンプレートを表示する必要があります。\nどのブレードから、デプロイに使用されたテンプレートを表示できますか？","options":[{"label":"A","text":"VM1"},{"label":"B","text":"RG1"},{"label":"C","text":"storage2"},{"label":"D","text":"container1"}],"correct":"B","explanation":"ARM テンプレートを使用してリソースがデプロイされた場合、そのデプロイメント履歴や、実行時に使用されたテンプレート本体（JSON）は、対象リソースが配置された「リソースグループ (RG1)」の「デプロイ (Deployments)」ブレードに保存されます。VM1やstorage2などの個別のリソースブレードからは、過去のデプロイ時のテンプレート履歴を見ることはできません。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":84},{"question":"問題文：\nあなたは App1 という名前の Azure Web アプリを持っています。App1 には以下の表に示すデプロイメント スロットがあります：\n\n（※表の例：webapp1-prod [本番] と webapp1-test [テスト]）\nwebapp1-test で、あなたは App1 に対するいくつかの変更をテストします。\nあなたは App1 のバックアップを作成します。\nwebapp1-test を webapp1-prod とスワップ (Swap) したところ、App1 でパフォーマンスの問題が発生していることがわかりました。\nできるだけ早く App1 を以前のバージョンに戻す必要があります。\n何をすべきですか？","options":[{"label":"A","text":"App1 を再デプロイする"},{"label":"B","text":"スロットをスワップする"},{"label":"C","text":"App1 をクローンする"},{"label":"D","text":"App1 のバックアップを復元する"}],"correct":"B","explanation":"App Service のスロットをスワップ（入れ替え）して本番環境にデプロイした後で問題が発覚した場合、最も迅速かつ安全に元の状態（以前のバージョン）にロールバックする方法は「もう一度スロットをスワップする（Swap back）」ことです。これにより、現在のテストスロットに退避されている直前の本番環境の状態と瞬時に入れ替わり、ダウンタイムなしに復旧できます。\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":85},{"question":"（注：この問題は、同じシナリオを提示する一連の質問の一部です。質問ごとに独自の解決策が提示されており、それぞれの解決策が目標を満たすかどうかを判断します。）\nAzure仮想マシン「VM1」があります。VM1は、「ARM1.json」というカスタムAzure Resource Managerテンプレートを使用してデプロイされました。\nVM1がハードウェアメンテナンスの影響を受けるという通知を受け取りました。\nVM1を直ちに別のホストに移動させる必要があります。\n解決策：概要ブレードから、仮想マシンを別のリソースグループに移動する。\nこれは目標を満たしていますか？","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"}],"correct":"B","explanation":"リソースグループの移動は、リソースを論理的な管理グループ間で移すだけであり、仮想マシンが稼働している物理ホスト（サーバー）を変更するものではありません。別の物理ホストに移動するには、「再デプロイ（Redeploy）」機能を使用する必要があります。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":86},{"question":"米国西部（West US）、米国中部（Central US）、および米国東部（East US）のAzureリージョンにWebアプリがあります。\n以下の表に示すApp Serviceプランがあります。（※各リージョンでWindows OSを使用する既存のプランがある前提）\n\nLinuxオペレーティングシステムを使用する、「ASP5」という名前の追加のApp Serviceプランを作成する予定です。\n現在使用されている場所（リージョン）のうち、ASP5をデプロイできる場所を特定する必要があります。\n何を推奨すべきですか？","options":[{"label":"A","text":"米国西部、米国中部、または米国東部"},{"label":"B","text":"米国中部のみ"},{"label":"C","text":"米国東部のみ"},{"label":"D","text":"米国西部のみ"}],"correct":"A","explanation":"Azure App Serviceには、「同じリソースグループかつ同じリージョン内に、WindowsとLinux両方のApp Serviceプランを混在させることはできない」という制限があります。しかし、新規に別のリソースグループを作成すれば制約を回避できるため、問題文の条件においてリージョン自体へのデプロイ制限はありません。したがって、米国西部、米国中部、米国東部のどのリージョンでもLinuxのApp Serviceプランを作成可能です。\n\n【関連する出題項目】\n③ Azure のコンピューティング リソースをデプロイおよび管理する","id":87},{"question":"Azure Resource Managerテンプレートを使用して、Windows Server 2019を実行する複数のAzure仮想マシンを仮想マシンスケールセットにデプロイする予定です。\nデプロイ後、すべての仮想マシンでNGINXが利用可能になっていることを確認する必要があります。\n何を使用する必要がありますか？","options":[{"label":"A","text":"New-AzConfigurationAssignment コマンドレット"},{"label":"B","text":"Desired State Configuration（DSC）拡張機能"},{"label":"C","text":"Azure Active Directory（Azure AD）アプリケーションプロキシ"},{"label":"D","text":"Azure Application Insights"}],"correct":"B","explanation":"仮想マシンのデプロイ後に特定のソフトウ
