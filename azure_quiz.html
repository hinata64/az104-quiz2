"label":"A","text":"Log Analytics ワークスペースへの送信"},{"label":"B","text":"ストレージアカウントへのアーカイブ"},{"label":"C","text":"Azure Event Hub へのストリーム"}],"correct":"A","explanation":"Kusto照会言語 (KQL) を使用してログのクエリ・分析を実行するには、ログデータを「Log Analytics ワークスペース」に送信して保存する必要があります。ストレージアカウントは長期保管（アーカイブ）目的、Event Hubは外部システムへのリアルタイムストリーミング目的で使用されます。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":200},{"question":"Azureサブスクリプションがあります。このサブスクリプションには、Windows Serverを実行する仮想マシンが含まれています。\nRule1という名前のデータ収集ルール (DCR) があります。\nAzure Monitorエージェントを使用して、Windowsシステムイベントログからイベントを収集する予定です。\nIDが1001のシステムイベントのみを収集する必要があります。\nRule1のデータソースには、どのタイプのクエリを使用すべきですか？","options":[{"label":"A","text":"SQL"},{"label":"B","text":"XPath"},{"label":"C","text":"KQL"}],"correct":"B","explanation":"Azure Monitor エージェント (AMA) を使用してWindowsイベントログをフィルタリング（特定のイベントIDだけを抽出など）して収集する場合、DCRのデータソース設定において「XPath」クエリ構文を使用します。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理","id":201},{"question":"Azureサブスクリプションがあります。このサブスクリプションには、Windows Serverを実行する10台の仮想マシンが含まれています。各仮想マシンはIISでWebサイトをホストしており、Azure Monitorエージェントがインストールされています。\n各仮想マシンからIISログを収集し、Log Analyticsワークスペースに保存する必要があります。\n最初に何を構成すべきですか？","options":[{"label":"A","text":"データ収集エンドポイント (DCE)"},{"label":"B","text":"Azure Monitor Private Link スコープ (AMPLS)"},{"label":"C","text":"診断設定"},{"label":"D","text":"VM insights"},{"label":"E","text":"プライベートエンドポイント"}],"correct":"A","explanation":"Azure Monitor エージェント (AMA) を使用して「IISログ」や「カスタムテキストログ」を収集する場合、通信の受け皿となる「データ収集エンドポイント (Data Collection Endpoint: DCE)」を作成し、データ収集ルール (DCR) と関連付けることが必須となります。\n\n【関連する出題項目】 ⑤Azure リソースの監視と管理\n\n【問題文】(ケーススタディの前提条件 ※各問共通)\n\n概要\nContoso, Ltd.は、モントリオールに本社を置き、シアトルとニューヨークに支社を持つコンサルティング会社です。\n\n既存の環境\nContosoには、Azure Active Directory (Azure AD) テナントにリンクされた Sub1 という名前のAzureサブスクリプションがあります。ネットワークには、Azure ADテナントと同期するオンプレミスのActive Directoryドメインが含まれています。\nAzure ADテナントには、User1〜User4 などのユーザーが含まれています。\n\nSub1には、RG1とRG2という2つのリソースグループと、複数の仮想ネットワーク（VNET1, VNET2: 米国東部、VNET3: 米国西部）が含まれています。\n・User1はRG1のリソースを管理します。","id":202}];
let QUESTIONS = [...BASE_QUESTIONS];
let qs=[],idx=0,score=0,answered=false,mode='all';

function updateCount(){document.getElementById('total-count').textContent=QUESTIONS.length;}
updateCount();

function selMode(m,el){mode=m;document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function show(id){document.querySelectorAll('.screen').forEach(s=>{s.classList.toggle('active',s.id===id);});}

function startQuiz(){
  let pool=[...QUESTIONS];
  if(mode==='yn')pool=pool.filter(q=>q.options.length===2);
  else if(mode==='multi')pool=pool.filter(q=>q.options.length>2);
  if(mode==='shuffle')pool=shuffle(pool);
  qs=pool;idx=0;score=0;show('s-quiz');renderQ();
}

function renderQ(){
  const q=qs[idx];answered=false;
  const total=qs.length,pct=Math.round((idx/total)*100);
  document.getElementById('qc').textContent=`${idx+1} / ${total}`;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('sd').textContent=`正解: ${score}`;
  document.getElementById('ql').textContent=`問題 ${idx+1}`;
  document.getElementById('qt').textContent=q.question;
  const oc=document.getElementById('oc');oc.innerHTML='';
  q.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.innerHTML=`<span class="opt-lbl">${opt.label}</span><span>${opt.text}</span>`;
    b.onclick=()=>pick(opt.label,b);
    oc.appendChild(b);
  });
  document.getElementById('exp').style.display='none';
  document.getElementById('nb').style.display='none';
}

function pick(label,btn){
  if(answered)return;answered=true;
  const q=qs[idx];const correct=q.correct;const ok=label===correct;
  if(ok)score++;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const l=b.querySelector('.opt-lbl').textContent;
    if(l===correct)b.classList.add('ok');
    else if(l===label&&!ok)b.classList.add('ng');
  });
  document.getElementById('ex').textContent=q.explanation;
  document.getElementById('exp').style.display='';
  document.getElementById('nb').style.display='';
  document.getElementById('sd').textContent=`正解: ${score}`;
}

function nextQ(){idx++;if(idx>=qs.length)showResult();else renderQ();}
function showResult(){
  show('s-result');
  const total=qs.length,pct=Math.round((score/total)*100);
  document.getElementById('rp').textContent=pct+'%';
  const msg=pct>=80?'🎉 素晴らしい！':pct>=60?'もう少しです！':'復習して再チャレンジ！';
  document.getElementById('rb').textContent=`${score}問 / ${total}問 正解 — ${msg}`;
  document.getElementById('rcv').textContent=score;
  document.getElementById('rwv').textContent=total-score;
}
function goHome(){show('s-start');}

// ---- ADD QUESTION ----
function addQuestion(){
  const q=document.getElementById('add-q').value.trim();
  if(!q){alert('問題文を入力してください');return;}
  const rows=document.querySelectorAll('#add-opts .opt-row');
  const opts=[];
  rows.forEach(row=>{
    const label=row.querySelector('.opt-label-input').value;
    const text=row.querySelector('.opt-text-input').value.trim();
    if(text)opts.push({label,text});
  });
  if(opts.length<2){alert('選択肢を2つ以上入力してください');return;}
  const correct=document.getElementById('add-correct').value;
  const exp=document.getElementById('add-exp').value.trim();
  QUESTIONS.push({question:q,options:opts,correct,explanation:exp,id:QUESTIONS.length+1});
  updateCount();
  document.getElementById('add-q').value='';
  document.querySelectorAll('#add-opts .opt-text-input').forEach(i=>i.value='');
  document.getElementById('add-exp').value='';
  const msg=document.getElementById('add-msg');
  msg.textContent=`✓ 問題を追加しました（現在 ${QUESTIONS.length} 問）`;
  msg.style.display='block';
  setTimeout(()=>msg.style.display='none',3000);
}

function exportQuestions(){
  const added=QUESTIONS.slice(BASE_QUESTIONS.length);
  if(!added.length){alert('追加した問題がありません');return;}
  const blob=new Blob([JSON.stringify(added,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='added_questions.json';
  a.click();
}

function importQuestions(){document.getElementById('import-file').click();}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      const arr=Array.isArray(data)?data:[data];
      arr.forEach(q=>{
        if(q.question&&q.options&&q.correct){
          QUESTIONS.push({...q,id:QUESTIONS.length+1});
        }
      });
      updateCount();
      const msg=document.getElementById('add-msg');
      msg.textContent=`✓ ${arr.length}問インポートしました（現在 ${QUESTIONS.length} 問）`;
      msg.style.display='block';
      setTimeout(()=>msg.style.display='none',3000);
    }catch(err){alert('JSONの読み込みに失敗しました: '+err.message);}
  };
  r.readAsText(file);
  e.target.value='';
}
</script>
